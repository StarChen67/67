<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no, viewport-fit=cover">
<title>星痕御獸錄 · Monster Tamer</title>
<style>
:root{
  --bg:#0d1017; --bg2:#151a25; --panel:#1b2231; --panel2:#232c3f;
  --line:#2e3950; --fg:#e6ecf7; --dim:#8b98b0; --acc:#5cc8ff; --gold:#ffd166;
  --ok:#4ecb71; --bad:#ff5d6c; --warn:#ffb03a;
  --t-normal:#b9b6a8; --t-fire:#ff6b3d; --t-water:#3da5ff; --t-grass:#4ecb71;
  --t-elec:#ffd63d; --t-rock:#c08a4e; --t-mystic:#c07dff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:radial-gradient(1200px 700px at 50% -10%,#1b2740 0%,var(--bg) 60%);
  color:var(--fg);font:14px/1.5 "Segoe UI","Microsoft JhengHei",system-ui,sans-serif;
  overflow:hidden;user-select:none;
}
#app{max-width:860px;margin:0 auto;height:100%;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
canvas{image-rendering:auto;display:block}
.hide{display:none!important}

/* ---------- header ---------- */
header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#1a2233,#141a26)}
.logo{font-weight:800;letter-spacing:2px;font-size:15px;
  background:linear-gradient(90deg,#7de2ff,#c07dff,#ffd166);-webkit-background-clip:text;background-clip:text;color:transparent}
.hstat{margin-left:auto;display:flex;gap:14px;font-size:13px;align-items:center}
.hstat b{color:var(--gold)}
.badges{display:flex;gap:3px}
.bdg{width:14px;height:14px;border-radius:50%;border:1px solid var(--line);background:#0e131d}
.bdg.on{background:radial-gradient(circle at 35% 30%,#fff6c8,#ffb62e);border-color:#ffd166;box-shadow:0 0 8px #ffb62e88}

/* ---------- tabs ---------- */
nav{display:flex;border-bottom:1px solid var(--line);background:#121826}
nav button{flex:1;padding:11px 4px;font-size:13px;color:var(--dim);border-bottom:2px solid transparent}
nav button.on{color:var(--fg);border-bottom-color:var(--acc);background:#182136}
main{flex:1;overflow:auto;padding:12px;-webkit-overflow-scrolling:touch}
main::-webkit-scrollbar{width:8px}
main::-webkit-scrollbar-thumb{background:#2c3850;border-radius:4px}

.card{background:linear-gradient(180deg,var(--panel),#182031);border:1px solid var(--line);
  border-radius:12px;padding:12px;margin-bottom:10px}
.card h3{margin:0 0 8px;font-size:14px;display:flex;align-items:center;gap:8px}
.muted{color:var(--dim);font-size:12px}
.row{display:flex;gap:8px;align-items:center}
.grid{display:grid;gap:8px}
.btn{background:linear-gradient(180deg,#2d3a54,#222c42);border:1px solid #3b4a68;border-radius:9px;
  padding:9px 14px;font-size:13px;transition:.12s;white-space:nowrap}
.btn:hover{filter:brightness(1.2)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:linear-gradient(180deg,#2a6fa8,#1d4f7c);border-color:#4a95d0}
.btn.gold{background:linear-gradient(180deg,#7a5c1c,#5c4413);border-color:#b58a2a;color:#ffe9a8}
.btn.dan{background:linear-gradient(180deg,#8a2b38,#65202a);border-color:#c04a5a}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ---------- type chips ---------- */
.tp{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;font-weight:700;color:#0e1017}
.tp.normal{background:var(--t-normal)}.tp.fire{background:var(--t-fire)}.tp.water{background:var(--t-water)}
.tp.grass{background:var(--t-grass)}.tp.elec{background:var(--t-elec)}.tp.rock{background:var(--t-rock)}
.tp.mystic{background:var(--t-mystic)}

/* ---------- hp bars ---------- */
.bar{height:7px;border-radius:5px;background:#0d1220;overflow:hidden;border:1px solid #29334a}
.bar>i{display:block;height:100%;border-radius:5px;transition:width .45s cubic-bezier(.4,0,.2,1);background:var(--ok)}
.bar.exp>i{background:linear-gradient(90deg,#5cc8ff,#7de2ff);transition:width .3s}
.bar.exp{height:4px}

/* ---------- monster rows ---------- */
.mon{display:flex;gap:10px;align-items:center;background:#1a2233;border:1px solid var(--line);
  border-radius:11px;padding:8px 10px;cursor:pointer;transition:.12s}
.mon:hover{border-color:#46587c;background:#1f293c}
.mon.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.mon.fnt{opacity:.45;filter:grayscale(.8)}
.mon .nm{font-weight:600;font-size:13px}
.mon .mid{flex:1;min-width:0}
.avatar{width:58px;height:58px;flex:none;border-radius:10px;
  background:radial-gradient(circle at 50% 75%,#26314a,#141a27);border:1px solid #2b3752}
.stx{display:inline-block;font-size:10px;padding:0 5px;border-radius:4px;font-weight:700;color:#111}
.stx.burn{background:#ff7a45}.stx.para{background:#ffd63d}.stx.psn{background:#c07dff}.stx.slp{background:#8fa3c7}

/* ---------- explore ---------- */
.areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.area{border:1px solid var(--line);border-radius:11px;padding:10px;background:#182031;cursor:pointer;position:relative;overflow:hidden}
.area.on{background:#1d2a41;border-color:var(--acc)}
.area.lock{opacity:.42;cursor:not-allowed}
.area b{font-size:13px}
.area .lv{font-size:11px;color:var(--dim)}
.area .glow{position:absolute;inset:-40% -20% auto auto;width:120px;height:120px;border-radius:50%;filter:blur(28px);opacity:.35}

#feed{max-height:210px;overflow:auto;font-size:12.5px;line-height:1.7}
#feed div{padding:2px 0;border-bottom:1px dashed #232c3f;color:var(--dim)}
#feed div b{color:var(--fg)}

/* ---------- battle ---------- */
#bt{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;
  background:radial-gradient(900px 500px at 50% 20%,#1d2b45,#080b12 75%)}
#bt.wild{background:radial-gradient(900px 500px at 50% 20%,#16321f,#080b12 75%)}
#bt.boss{background:radial-gradient(900px 500px at 50% 20%,#3a1a2a,#080b12 75%)}
.field{flex:1;position:relative;max-width:860px;width:100%;margin:0 auto;min-height:0}
.slot{position:absolute;display:flex;flex-direction:column;align-items:center}
.slot.foe{top:5%;right:5%}
.slot.mine{bottom:6%;left:5%}
.slot canvas{filter:drop-shadow(0 8px 14px #0009)}
.info{background:#121a29e6;border:1px solid #35435e;border-radius:10px;padding:6px 10px;min-width:172px;backdrop-filter:blur(6px)}
.slot.foe .info{margin-bottom:4px}
.slot.mine .info{margin-top:4px}
.info .l1{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600}
.info .l1 .lv{margin-left:auto;color:var(--dim);font-weight:400;font-size:11px}
.info .hpn{text-align:right;font-size:10.5px;color:var(--dim);margin-top:1px}
.ball-row{display:flex;gap:3px;justify-content:flex-end;margin-top:3px}
.pb{width:9px;height:9px;border-radius:50%;background:#3a465e;border:1px solid #556a8d}
.pb.alive{background:radial-gradient(circle at 35% 30%,#fff,#ff5d6c);border-color:#ff8b96}
.pb.dead{background:#28313f;border-color:#3a465e}

.logbox{background:#0b0f18e8;border-top:1px solid #2b3752;padding:10px 14px;min-height:62px;
  max-width:860px;width:100%;margin:0 auto;font-size:13.5px;line-height:1.55}
.cmds{background:#111825;border-top:1px solid #2b3752;padding:10px;max-width:860px;width:100%;margin:0 auto}
.cmd4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mv{border:1px solid #3b4a68;border-radius:10px;padding:8px 10px;text-align:left;
  background:linear-gradient(180deg,#243147,#1b2436)}
.mv:hover{filter:brightness(1.25)}
.mv .t{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.mv .p{font-size:11px;color:var(--dim);display:flex;gap:8px;margin-top:2px}
.mv.no{opacity:.4}
.shake{animation:shk .35s}
@keyframes shk{0%,100%{transform:translate(0)}20%{transform:translate(-8px,3px)}40%{transform:translate(7px,-3px)}60%{transform:translate(-5px,2px)}80%{transform:translate(4px,-1px)}}
.flash{animation:fls .3s}
@keyframes fls{0%,100%{filter:none}50%{filter:brightness(3) saturate(0)}}
.fade{animation:fdo .5s forwards}
@keyframes fdo{to{opacity:0;transform:translateY(26px) scale(.7)}}
.enter{animation:ent .4s}
@keyframes ent{from{opacity:0;transform:translateY(-20px) scale(.6)}}

/* ---------- overlay ---------- */
#ov{position:fixed;inset:0;z-index:80;background:#060910dd;display:flex;align-items:center;
  justify-content:center;padding:18px;backdrop-filter:blur(3px)}
.dlg{background:linear-gradient(180deg,#1e2739,#151c2b);border:1px solid #3b4a68;border-radius:16px;
  padding:18px;max-width:420px;width:100%;text-align:center;box-shadow:0 24px 60px #000a}
.dlg h2{margin:0 0 6px;font-size:18px}
.dlg .btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.starter{display:flex;gap:8px;justify-content:center;margin-top:10px}
.stc{border:1px solid var(--line);border-radius:12px;padding:8px;cursor:pointer;background:#182031;flex:1}
.stc:hover{border-color:var(--acc)}
input.txt{background:#0e1420;border:1px solid #35435e;border-radius:8px;padding:9px 11px;color:var(--fg);
  font:inherit;width:100%;text-align:center}
#toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);z-index:90;display:flex;
  flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:#0f1725ee;border:1px solid #3b4a68;border-radius:20px;padding:7px 16px;font-size:12.5px;
  animation:tin .3s;box-shadow:0 8px 24px #0007}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
.itemrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);
  border-radius:10px;background:#182031;margin-bottom:6px}
.itemrow .ic{width:30px;height:30px;flex:none;border-radius:8px;display:grid;place-items:center;font-size:16px;background:#232c3f}
.dexg{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.dexc{border:1px solid var(--line);border-radius:10px;padding:6px;text-align:center;background:#182031;cursor:pointer}
.dexc.unk{opacity:.35}
.dexc .n{font-size:11px;margin-top:2px}
.sbar{display:grid;grid-template-columns:34px 1fr 30px;gap:6px;align-items:center;font-size:11px;margin-bottom:3px}
.sbar .b{height:6px;background:#0d1220;border-radius:4px;overflow:hidden}
.sbar .b i{display:block;height:100%;background:linear-gradient(90deg,#5cc8ff,#c07dff)}
@media(max-width:560px){
  .slot.foe{top:3%;right:3%}.slot.mine{bottom:3%;left:3%}
  .info{min-width:150px}
  main{padding:10px}
}
</style>

<div id="app">
  <header>
    <span class="logo">★ 星痕御獸錄</span>
    <div class="hstat">
      <span id="hName" class="muted"></span>
      <span>💰<b id="hGold">0</b></span>
      <span class="badges" id="hBadges"></span>
    </div>
  </header>
  <nav>
    <button data-t="explore" class="on">🗺️ 探索</button>
    <button data-t="team">🐾 隊伍</button>
    <button data-t="bag">🎒 背包</button>
    <button data-t="shop">🏪 商店</button>
    <button data-t="dex">📖 圖鑑</button>
  </nav>
  <main id="main"></main>
</div>
<div id="toast"></div>
<div id="ov" class="hide"></div>
<div id="bt" class="hide"></div>

let UID=1;
function makeMon(spid,lv,opt){
  opt=opt||{};
  const sp=SP[spid];
  const m={u:'m'+(UID++)+'_'+Date.now().toString(36),sp:spid,lv:lv,xp:0,
    iv:{hp:rnd(0,31),atk:rnd(0,31),def:rnd(0,31),spd:rnd(0,31)},
    st:null, mv:[], hp:0, nick:null, shiny:chance(1/220)};
  // 依等級決定技能(取最後 4 個習得的)
  const learn=sp.ls.filter(x=>x[0]<=lv).map(x=>x[1]);
  const uniq=[...new Set(learn)].slice(-4);
  m.mv=uniq.map(id=>({id,pp:SK[id].pp}));
  if(!m.mv.length) m.mv=[{id:'tackle',pp:35}];
  m.hp=maxHP(m);
  return m;
}
function maxHP(m){const sp=SP[m.sp];return Math.floor((2*sp.b.hp+m.iv.hp)*m.lv/100)+m.lv+10;}
function stat(m,k){
  const sp=SP[m.sp];
  let v=Math.floor((2*sp.b[k]+m.iv[k])*m.lv/100)+5;
  if(m.st==='burn'&&k==='atk') v=Math.floor(v*.55);
  if(m.st==='para'&&k==='spd') v=Math.floor(v*.55);
  return v;
}
function name(m){return m.nick||SP[m.sp].n;}
function xpNext(m){return Math.floor(Math.pow(m.lv+1,3)*0.72);}
function alive(m){return m.hp>0;}
function healAll(){ (S.party||[]).forEach(m=>{m.hp=maxHP(m);m.st=null;m.mv.forEach(v=>v.pp=SK[v.id].pp);}); }
function dexSee(spid){ if(!S.dex[spid])S.dex[spid]={s:0,c:0}; S.dex[spid].s=1; }
function dexCatch(spid){ dexSee(spid); S.dex[spid].c=1; }

/* ============================================================
   Sprite —— 程序化繪製
   ============================================================ */
function shade(hex,f){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  if(f>0){r+= (255-r)*f; g+=(255-g)*f; b+=(255-b)*f;}
  else{r*=1+f;g*=1+f;b*=1+f;}
  return '#'+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('');
}
function ell(c,x,y,rx,ry,col){c.fillStyle=col;c.beginPath();c.ellipse(x,y,rx,ry,0,0,Math.PI*2);c.fill();}
function tri(c,pts,col){c.fillStyle=col;c.beginPath();c.moveTo(pts[0],pts[1]);c.lineTo(pts[2],pts[3]);c.lineTo(pts[4],pts[5]);c.closePath();c.fill();}
function rrect(c,x,y,w,h,r,col){c.fillStyle=col;c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.fill();}

function drawEye(c,x,y,r,col){
  ell(c,x,y,r,r*1.12,'#fff');
  ell(c,x+r*.15,y+r*.1,r*.62,r*.72,col||'#20140a');
  ell(c,x+r*.42,y-r*.38,r*.24,r*.24,'#fff');
}
function drawTail(c,a,x,y,dir){
  const d=dir||-1, dk=shade(a.c1,-.18);
  if(a.tail==='bushy'){ell(c,x,y,13,11,dk);ell(c,x-4*d,y+2,8,7,a.c2);}
  else if(a.tail==='flame'){
    tri(c,[x+8*d,y+6,x-14*d,y-16,x-2*d,y+8],a.c3||'#ffb03a');
    tri(c,[x+5*d,y+5,x-9*d,y-9,x-1*d,y+7],'#fff0a0');
  }
  else if(a.tail==='leaf'){ell(c,x-3*d,y-4,10,6,shade(a.c1,.1));ell(c,x-11*d,y-11,8,5,a.c2);}
  else if(a.tail==='vine'){
    c.strokeStyle=dk;c.lineWidth=4;c.beginPath();c.moveTo(x+6*d,y);
    c.quadraticCurveTo(x-14*d,y+6,x-16*d,y-14);c.stroke();
    ell(c,x-16*d,y-16,6,4,a.c2);
  }
  else if(a.tail==='spark'){
    c.fillStyle=a.c3||'#ffd166';c.beginPath();
    c.moveTo(x+6*d,y+4);c.lineTo(x-6*d,y-2);c.lineTo(x-2*d,y-6);
    c.lineTo(x-16*d,y-20);c.lineTo(x-6*d,y-12);c.lineTo(x-10*d,y-6);c.closePath();c.fill();
  }
  else if(a.tail==='puff'){ell(c,x,y,9,9,a.c2);}
  else if(a.tail==='fin'){tri(c,[x+6*d,y+4,x-14*d,y-10,x-12*d,y+8],a.c3||shade(a.c1,.2));}
  else if(a.tail==='thin'){c.strokeStyle=dk;c.lineWidth=5;c.lineCap='round';c.beginPath();
    c.moveTo(x+5*d,y);c.quadraticCurveTo(x-12*d,y+4,x-16*d,y-10);c.stroke();}
}
function drawEar(c,a,x,y,d){
  if(a.ear==='tall'){
    tri(c,[x,y,x-7*d,y-24,x+7*d,y-6],a.c1);
    tri(c,[x,y-2,x-4*d,y-18,x+4*d,y-6],a.c2);
  }else if(a.ear==='round'){ell(c,x,y-6,8,8,a.c1);ell(c,x,y-5,4.5,4.5,a.c2);}
  else if(a.ear==='leaf'){ell(c,x-3*d,y-10,9,5,shade(a.c1,.15));ell(c,x+4*d,y-13,7,4,a.c2);}
  else if(a.ear==='fin'){tri(c,[x,y,x-3*d,y-16,x+9*d,y-4],a.c3||shade(a.c1,.25));}
}
function drawHorn(c,a,x,y,d){
  const col=a.c3||'#ffe0a0';
  tri(c,[x-4*d,y,x-10*d,y-20,x+1*d,y-4],col);
  tri(c,[x+9*d,y-2,x+7*d,y-20,x+15*d,y-4],col);
}
function drawWing(c,a,x,y,d,t){
  const col=a.c3||shade(a.c1,.3), f=Math.sin(t/220)*5;
  c.save();c.globalAlpha=.92;
  tri(c,[x,y,x-26*d,y-26+f,x-6*d,y+14],col);
  tri(c,[x,y,x-18*d,y-30+f,x-2*d,y+2],shade(col,.25));
  c.restore();
}

function drawMon(cv,spid,o){
  o=o||{};
  const c=cv.getContext('2d'), W=cv.width, H=cv.height, sp=SP[spid];
  c.clearRect(0,0,W,H);
  if(!sp)return;
  const a=sp.art, t=o.t||0, s=W/100;
  c.save();
  if(o.flip){c.translate(W,0);c.scale(-1,1);}
  c.scale(s,s);
  // 影子
  c.save();c.globalAlpha=.3;ell(c,50,93,28,6,'#000');c.restore();
  const sz=(a.size||1)*(o.scale||1), bob=Math.sin(t/420)*1.6;
  c.translate(50,96);c.scale(sz,sz);c.translate(-50,-96+bob);
  if(o.shiny){c.save();c.shadowColor='#ffe066';c.shadowBlur=14;}
  (BODY[a.body]||BODY.quad)(c,a,t);
  if(o.shiny)c.restore();
  c.restore();
  if(o.faint){
    c.globalCompositeOperation='saturation';c.fillStyle='#808080';c.fillRect(0,0,W,H);
    c.globalCompositeOperation='source-over';
  }
}
function monCanvas(spid,size,opt){
  const cv=document.createElement('canvas');
  const dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=size*dpr;cv.height=size*dpr;
  cv.style.width=size+'px';cv.style.height=size+'px';
  drawMon(cv,spid,Object.assign({t:0},opt||{}));
  return cv;
}

async function explore(){
  if(!S.party.some(alive)){toast('❗ 全隊無法戰鬥,先去治療所');return true;}
  S.steps++;
  const A=AREAS[S.area], r=Math.random();
  if(r<.68){
    const spid=weightedWild(A);
    const lv=rnd(A.lv[0],A.lv[1]);
    const wild=makeMon(spid,lv);
    feed(`草叢晃動…野生的 <b>${SP[spid].n}</b> Lv.${lv} 出現了!`);
    await startBattle({wild:wild});
    renderAll();
    return true;
  }else if(r<.90){
    const pool=['ball','ball','ball','potion','greatball','antidote','ether','spotion'];
    const it=S.area>=3?pick(pool.concat(['ultraball','revive','spotion'])):pick(pool);
    S.bag[it]=(S.bag[it]||0)+1;
    feed(`撿到了 ${ITEM[it].ic} <b>${ITEM[it].n}</b>!`);
    toast(`${ITEM[it].ic} 獲得 ${ITEM[it].n}`);
  }else{
    const g=rnd(60,120)*(S.area+1);
    S.money+=g;
    feed(`在地上發現了 💰<b>${g}</b> 金幣。`);
    toast('💰 +'+g);
  }
  save();renderHeader();
  return false;
}
function weightedWild(A){
  // 稀有種降低出現率
  const pool=[];
  A.mon.forEach(id=>{const w=SP[id].rate<10?1:SP[id].rate<70?4:10;for(let i=0;i<w;i++)pool.push(id);});
  return pick(pool);
}
async function bossFight(){
  const A=AREAS[S.area], B=A.boss;
  if(!S.party.some(alive)){toast('❗ 全隊無法戰鬥');return;}
  const go=await dialog(`<h2>⚔️ ${B.n}</h2>
    <div class="muted">隊伍:${B.team.map(t=>SP[t[0]].n+' Lv.'+t[1]).join('、')}</div>
    <div class="muted" style="margin-top:6px">獲勝獎勵 💰${B.money}${S.badges===S.area?' + 徽章':''}</div>
    <div class="btns"><button class="btn pri" onclick="closeDlg(1)">開戰</button>
    <button class="btn" onclick="closeDlg(0)">再準備一下</button></div>`);
  if(!go)return;
  const team=B.team.map(t=>makeMon(t[0],t[1]));
  const win=await startBattle({trainer:{name:B.n,team:team,money:B.money},boss:true});
  if(win){
    S.money+=B.money;
    if(S.badges===S.area){
      S.badges++;
      if(S.unlock<AREAS.length)S.unlock=Math.min(AREAS.length,S.unlock+1);
      feed(`擊敗 <b>${B.n}</b>!獲得徽章與 💰${B.money}。`);
      if(S.badges>=AREAS.length){
        S.bag.masterball=(S.bag.masterball||0)+1;
        await dialog(`<h2>👑 你成為了冠軍!</h2>
          <div class="muted">六枚徽章齊聚,星痕的光照亮了你。<br>獲得傳說道具 🟣 <b>大師球</b>!</div>
          <div class="muted" style="margin-top:8px">星辰之巔仍可繼續探索,傳說御獸 <b>星辰龍</b> 與 <b>炎獄魔像</b> 在等著你。</div>
          <div class="btns"><button class="btn pri" onclick="closeDlg(1)">繼續旅程</button></div>`);
      }else{
        await dialog(`<h2>🏅 獲得徽章!</h2><div class="muted">新區域「${AREAS[S.unlock-1].n}」已解鎖!</div>
          <div class="btns"><button class="btn pri" onclick="closeDlg(1)">好</button></div>`);
      }
    }else{
      feed(`再次擊敗 <b>${B.n}</b>,獲得 💰${B.money}。`);
    }
  }
  renderAll();
}

        <div class="bar" style="margin-top:4px"><i style="width:${rt*100}%;background:${hpColor(rt)}"></i></div>
        <div class="muted">${mo.hp}/${maxHP(mo)}</div></div>`;

  }});
  if(!target)return;
  const r=useItemOn(key,target);

function useItemOn(key,m){
  const it=ITEM[key];
  if(it.k==='heal'){
    if(!alive(m))return{ok:0,msg:'瀕死狀態無法使用傷藥'};
    if(m.hp>=maxHP(m))return{ok:0,msg:'HP 已滿'};
    const before=m.hp;m.hp=Math.min(maxHP(m),m.hp+it.v);
    return{ok:1,msg:`${name(m)} 回復了 ${m.hp-before} HP`};
  }
  if(it.k==='cure'){ if(!m.st)return{ok:0,msg:'沒有異常狀態'}; m.st=null;return{ok:1,msg:name(m)+' 恢復正常'};}
  if(it.k==='revive'){ if(alive(m))return{ok:0,msg:'不需要復活'}; m.hp=Math.ceil(maxHP(m)/2);m.st=null;
    return{ok:1,msg:'✨ '+name(m)+' 復活了!'};}
  if(it.k==='ether'){
    let any=0;m.mv.forEach(v=>{if(v.pp<SK[v.id].pp){v.pp=Math.min(SK[v.id].pp,v.pp+10);any=1;}});
    return any?{ok:1,msg:name(m)+' 的 PP 回復了'}:{ok:0,msg:'PP 已滿'};
  }
  if(it.k==='candy'){
    if(m.lv>=60)return{ok:0,msg:'已達等級上限 60'};
    m.lv++;m.xp=0;m.hp=maxHP(m);
    const learned=SP[m.sp].ls.filter(x=>x[0]===m.lv).map(x=>x[1]);
    learned.forEach(id=>teachMove(m,id));
    let msg=name(m)+' 升到 Lv.'+m.lv;
    const ev=SP[m.sp].evo;
    if(ev&&m.lv>=ev.lv){ evolveNow(m); msg+=' 並進化了!'; }
    return{ok:1,msg:msg};
  }
  return{ok:0,msg:'無法使用'};
}
function teachMove(m,id){
  if(m.mv.some(v=>v.id===id))return null;
  if(m.mv.length<4){m.mv.push({id,pp:SK[id].pp});return {learn:id};}
  const drop=m.mv.shift();m.mv.push({id,pp:SK[id].pp});
  return {learn:id,forget:drop.id};
}
function evolveNow(m){
  const ev=SP[m.sp].evo;if(!ev)return null;
  const old=m.sp;const ratio=m.hp/maxHP(m);
  m.sp=ev.to;m.hp=Math.max(1,Math.round(maxHP(m)*ratio));
  dexCatch(ev.to);
  return old;
}

async function useMove(att,def,attSide,mvIdx){
  const slot=att.mv[mvIdx];
  const s=SK[slot.id];
  // 行動阻礙
  if(att.st==='slp'){
    B.slp[att.u]=(B.slp[att.u]||0)-1;
    if(B.slp[att.u]<=0){att.st=null;paintSlot(attSide);await say(`${name(att)} 醒過來了!`);}
    else{await say(`${name(att)} 睡得正香…`);return;}
  }
  if(att.st==='para'&&chance(.25)){await say(`${name(att)} 因麻痺而無法動彈!`);return;}
  slot.pp--;
  await say(`${name(att)} 使用了 <b>${s.n}</b>!`,620);

  // 命中
  const acc=s.acc>=999?100:s.acc;
  if(!chance(acc/100)){await say(`可惜沒有命中…`);return;}

  const defSide=attSide==='foe'?'me':'foe';
  if(s.p>0){
    const e=eff(s.t,SP[def.sp].t);
    const stab=SP[att.sp].t===s.t?1.5:1;
    const crit=chance((s.fx&&s.fx.crit)||.0625);
    const A=stat(att,'atk')*stg(att,'atk')*(crit?1.5:1);
    const D=stat(def,'def')*(crit?1:stg(def,'def'));
    let dmg=Math.floor((((2*att.lv/5+2)*s.p*A/Math.max(1,D))/50+2)*stab*e*(0.85+Math.random()*0.15));
    dmg=Math.max(1,dmg);
    fx(defSide,'shake');fx(defSide,'flash');
    await hpTo(defSide,def.hp-dmg);
    if(crit)await say('要害命中!',560);
    if(e>1.9)await say('效果絕佳!',560);
    else if(e>1)await say('效果不錯!',520);
    else if(e<.6)await say('效果不太好…',560);
    if(s.fx&&s.fx.drain){
      const h=Math.max(1,Math.floor(dmg*s.fx.drain));
      await hpTo(attSide,att.hp+h);
      await say(`${name(att)} 吸取了體力!`,560);
    }
    if(!alive(def))return;
    if(s.fx&&s.fx.inflict&&chance(s.fx.ch)&&!def.st){
      def.st=s.fx.inflict;
      if(def.st==='slp')B.slp[def.u]=rnd(1,3);
      paintSlot(defSide);
      await say(`${name(def)} 陷入了${STN[def.st]}!`);
    }
    if(s.fx&&s.fx.debuff&&chance(s.fx.ch||1)){
      if(addStage(def,s.fx.debuff,s.fx.st))
        await say(`${name(def)} 的${({atk:'攻擊',def:'防禦',spd:'速度'})[s.fx.debuff]}下降了!`,620);
    }
  }else{
    const f=s.fx||{};
    if(f.heal){
      if(att.hp>=maxHP(att))await say('但是沒有效果…');
      else{await hpTo(attSide,att.hp+Math.floor(maxHP(att)*f.heal));await say(`${name(att)} 回復了體力!`,620);}
    }
    if(f.buff){
      if(addStage(att,f.buff,f.st))await say(`${name(att)} 的${({atk:'攻擊',def:'防禦',spd:'速度'})[f.buff]}提升了!`,620);
      else await say('但是無法再提升了…',620);
    }
    if(f.debuff){
      if(addStage(def,f.debuff,f.st))await say(`${name(def)} 的${({atk:'攻擊',def:'防禦',spd:'速度'})[f.debuff]}下降了!`,620);
      else await say('但是無法再下降了…',620);
    }
    if(f.inflict){
      if(def.st)await say(`${name(def)} 已經處於異常狀態了。`,620);
      else{def.st=f.inflict;if(def.st==='slp')B.slp[def.u]=rnd(1,3);
        paintSlot(defSide);await say(`${name(def)} 陷入了${STN[def.st]}!`);}
    }
  }
}

function aiChoose(){
  const f=B.foe, me=B.me;
  const opts=f.mv.filter(v=>v.pp>0);
  if(!opts.length)return -1;
  let best=null,bs=-1;
  opts.forEach(v=>{
    const s=SK[v.id];let sc;
    if(s.p>0){
      const e=eff(s.t,SP[me.sp].t), stab=SP[f.sp].t===s.t?1.5:1;
      sc=s.p*e*stab*(s.acc>=999?1:s.acc/100);
    }else{
      const fx2=s.fx||{};
      sc=25;
      if(fx2.heal) sc = f.hp/maxHP(f)<.45?150:5;
      if(fx2.inflict) sc = me.st?4:70;
      if(fx2.buff||fx2.debuff) sc = 45;
    }
    sc*=0.85+Math.random()*0.3;
    if(sc>bs){bs=sc;best=v;}
  });
  return f.mv.indexOf(best);
}

async function tryCatch(key){
  const it=ITEM[key];
  S.bag[key]--;
  const f=B.foe, sp=SP[f.sp];
  await say(`丟出了 ${it.ic} ${it.n}!`,700);
  const holder=$('#fArt');holder.style.transition='.35s';holder.style.transform='scale(.25)';holder.style.opacity='.35';
  await sleep(420);
  let a=((3*maxHP(f)-2*f.hp)*sp.rate*it.m)/(3*maxHP(f));
  if(f.st==='slp')a*=2.5; else if(f.st)a*=1.6;
  a=a*(1+Math.max(0,(30-f.lv))/100);
  let shakes=0;
  if(a>=255)shakes=4;
  else{
    const b=65536/Math.pow(255/a,0.1875);
    for(let i=0;i<4;i++){ if(rnd(0,65535)<b)shakes++; else break; }
  }
  for(let i=0;i<Math.min(shakes,3);i++){
    fx('foe','shake');await say('…搖晃了 '+(i+1)+' 下',560);
  }
  if(shakes>=4){
    await say(`🎉 太好了!成功捕獲了 <b>${sp.n}</b>!`,1200);
    dexCatch(f.sp);S.caught++;
    if(S.party.length<6)S.party.push(f); else S.box.push(f);
    feed(`捕獲了 <b>${sp.n}</b> Lv.${f.lv}${S.party.length<6?'':'(送入倉庫)'}`);
    B.over='caught';
    return true;
  }
  holder.style.transform='';holder.style.opacity='';
  await say(`可惡…${sp.n} 掙脫了球!`,780);
  return false;
}

async function gainXP(m,amount){
  m.xp+=amount;
  await say(`${name(m)} 獲得了 ${amount} 點經驗值。`,700);
  paintSlot('me');
  while(m.xp>=xpNext(m)&&m.lv<60){
    const prevMax=maxHP(m);
    m.xp-=xpNext(m);m.lv++;
    m.hp=Math.min(maxHP(m),m.hp+(maxHP(m)-prevMax)); // 升級補上新增的體力上限
    paintSlot('me');
    await say(`🎊 ${name(m)} 升到了 <b>Lv.${m.lv}</b>!`,900);
    const learns=SP[m.sp].ls.filter(x=>x[0]===m.lv).map(x=>x[1]);
    for(const id of learns){
      const r=teachMove(m,id);
      if(!r)continue;
      if(r.forget)await say(`${name(m)} 忘記了 ${SK[r.forget].n},學會了 <b>${SK[id].n}</b>!`,950);
      else await say(`${name(m)} 學會了 <b>${SK[id].n}</b>!`,900);
    }
    const ev=SP[m.sp].evo;
    if(ev&&m.lv>=ev.lv){
      const oldName=SP[m.sp].n;
      await say(`咦…?${oldName} 的樣子有點奇怪…`,900);
      evolveNow(m);
      $('#mArt').dataset.sp='';paintSlot('me');
      fx('me','flash');
      await say(`✨ 恭喜!${oldName} 進化成了 <b>${SP[m.sp].n}</b>!`,1500);
      feed(`<b>${oldName}</b> 進化成了 <b>${SP[m.sp].n}</b>!`);
    }
  }
  if(m.lv>=60)m.xp=0;
}

async function endTurnStatus(m,side){
  if(!alive(m))return;
  if(m.st==='burn'){
    fx(side,'flash');
    await hpTo(side,m.hp-Math.max(1,Math.floor(maxHP(m)/14)));
    await say(`${name(m)} 受到燒傷的傷害!`,620);
  }else if(m.st==='psn'){
    fx(side,'flash');
    await hpTo(side,m.hp-Math.max(1,Math.floor(maxHP(m)/12)));
    await say(`${name(m)} 受到毒的侵蝕!`,620);
  }
}

async function onFoeFaint(){
  fx('foe','fade');
  await say(`${name(B.foe)} 倒下了!`,780);
  const base=SP[B.foe.sp].xp;
  const amount=Math.max(1,Math.floor(base*B.foe.lv/6*(B.trainer?1.4:1)));
  // 參戰的存活者分經驗
  const parts=S.party.filter(m=>alive(m)&&B.part[m.u]);
  for(const m of (parts.length?parts:[B.me])){
    if(m.u===B.me.u){await gainXP(m,amount);}
    else{ m.xp+=Math.floor(amount*0.5);
      while(m.xp>=xpNext(m)&&m.lv<60){m.xp-=xpNext(m);m.lv++;
        SP[m.sp].ls.filter(x=>x[0]===m.lv).forEach(x=>teachMove(m,x[1]));
        const ev=SP[m.sp].evo;if(ev&&m.lv>=ev.lv)evolveNow(m);
        m.hp=Math.min(maxHP(m),m.hp+8);}
    }
  }
  if(B.wild){
    const g=rnd(30,70)+B.foe.lv*6;
    S.money+=g;
    await say(`獲得了 💰${g} 金幣。`,700);
    B.over='win';return;
  }
  // 訓練家:換下一隻
  const next=B.trainer.team.find(alive);
  if(!next){B.over='win';return;}
  B.foe=next;
  $('#fArt').style.transform='';$('#fArt').style.opacity='';
  $('#fArt').dataset.sp='';paintSlot('foe');
  dexSee(next.sp);
  await say(`${B.trainer.name} 派出了 ${name(next)}!`,900);
}
async function onMyFaint(){
  fx('me','fade');
  await say(`${name(B.me)} 失去了戰鬥能力…`,850);
  if(!S.party.some(alive)){B.over='lose';return;}
  await say('要派出哪一隻御獸?',400);
  const a=await (cmdSwitch(true),waitAct());
  B.me=S.party[a.i];B.part[B.me.u]=1;
  $('#mArt').style.transform='';$('#mArt').style.opacity='';
  $('#mArt').dataset.sp='';paintSlot('me');
  await say(`上吧!${name(B.me)}!`,780);
}

async function startBattle(cfg){
  const first=S.party.find(alive);
  if(!first){toast('全隊無法戰鬥');return false;}
  B={wild:cfg.wild||null,trainer:cfg.trainer||null,
     foe:cfg.wild||cfg.trainer.team[0], me:first,
     stages:{}, slp:{}, part:{}, over:null};
  B.part[first.u]=1;
  dexSee(B.foe.sp);
  const el=$('#bt');
  el.className=cfg.boss?'boss':(cfg.wild?'wild':'');
  el.innerHTML=bhtml();
  $('#mArt').dataset.sp='';$('#fArt').dataset.sp='';
  paintSlot('foe');paintSlot('me');
  cancelAnimationFrame(ANIM);animLoop();

  await say(cfg.wild?`野生的 <b>${name(B.foe)}</b> Lv.${B.foe.lv} 出現了!`
    :`<b>${B.trainer.name}</b> 向你發起了挑戰!`,1000);
  await say(`去吧!${name(B.me)}!`,760);

  while(!B.over){
    cmdRoot();
    $('#bLog').innerHTML='要怎麼做?';
    const act=await waitAct();
    await runTurn(act);
    if(B.over)break;
    if(!alive(B.foe))await onFoeFaint();
    if(B.over)break;
    if(!alive(B.me))await onMyFaint();
  }

  // 結算
  let win=false;
  if(B.over==='win'){
    S.wins++;
    if(B.trainer)await say(`🏆 擊敗了 ${B.trainer.name}!`,1100);
    win=true;
  }else if(B.over==='caught'){win=true;}
  else if(B.over==='lose'){
    await say('眼前一片白茫茫…',1000);
    const lost=Math.floor(S.money*0.15);
    S.money-=lost;healAll();
    await say(`你回到了治療所,支付了 💰${lost} 治療費。`,1400);
    feed(`在 ${AREAS[S.area].n} 戰敗,失去 💰${lost}。`);
  }else if(B.over==='run'){ /* nothing */ }

  cancelAnimationFrame(ANIM);ANIM=0;
  $('#bt').classList.add('hide');$('#bt').innerHTML='';
  B=null;
  save();renderHeader();
  return win;
}
$('#bt').classList.add('hide');

async function runTurn(act){
  const foeIdx=aiChoose();
  const slowAct=['move','struggle','run'].includes(act.type); // 這些不享有優先權
  const myPri=act.type==='move'?(SK[B.me.mv[act.i].id].pri||0):slowAct?0:6;
  const foePri=foeIdx>=0?(SK[B.foe.mv[foeIdx].id].pri||0):0;
  let meFirst;
  if(myPri!==foePri)meFirst=myPri>foePri;
  else{const a=spdOf(B.me),b=spdOf(B.foe);meFirst=a===b?chance(.5):a>b;}

  const doMine=async()=>{
    if(act.type==='move'){ await useMove(B.me,B.foe,'me',act.i); }
    else if(act.type==='struggle'){
      await say(`${name(B.me)} 拼命地掙扎!`,700);
      const A=stat(B.me,'atk')*stg(B.me,'atk'), D=stat(B.foe,'def')*stg(B.foe,'def');
      const dmg=Math.max(1,Math.floor(((2*B.me.lv/5+2)*50*A/Math.max(1,D))/50+2));
      fx('foe','shake');await hpTo('foe',B.foe.hp-dmg);
      const rec=Math.max(1,Math.floor(dmg/4));
      fx('me','flash');await hpTo('me',B.me.hp-rec);
      await say(`${name(B.me)} 受到了反作用傷害!`,700);
    }
    else if(act.type==='switch'){
      await say(`回來吧,${name(B.me)}!`,620);
      B.me=S.party[act.i];B.part[B.me.u]=1;
      $('#mArt').dataset.sp='';paintSlot('me');
      await say(`上吧!${name(B.me)}!`,700);
    }
    else if(act.type==='item'){
      const r=useItemOn(act.key,B.me);
      if(r.ok){S.bag[act.key]--;paintSlot('me');}
      await say(r.msg,850);
      if(!r.ok)return 'free';
    }
    else if(act.type==='ball'){
      const got=await tryCatch(act.key);
      if(got)return 'stop';
    }
    else if(act.type==='run'){
      const odds=clamp(spdOf(B.me)/Math.max(1,spdOf(B.foe))*0.6+0.28,.2,.95);
      if(chance(odds)){await say('成功逃走了!',900);B.over='run';return 'stop';}
      await say('沒能逃掉!',800);
    }
  };
  const doFoe=async()=>{
    if(!alive(B.foe)||B.over)return;
    if(foeIdx<0){await say(`${name(B.foe)} 沒有招式可用,拼命掙扎!`,700);
      fx('me','shake');await hpTo('me',B.me.hp-rnd(5,12));return;}
    await useMove(B.foe,B.me,'foe',foeIdx);
  };

  if(meFirst){
    const r=await doMine();
    if(r==='stop'||B.over)return;
    if(alive(B.foe)&&alive(B.me))await doFoe();
  }else{
    if(!slowAct){ // 道具/換獸/捕捉不受速度影響,總是先執行
      const r=await doMine();
      if(r==='stop'||B.over)return;
      if(alive(B.foe)&&alive(B.me))await doFoe();
    }else{
      await doFoe();
      if(alive(B.me)&&!B.over){const r=await doMine();if(r==='stop'||B.over)return;}
    }
  }
  if(B.over)return;
  await endTurnStatus(B.me,'me');
  await endTurnStatus(B.foe,'foe');
}
