<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no, viewport-fit=cover">
<title>泡泡龍 — Bubble Shooter</title>
<style>
:root{
  --bg:#0c0e18; --panel:#161a2c; --panel2:#1f2440; --line:#2c3358;
  --txt:#e9ecff; --dim:#8891b8; --dim2:#5f6890;
  --gold:#ffc84a; --green:#3ddc97; --red:#ff5d73; --blue:#5aa9ff;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
body{
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  background:radial-gradient(900px 600px at 50% -10%,#2a1a42 0%,var(--bg) 55%);
  color:var(--txt);min-height:100vh;padding:14px 12px 40px;
}
.wrap{max-width:640px;margin:0 auto}

header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:22px;letter-spacing:2px;
   background:linear-gradient(90deg,var(--red),var(--gold),#d14bff);
   -webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:11px;color:var(--dim);margin-top:2px}
a.back{font-size:11.5px;color:var(--dim);text-decoration:none;border:1px solid var(--line);
        padding:6px 10px;border-radius:8px;background:var(--panel)}
a.back:hover{color:var(--txt);border-color:var(--dim2)}

.stats-top{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:10px;
      padding:7px 12px;text-align:center;min-width:70px;flex:1}
.pill .k{font-size:10px;color:var(--dim);letter-spacing:1px}
.pill .v{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}

.main{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;justify-content:center}
.board-wrap{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;
            position:relative;flex:none}
canvas#board{display:block;border-radius:8px;background:#0a0c16;touch-action:none;max-width:100%;height:auto}

.side{display:flex;flex-direction:column;gap:10px;min-width:150px}
.card-panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.card-panel h2{font-size:11px;letter-spacing:2px;color:var(--dim);font-weight:600;margin-bottom:8px;text-align:center}

.next-wrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.bubble-dot{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 -4px 8px rgba(0,0,0,.35),inset 0 3px 4px rgba(255,255,255,.35),0 2px 6px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.25)}
.next-label{font-size:10.5px;color:var(--dim2)}

.overlay{position:absolute;inset:10px;background:rgba(10,12,22,.88);border-radius:8px;
        display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;
        text-align:center;padding:20px}
.overlay.show{display:flex}
.overlay h2{font-size:20px;letter-spacing:2px}
.overlay p{font-size:12.5px;color:var(--dim);line-height:1.7}

button{font-family:inherit;font-weight:700;cursor:pointer;border:none;border-radius:10px;
       padding:11px 16px;font-size:13.5px;color:#fff;transition:transform .1s,filter .1s}
button:hover:not(:disabled){filter:brightness(1.12);transform:translateY(-1px)}
button:active:not(:disabled){transform:translateY(0)}
.b-gold{background:linear-gradient(135deg,var(--gold),#ff9d2e);color:#3a2a05}
.b-green{background:linear-gradient(135deg,var(--green),#22a173);color:#062a1c}
.b-ghost{background:var(--panel2);border:1px solid var(--line);color:var(--txt)}
.b-sm{padding:8px 12px;font-size:12px;border-radius:8px}

.hint{font-size:11.5px;color:var(--dim);line-height:1.9}
.hint b{color:var(--gold)}
</style>
<!-- star-arcade-shell -->
<style id="star-arcade-shell-style">
  html{ -webkit-text-size-adjust:100%; font-size:106%; }
  body{ max-width:100vw; overflow-x:hidden; }
  canvas{ max-width:100%; height:auto; }
  .sa-home-btn{
    position:fixed; top:12px; right:12px; z-index:999999;
    width:42px; height:42px; border-radius:50%;
    background:rgba(11,14,26,.72); border:1px solid rgba(255,255,255,.28);
    display:flex; align-items:center; justify-content:center;
    font-size:20px; text-decoration:none; color:#fff;
    box-shadow:0 4px 14px rgba(0,0,0,.35);
    -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px);
    -webkit-tap-highlight-color:transparent;
    cursor:pointer;
  }
  .sa-home-btn:hover{ background:rgba(11,14,26,.92); }
  @media (max-width:480px){
    .sa-home-btn{ width:38px; height:38px; font-size:16px; top:8px; right:8px; }
  }
</style>

<body>
<a class="sa-home-btn" href="platform.html" title="回到首頁" aria-label="回到首頁">🏠</a>

<div class="wrap">

<header>
  <div>
    <h1>泡泡龍</h1>
    <div class="sub">BUBBLE SHOOTER · 消除益智</div>
  </div>
  <a class="back" href="platform.html">← 回遊樂園</a>
</header>

<div class="stats-top">
  <div class="pill"><div class="k">分數</div><div class="v" id="score">0</div></div>
  <div class="pill"><div class="k">剩餘泡泡數</div><div class="v" id="remain">0</div></div>
  <div class="pill"><div class="k">最高分</div><div class="v" id="best">0</div></div>
</div>

<div class="main">
  <div class="board-wrap">
    <canvas id="board"></canvas>
    <div class="overlay show" id="overlay">
      <h2 id="ovTitle">泡泡龍</h2>
      <p id="ovText">滑鼠瞄準、點擊發射泡泡；手機拖曳瞄準、放開發射。<br>集滿 3 顆以上同色泡泡即可消除！</p>
      <button class="b-gold" id="ovBtn">開始遊戲</button>
    </div>
  </div>

  <div class="side">
    <div class="card-panel">
      <h2>下一顆</h2>
      <div class="next-wrap">
        <div class="bubble-dot" id="nextDot"></div>
        <div class="next-label">NEXT</div>
      </div>
    </div>
    <div class="card-panel">
      <h2>操作說明</h2>
      <div class="hint">
        滑鼠移動瞄準<br>
        點擊 / 空白鍵發射<br>
        手機拖曳瞄準，放開發射<br>
        連接牆壁可反彈瞄準線
      </div>
    </div>
    <button class="b-green b-sm" id="restartBtn">重新開始</button>
  </div>
</div>

</div>

<script>
/* ===================== 版面 / 網格幾何 ===================== */
const BR = 17;                 // 泡泡半徑
const GAP = 3;                 // 邊界留白
const COLS = 10;               // 偶數列的欄數（奇數列為 COLS-1，錯位排列）
const D = BR * 2;              // 直徑（相鄰同列泡泡間距）
const RH = BR * Math.sqrt(3);  // 列高（六角堆疊）
const INIT_ROWS = 8;           // 初始泡泡列數
const DANGER_ROWS = 14;        // 危險線對齊的列數：堆到這一列以下就算輸
const ROWS_MAX = DANGER_ROWS + 4; // 網格最大列數：危險線之後再留幾列緩衝空間
const CANNON_AREA = 130;       // 底部保留給砲台的高度

const gridLeft = BR + GAP;
const gridTop = BR + GAP;
const CW = Math.round(gridLeft * 2 + (COLS - 1) * D);
const CH = Math.round(gridTop + (ROWS_MAX - 1) * RH + BR + CANNON_AREA);
const cannonX = CW / 2;
const cannonY = CH - 40;
// 危險線直接綁定在第 DANGER_ROWS 列的位置，與 CH 的公式脫鉤，
// 這樣無論 ROWS_MAX 多大，危險線都會落在合理的列數而不是「永遠差 CH 一個固定值」。
const dangerY = gridTop + DANGER_ROWS * RH + BR;

const PALETTE = ['#ffc84a', '#3ddc97', '#ff5d73', '#5aa9ff', '#d14bff', '#4dd9ec'];

/* 本作選擇：不自動新增列（比「每 N 發自動下推一列」更容易確保正確性）。
   輸/贏條件：泡泡堆最低列觸及底部危險線 → 遊戲結束；場上泡泡全清 → 獲勝。
   若射出的泡泡在整個網格中都找不到可放置的空位（極端情況），一樣視為遊戲結束。 */

function rowCols(r){ return (r % 2 === 0) ? COLS : COLS - 1; }
function cellX(r, c){ return gridLeft + (r % 2 === 1 ? BR : 0) + c * D; }
function cellY(r){ return gridTop + r * RH; }
function inBounds(r, c){ return r >= 0 && r < ROWS_MAX && c >= 0 && c < rowCols(r); }
function neighborsOf(r, c){
  if (r % 2 === 0){
    return [[r,c-1],[r,c+1],[r-1,c-1],[r-1,c],[r+1,c-1],[r+1,c]];
  } else {
    return [[r,c-1],[r,c+1],[r-1,c],[r-1,c+1],[r+1,c],[r+1,c+1]];
  }
}

/* ===================== 畫布 ===================== */
const boardCv = document.getElementById('board');
boardCv.width = CW; boardCv.height = CH;
const ctx = boardCv.getContext('2d');

/* ===================== 遊戲狀態 ===================== */
let grid;              // grid[r][c] = 顏色字串 或 null
let score, best;
let running, gameOver, gameWon;
let currentColor, nextColor;
let flight = null;     // {x,y,dx,dy} 飛行中的泡泡
let aimAngle = -Math.PI/2;
let isDragging = false;

best = Number(localStorage.getItem('bubbleShooterBest') || 0);
document.getElementById('best').textContent = best;

function buildInitialGrid(){
  grid = [];
  for (let r = 0; r < ROWS_MAX; r++){
    grid.push(new Array(rowCols(r)).fill(null));
  }
  for (let r = 0; r < INIT_ROWS; r++){
    for (let c = 0; c < rowCols(r); c++){
      grid[r][c] = PALETTE[Math.floor(Math.random() * PALETTE.length)];
    }
  }
}

function availableColors(){
  const set = new Set();
  for (let r = 0; r < ROWS_MAX; r++){
    for (let c = 0; c < rowCols(r); c++){
      if (grid[r][c]) set.add(grid[r][c]);
    }
  }
  if (set.size === 0) return PALETTE.slice();
  return Array.from(set);
}
function pickRandomColor(){
  const avail = availableColors();
  return avail[Math.floor(Math.random() * avail.length)];
}

function countBubbles(){
  let n = 0;
  for (let r = 0; r < ROWS_MAX; r++){
    for (let c = 0; c < rowCols(r); c++){
      if (grid[r][c]) n++;
    }
  }
  return n;
}

function updateStats(){
  document.getElementById('score').textContent = score;
  document.getElementById('remain').textContent = countBubbles();
  document.getElementById('best').textContent = best;
}
function updateNextDot(){
  document.getElementById('nextDot').style.background = nextColor;
}

function initGame(){
  buildInitialGrid();
  score = 0;
  running = false; gameOver = false; gameWon = false;
  flight = null;
  aimAngle = -Math.PI/2;
  currentColor = pickRandomColor();
  nextColor = pickRandomColor();
  updateNextDot();
  updateStats();
}

/* ===================== 物理：牆壁反彈 / 停止判定 ===================== */
const STEP = 5; // 每次物理子步移動的像素

function advanceStep(state){
  state.x += state.dx * STEP;
  state.y += state.dy * STEP;
  let bounced = false;
  if (state.x - BR < 0){
    state.x = BR + (BR - state.x);
    state.dx = -state.dx;
    bounced = true;
  } else if (state.x + BR > CW){
    state.x = (CW - BR) - ((state.x + BR) - CW);
    state.dx = -state.dx;
    bounced = true;
  }
  let stop = null;
  if (state.y <= gridTop){
    state.y = gridTop;
    stop = 'ceiling';
  } else {
    const hb = findNearestOccupiedWithin(state.x, state.y, D * 0.98);
    if (hb) stop = { bubble: hb };
  }
  return { bounced, stop };
}

function findNearestOccupiedWithin(x, y, thresh){
  let best = null, bestD = Infinity;
  for (let r = 0; r < ROWS_MAX; r++){
    for (let c = 0; c < rowCols(r); c++){
      if (!grid[r][c]) continue;
      const ex = cellX(r,c), ey = cellY(r);
      const d = Math.hypot(x-ex, y-ey);
      if (d < thresh && d < bestD){ bestD = d; best = {r,c}; }
    }
  }
  return best;
}

/* 預覽用：模擬完整路徑（含反彈點），供瞄準虛線繪製，與實際發射共用同一套物理函式，
   確保「瞄準線」與「泡泡實際飛行路徑」完全一致。 */
function computePreviewPath(sx, sy, angle){
  const state = { x: sx, y: sy, dx: Math.cos(angle), dy: Math.sin(angle) };
  const pts = [{x:state.x, y:state.y}];
  for (let i = 0; i < 4000; i++){
    const r = advanceStep(state);
    if (r.bounced) pts.push({x:state.x, y:state.y});
    if (r.stop){ pts.push({x:state.x, y:state.y}); return pts; }
  }
  pts.push({x:state.x, y:state.y});
  return pts;
}

/* ===================== 貼齊網格（snap） ===================== */
function findSnapSlot(x, y, stopInfo){
  const candidates = new Map();
  function addNeighborsOf(r, c){
    for (const [nr, nc] of neighborsOf(r, c)){
      if (inBounds(nr, nc) && !grid[nr][nc]) candidates.set(nr+'_'+nc, {r:nr, c:nc});
    }
  }
  if (stopInfo && stopInfo !== 'ceiling' && stopInfo.bubble){
    addNeighborsOf(stopInfo.bubble.r, stopInfo.bubble.c);
  }
  // 額外掃描附近所有已佔用泡泡，增加穩健性（避免同時貼近多顆泡泡時漏判）
  for (let r = 0; r < ROWS_MAX; r++){
    for (let c = 0; c < rowCols(r); c++){
      if (!grid[r][c]) continue;
      const ex = cellX(r,c), ey = cellY(r);
      if (Math.hypot(x-ex, y-ey) < D * 1.15) addNeighborsOf(r, c);
    }
  }
  if (y <= gridTop + BR * 0.75){
    for (let c = 0; c < rowCols(0); c++){
      if (!grid[0][c]) candidates.set('0_'+c, {r:0, c});
    }
  }
  let best = null, bestDist = Infinity;
  for (const cand of candidates.values()){
    const cx = cellX(cand.r, cand.c), cy = cellY(cand.r);
    const d = Math.hypot(x-cx, y-cy);
    if (d < bestDist){ bestDist = d; best = cand; }
  }
  if (!best){
    // 保底：整個網格中距離最近的空格
    for (let r = 0; r < ROWS_MAX; r++){
      for (let c = 0; c < rowCols(r); c++){
        if (grid[r][c]) continue;
        const cx = cellX(r,c), cy = cellY(r);
        const d = Math.hypot(x-cx, y-cy);
        if (d < bestDist){ bestDist = d; best = {r,c}; }
      }
    }
  }
  return best;
}

/* ===================== 消除 / 掉落判定 ===================== */
function resolveMatches(r, c){
  const color = grid[r][c];
  const visited = new Set([r+'_'+c]);
  const stack = [[r,c]];
  const group = [];
  while (stack.length){
    const [cr, cc] = stack.pop();
    group.push([cr,cc]);
    for (const [nr, nc] of neighborsOf(cr, cc)){
      if (!inBounds(nr, nc)) continue;
      const key = nr+'_'+nc;
      if (visited.has(key)) continue;
      if (grid[nr][nc] === color){
        visited.add(key);
        stack.push([nr, nc]);
      }
    }
  }
  if (group.length >= 3){
    for (const [gr, gc] of group) grid[gr][gc] = null;
    score += group.length * 10 + Math.max(0, group.length - 3) * 5;

    const floating = findFloatingBubbles();
    for (const [fr, fc] of floating) grid[fr][fc] = null;
    score += floating.length * 20;
  }
}

function findFloatingBubbles(){
  const reachable = new Set();
  const stack = [];
  for (let c = 0; c < rowCols(0); c++){
    if (grid[0][c]){ stack.push([0,c]); reachable.add('0_'+c); }
  }
  while (stack.length){
    const [r,c] = stack.pop();
    for (const [nr,nc] of neighborsOf(r,c)){
      if (!inBounds(nr,nc)) continue;
      const key = nr+'_'+nc;
      if (reachable.has(key)) continue;
      if (grid[nr][nc]){ reachable.add(key); stack.push([nr,nc]); }
    }
  }
  const floating = [];
  for (let r = 0; r < ROWS_MAX; r++){
    for (let c = 0; c < rowCols(r); c++){
      if (grid[r][c] && !reachable.has(r+'_'+c)) floating.push([r,c]);
    }
  }
  return floating;
}

function checkWinLose(){
  if (countBubbles() === 0){ triggerWin(); return; }
  let maxY = -Infinity;
  for (let r = 0; r < ROWS_MAX; r++){
    for (let c = 0; c < rowCols(r); c++){
      if (grid[r][c]){ const y = cellY(r); if (y > maxY) maxY = y; }
    }
  }
  if (maxY + BR >= dangerY) triggerGameOver();
}

/* ===================== 射擊流程 ===================== */
function fireShot(){
  if (!running || gameOver || gameWon || flight) return;
  flight = {
    x: cannonX, y: cannonY - BR - 4,
    dx: Math.cos(aimAngle), dy: Math.sin(aimAngle),
    color: currentColor
  };
}

function settleFlight(stopInfo){
  const slot = findSnapSlot(flight.x, flight.y, stopInfo);
  if (!slot){
    flight = null;
    triggerGameOver();
    return;
  }
  grid[slot.r][slot.c] = flight.color;
  flight = null;
  resolveMatches(slot.r, slot.c);
  updateStats();
  if (gameOver || gameWon) return;
  checkWinLose();
  if (gameOver || gameWon) return;
  currentColor = nextColor;
  nextColor = pickRandomColor();
  updateNextDot();
}

function triggerWin(){
  gameWon = true; running = false;
  if (score > best){ best = score; localStorage.setItem('bubbleShooterBest', String(best)); }
  document.getElementById('ovTitle').textContent = '恭喜過關！';
  document.getElementById('ovText').innerHTML = `場上泡泡全數清除！<br>本局分數 <b style="color:var(--gold)">${score}</b>`;
  document.getElementById('ovBtn').textContent = '再玩一次';
  document.getElementById('overlay').classList.add('show');
  updateStats();
}
function triggerGameOver(){
  gameOver = true; running = false;
  if (score > best){ best = score; localStorage.setItem('bubbleShooterBest', String(best)); }
  document.getElementById('ovTitle').textContent = '遊戲結束';
  document.getElementById('ovText').innerHTML = `泡泡堆到底線了！<br>本局分數 <b style="color:var(--gold)">${score}</b>`;
  document.getElementById('ovBtn').textContent = '重新開始';
  document.getElementById('overlay').classList.add('show');
  updateStats();
}

function startGame(){
  document.getElementById('overlay').classList.remove('show');
  initGame();
  running = true;
}

/* ===================== 繪製 ===================== */
function bubbleGradient(cx, cy, r, color){
  const g = ctx.createRadialGradient(cx - r*0.35, cy - r*0.35, r*0.15, cx, cy, r);
  g.addColorStop(0, 'rgba(255,255,255,0.9)');
  g.addColorStop(0.25, color);
  g.addColorStop(1, color);
  return g;
}
function drawBubble(cx, cy, r, color){
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.fillStyle = bubbleGradient(cx, cy, r, color);
  ctx.fill();
  ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba(0,0,0,0.25)';
  ctx.stroke();
}

function draw(){
  ctx.clearRect(0, 0, CW, CH);

  // 危險線
  ctx.setLineDash([5,5]);
  ctx.strokeStyle = 'rgba(255,93,115,0.35)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, dangerY);
  ctx.lineTo(CW, dangerY);
  ctx.stroke();
  ctx.setLineDash([]);

  // 網格泡泡
  for (let r = 0; r < ROWS_MAX; r++){
    for (let c = 0; c < rowCols(r); c++){
      if (!grid[r][c]) continue;
      drawBubble(cellX(r,c), cellY(r), BR-1, grid[r][c]);
    }
  }

  // 瞄準虛線（僅在遊戲進行中、未發射時顯示）
  if (running && !gameOver && !gameWon && !flight){
    const path = computePreviewPath(cannonX, cannonY - BR - 4, aimAngle);
    ctx.setLineDash([6,6]);
    ctx.strokeStyle = 'rgba(233,236,255,0.45)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(path[0].x, path[0].y);
    for (let i = 1; i < path.length; i++) ctx.lineTo(path[i].x, path[i].y);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // 飛行中的泡泡
  if (flight){
    drawBubble(flight.x, flight.y, BR-1, flight.color);
  }

  // 砲台
  ctx.save();
  ctx.translate(cannonX, cannonY);
  ctx.rotate(aimAngle + Math.PI/2);
  ctx.fillStyle = '#2c3358';
  ctx.strokeStyle = '#4a5490';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-14, 18);
  ctx.lineTo(-9, -20);
  ctx.lineTo(9, -20);
  ctx.lineTo(14, 18);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.restore();
  ctx.beginPath();
  ctx.arc(cannonX, cannonY, 12, 0, Math.PI*2);
  ctx.fillStyle = '#1f2440';
  ctx.strokeStyle = '#4a5490';
  ctx.lineWidth = 2;
  ctx.fill();
  ctx.stroke();

  // 目前裝填的泡泡
  if (!gameOver && !gameWon){
    drawBubble(cannonX, cannonY - BR - 4, BR-1, currentColor);
  }
}

/* ===================== 主迴圈 ===================== */
const SUBSTEPS_PER_FRAME = 3;
function loop(){
  if (running && flight){
    for (let i = 0; i < SUBSTEPS_PER_FRAME; i++){
      const r = advanceStep(flight);
      if (r.stop){
        settleFlight(r.stop);
        break;
      }
    }
  }
  draw();
  requestAnimationFrame(loop);
}

/* ===================== 輸入處理 ===================== */
function getRelPos(clientX, clientY){
  const rect = boardCv.getBoundingClientRect();
  return {
    x: (clientX - rect.left) * (CW / rect.width),
    y: (clientY - rect.top) * (CH / rect.height)
  };
}
const MIN_ANG = -Math.PI + 0.2;
const MAX_ANG = -0.2;
function updateAim(px, py){
  let dx = px - cannonX;
  let dy = py - (cannonY - BR - 4);
  if (dy > -10) dy = -10;
  let angle = Math.atan2(dy, dx);
  if (angle < MIN_ANG) angle = MIN_ANG;
  if (angle > MAX_ANG) angle = MAX_ANG;
  aimAngle = angle;
}

boardCv.addEventListener('mousemove', (e) => {
  if (!running) return;
  const p = getRelPos(e.clientX, e.clientY);
  updateAim(p.x, p.y);
});
boardCv.addEventListener('click', (e) => {
  if (!running) return;
  const p = getRelPos(e.clientX, e.clientY);
  updateAim(p.x, p.y);
  fireShot();
});

boardCv.addEventListener('touchstart', (e) => {
  if (!running) return;
  e.preventDefault();
  isDragging = true;
  const t = e.touches[0];
  const p = getRelPos(t.clientX, t.clientY);
  updateAim(p.x, p.y);
}, {passive:false});
boardCv.addEventListener('touchmove', (e) => {
  if (!running || !isDragging) return;
  e.preventDefault();
  const t = e.touches[0];
  const p = getRelPos(t.clientX, t.clientY);
  updateAim(p.x, p.y);
}, {passive:false});
boardCv.addEventListener('touchend', (e) => {
  if (!running || !isDragging) return;
  e.preventDefault();
  isDragging = false;
  fireShot();
}, {passive:false});

document.addEventListener('keydown', (e) => {
  if (e.key === ' '){
    e.preventDefault();
    fireShot();
  }
});

document.getElementById('ovBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', startGame);

/* ===================== 啟動 ===================== */
initGame();
draw();
requestAnimationFrame(loop);
</script>
