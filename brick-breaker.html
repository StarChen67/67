<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>打磚塊 — Brick Breaker</title>
<style>
:root{
  --bg:#0c0e18; --panel:#161a2c; --panel2:#1f2440; --line:#2c3358;
  --txt:#e9ecff; --dim:#8891b8; --dim2:#5f6890;
  --gold:#ffc84a; --green:#3ddc97; --red:#ff5d73; --blue:#5aa9ff;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
body{
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  background:radial-gradient(900px 600px at 50% -10%,#241a42 0%,var(--bg) 55%);
  color:var(--txt);min-height:100vh;padding:14px 12px 40px;
}
.wrap{max-width:520px;margin:0 auto}

header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:22px;letter-spacing:2px;
   background:linear-gradient(90deg,var(--gold),#ff9d2e,#d14bff);
   -webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:11px;color:var(--dim);margin-top:2px}
a.back{font-size:11.5px;color:var(--dim);text-decoration:none;border:1px solid var(--line);
        padding:6px 10px;border-radius:8px;background:var(--panel)}
a.back:hover{color:var(--txt);border-color:var(--dim2)}

.stats-top{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:10px;
      padding:7px 12px;text-align:center;min-width:70px;flex:1}
.pill .k{font-size:10px;color:var(--dim);letter-spacing:1px}
.pill .v{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}

.board-wrap{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;
            position:relative;margin:0 auto;width:fit-content}
canvas#board{display:block;border-radius:8px;background:#0a0c16;touch-action:none}

.overlay{position:absolute;inset:10px;background:rgba(10,12,22,.88);border-radius:8px;
        display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;
        text-align:center;padding:20px}
.overlay.show{display:flex}
.overlay h2{font-size:20px;letter-spacing:2px}
.overlay p{font-size:12.5px;color:var(--dim);line-height:1.7}

button{font-family:inherit;font-weight:700;cursor:pointer;border:none;border-radius:10px;
       padding:11px 16px;font-size:13.5px;color:#fff;transition:transform .1s,filter .1s}
button:hover:not(:disabled){filter:brightness(1.12);transform:translateY(-1px)}
button:active:not(:disabled){transform:translateY(0)}
.b-gold{background:linear-gradient(135deg,var(--gold),#ff9d2e);color:#3a2a05}
.b-purple{background:linear-gradient(135deg,#d14bff,#8b5cff)}
.b-ghost{background:var(--panel2);border:1px solid var(--line);color:var(--txt)}
.b-sm{padding:8px 12px;font-size:12px;border-radius:8px}

.controls-row{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.hint{font-size:11.5px;color:var(--dim);line-height:1.9;text-align:center;margin-top:10px}
.hint b{color:var(--gold)}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div>
    <h1>打磚塊</h1>
    <div class="sub">BRICK BREAKER · 單機益智</div>
  </div>
  <a class="back" href="platform.html">← 回遊樂園</a>
</header>

<div class="stats-top">
  <div class="pill"><div class="k">分數</div><div class="v" id="score">0</div></div>
  <div class="pill"><div class="k">關卡</div><div class="v" id="level">1</div></div>
  <div class="pill"><div class="k">生命</div><div class="v" id="lives">3</div></div>
  <div class="pill"><div class="k">最高分</div><div class="v" id="best">0</div></div>
</div>

<div class="board-wrap">
  <canvas id="board"></canvas>
  <div class="overlay show" id="overlay">
    <h2 id="ovTitle">打磚塊</h2>
    <p id="ovText">滑鼠移動或觸控拖曳控制擋板，點擊 / 空白鍵發射球。<br>清光所有磚塊晉級下一關！</p>
    <button class="b-gold" id="ovBtn">開始遊戲</button>
  </div>
</div>

<div class="controls-row">
  <button class="b-ghost b-sm" id="pauseBtn">暫停</button>
  <button class="b-purple b-sm" id="restartBtn">重新開始</button>
</div>

<div class="hint">
  滑鼠移動 / 觸控拖曳擋板　<b>空白鍵</b>或點擊發射球　<b>P</b>暫停
</div>

</div>

<script>
const CW = 440, CH = 560;
const boardCv = document.getElementById('board');
boardCv.width = CW; boardCv.height = CH;
const ctx = boardCv.getContext('2d');

const ROW_COLORS = ['#ff5d73','#ff9d2e','#ffc84a','#3ddc97','#5aa9ff','#d14bff'];
const BRICK_GAP = 4, BRICK_H = 20, BRICK_TOP = 50;
const COLS = 8;

const PADDLE_W_BASE = 90, PADDLE_H = 14, PADDLE_Y = CH - 30;
const BALL_R = 7;

let bricks, paddleX, paddleW, ball, score, level, lives, best;
let running, paused, gameOver, launched;

function buildLevel(lv){
  const rows = Math.min(3 + lv, 8);
  const bw = (CW - BRICK_GAP*(COLS+1)) / COLS;
  const list = [];
  for(let r=0;r<rows;r++){
    for(let c=0;c<COLS;c++){
      list.push({
        x: BRICK_GAP + c*(bw+BRICK_GAP),
        y: BRICK_TOP + r*(BRICK_H+BRICK_GAP),
        w: bw, h: BRICK_H,
        color: ROW_COLORS[r % ROW_COLORS.length],
        hp: r < 2 ? 1 : (r < rows-2 ? 1 : 2),
        alive: true,
        points: (rows-r) * 10
      });
    }
  }
  return list;
}

function resetBall(){
  const speed = 4.2 + (level-1)*0.35;
  ball = {
    x: paddleX + paddleW/2, y: PADDLE_Y - BALL_R - 1,
    dx: 0, dy: 0, speed
  };
  launched = false;
}

function initState(){
  level = 1; score = 0; lives = 3;
  paddleW = PADDLE_W_BASE;
  paddleX = (CW - paddleW)/2;
  bricks = buildLevel(level);
  resetBall();
  running = false; paused = false; gameOver = false;
  updateStats();
}

function updateStats(){
  document.getElementById('score').textContent = score;
  document.getElementById('level').textContent = level;
  document.getElementById('lives').textContent = lives;
  document.getElementById('best').textContent = best;
}

function launchBall(){
  if(launched || gameOver || paused) return;
  const angle = -Math.PI/2 + (Math.random()*0.6 - 0.3);
  ball.dx = Math.cos(angle) * ball.speed;
  ball.dy = Math.sin(angle) * ball.speed;
  launched = true;
}

function movePaddleTo(px){
  paddleX = Math.max(0, Math.min(CW - paddleW, px - paddleW/2));
  if(!launched){ ball.x = paddleX + paddleW/2; }
}

function loseLife(){
  lives--;
  updateStats();
  if(lives <= 0){
    triggerGameOver();
  } else {
    resetBall();
  }
}

function nextLevel(){
  level++;
  paddleW = Math.max(60, PADDLE_W_BASE - (level-1)*3);
  paddleX = Math.max(0, Math.min(CW-paddleW, paddleX));
  bricks = buildLevel(level);
  resetBall();
  updateStats();
  running = false;
  showOverlay('levelup', `第 ${level} 關`, `磚塊變多、球速加快，準備好了嗎？`, '繼續');
}

function step(){
  if(!running || paused || gameOver) return;

  if(launched){
    ball.x += ball.dx;
    ball.y += ball.dy;

    if(ball.x - BALL_R < 0){ ball.x = BALL_R; ball.dx *= -1; }
    if(ball.x + BALL_R > CW){ ball.x = CW - BALL_R; ball.dx *= -1; }
    if(ball.y - BALL_R < 0){ ball.y = BALL_R; ball.dy *= -1; }

    if(ball.y + BALL_R > PADDLE_Y && ball.y + BALL_R < PADDLE_Y + PADDLE_H + 10 &&
       ball.x > paddleX - BALL_R && ball.x < paddleX + paddleW + BALL_R && ball.dy > 0){
      const hit = (ball.x - (paddleX + paddleW/2)) / (paddleW/2);
      const angle = hit * (Math.PI/3) - Math.PI/2;
      ball.dx = Math.cos(angle) * ball.speed;
      ball.dy = Math.sin(angle) * ball.speed;
      ball.y = PADDLE_Y - BALL_R;
    }

    if(ball.y - BALL_R > CH){
      loseLife();
    }

    for(const b of bricks){
      if(!b.alive) continue;
      if(ball.x + BALL_R > b.x && ball.x - BALL_R < b.x + b.w &&
         ball.y + BALL_R > b.y && ball.y - BALL_R < b.y + b.h){
        const overlapL = (ball.x + BALL_R) - b.x;
        const overlapR = (b.x + b.w) - (ball.x - BALL_R);
        const overlapT = (ball.y + BALL_R) - b.y;
        const overlapB = (b.y + b.h) - (ball.y - BALL_R);
        const minOverlap = Math.min(overlapL, overlapR, overlapT, overlapB);
        if(minOverlap === overlapL || minOverlap === overlapR){
          ball.dx *= -1;
        } else {
          ball.dy *= -1;
        }
        b.hp--;
        if(b.hp <= 0){
          b.alive = false;
          score += b.points;
          if(score > best){ best = score; localStorage.setItem('brick_best', best); }
          updateStats();
        }
        break;
      }
    }

    if(bricks.every(b=>!b.alive)){
      nextLevel();
    }
  }

  draw();
  requestAnimationFrame(step);
}

function drawBrick(b){
  if(!b.alive) return;
  ctx.globalAlpha = b.hp >= 2 ? 1 : 0.85;
  ctx.fillStyle = b.color;
  ctx.fillRect(b.x, b.y, b.w, b.h);
  ctx.globalAlpha = 1;
  ctx.strokeStyle = 'rgba(255,255,255,.15)';
  ctx.strokeRect(b.x, b.y, b.w, b.h);
  if(b.hp >= 2){
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.fillRect(b.x, b.y, b.w, 4);
  }
}

function draw(){
  ctx.fillStyle = '#0a0c16';
  ctx.fillRect(0,0,CW,CH);

  for(const b of bricks) drawBrick(b);

  const grad = ctx.createLinearGradient(paddleX,0,paddleX+paddleW,0);
  grad.addColorStop(0,'#5aa9ff'); grad.addColorStop(1,'#d14bff');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(paddleX, PADDLE_Y, paddleW, PADDLE_H, 6) : ctx.rect(paddleX, PADDLE_Y, paddleW, PADDLE_H);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI*2);
  ctx.fillStyle = '#ffc84a';
  ctx.fill();
}

function triggerGameOver(){
  gameOver = true;
  running = false;
  showOverlay('gameover', '遊戲結束', `本局分數：${score}　抵達第 ${level} 關`, '再玩一次');
}

const overlay = document.getElementById('overlay');
let overlayMode = 'start';
function showOverlay(mode, title, text, btnText){
  overlayMode = mode;
  document.getElementById('ovTitle').textContent = title;
  document.getElementById('ovText').innerHTML = text;
  document.getElementById('ovBtn').textContent = btnText;
  overlay.classList.add('show');
}
function hideOverlay(){ overlay.classList.remove('show'); }

function resumeLoop(){
  hideOverlay();
  running = true;
  paused = false;
  document.getElementById('pauseBtn').textContent = '暫停';
  draw();
  requestAnimationFrame(step);
}

function startGame(){
  initState();
  resumeLoop();
}

document.getElementById('ovBtn').addEventListener('click', ()=>{
  if(overlayMode === 'start' || overlayMode === 'gameover'){
    startGame();
  } else {
    resumeLoop();
  }
});
document.getElementById('restartBtn').addEventListener('click', startGame);
document.getElementById('pauseBtn').addEventListener('click', ()=>{
  if(!running || gameOver) return;
  paused = true;
  showOverlay('paused', '已暫停', '按下繼續按鈕恢復遊戲', '繼續');
});

function getRelX(clientX){
  const rect = boardCv.getBoundingClientRect();
  return (clientX - rect.left) * (CW / rect.width);
}

boardCv.addEventListener('mousemove', (e)=>{
  if(!running || paused || gameOver) return;
  movePaddleTo(getRelX(e.clientX));
});
boardCv.addEventListener('mousedown', (e)=>{
  if(!running || paused || gameOver) return;
  movePaddleTo(getRelX(e.clientX));
  launchBall();
});
boardCv.addEventListener('touchstart', (e)=>{
  if(!running || paused || gameOver) return;
  e.preventDefault();
  const t = e.touches[0];
  movePaddleTo(getRelX(t.clientX));
  launchBall();
}, {passive:false});
boardCv.addEventListener('touchmove', (e)=>{
  if(!running || paused || gameOver) return;
  e.preventDefault();
  const t = e.touches[0];
  movePaddleTo(getRelX(t.clientX));
}, {passive:false});

window.addEventListener('keydown', (e)=>{
  if(['ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  if(gameOver && e.code==='Space'){ startGame(); return; }
  if(e.code === 'KeyP'){
    if(paused){ resumeLoop(); } else if(running){ document.getElementById('pauseBtn').click(); }
    return;
  }
  if(!running || paused) return;
  switch(e.code){
    case 'ArrowLeft': movePaddleTo(paddleX + paddleW/2 - 24); break;
    case 'ArrowRight': movePaddleTo(paddleX + paddleW/2 + 24); break;
    case 'Space': launchBall(); break;
  }
});

best = Number(localStorage.getItem('brick_best')||0);
document.getElementById('best').textContent = best;
initState();
draw();
</script>
</body>
</html>
