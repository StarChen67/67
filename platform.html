<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星辰遊樂園 · Star Arcade</title>
<style>
  :root{
    --bg:#0b0e1a; --bg2:#11152a; --panel:#161b34; --panel2:#1d2344;
    --text:#eef0ff; --muted:#8a90bd; --line:#2a3160;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Segoe UI","Microsoft JhengHei",system-ui,sans-serif;
    background:radial-gradient(1200px 800px at 20% -10%, #1a2050 0%, var(--bg) 55%),var(--bg);
    color:var(--text); min-height:100vh;}

  header{
    position:sticky; top:0; z-index:10;
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 32px; background:rgba(11,14,26,.85); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
    flex-wrap:wrap; gap:10px;
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand .logo{
    width:40px;height:40px;border-radius:12px;
    background:conic-gradient(from 180deg,#6c5ce7,#00cec9,#fd79a8,#6c5ce7);
    box-shadow:0 0 20px rgba(108,92,231,.6);
    display:flex;align-items:center;justify-content:center;font-size:20px;
    flex-shrink:0;
  }
  .brand h1{font-size:20px; margin:0; letter-spacing:.5px;}
  .brand span{color:var(--muted); font-size:12px;}

  .live-pill{
    display:flex; align-items:center; gap:7px;
    margin-left:8px; padding:6px 14px; border-radius:999px;
    background:rgba(46,213,115,.12); border:1px solid rgba(46,213,115,.4);
    color:#2ed573; font-size:12px; font-weight:700; white-space:nowrap;
  }
  .live-dot{
    width:8px; height:8px; border-radius:50%; background:#2ed573;
    box-shadow:0 0 8px #2ed573; animation:pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1; transform:scale(1);}
    50%{opacity:.45; transform:scale(.8);}
  }

  nav.tabs{display:flex; gap:8px;}
  nav.tabs button{
    background:var(--panel); color:var(--muted); border:1px solid var(--line);
    padding:8px 18px; border-radius:999px; cursor:pointer; font-size:13px; font-weight:600;
    transition:.15s;
  }
  nav.tabs button.active{background:linear-gradient(135deg,#6c5ce7,#00cec9); color:#0b0e1a; border-color:transparent;}
  nav.tabs button:hover{color:var(--text);}

  main{padding:36px 32px 80px; max-width:1400px; margin:0 auto;}
  .hero{
    margin-bottom:36px; padding:28px 32px; border-radius:20px;
    background:linear-gradient(120deg, #1d2344 0%, #241a44 60%, #1d2344 100%);
    border:1px solid var(--line);
  }
  .hero h2{margin:0 0 8px; font-size:26px;}
  .hero p{margin:0; color:var(--muted); font-size:14px; line-height:1.7;}

  .grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:22px;
  }
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:18px;
    overflow:hidden; display:flex; flex-direction:column; transition:transform .18s, box-shadow .18s, border-color .18s;
    cursor:pointer;
  }
  .card:hover{transform:translateY(-6px); border-color:var(--accent); box-shadow:0 16px 32px -12px rgba(0,0,0,.6), 0 0 0 1px var(--accent) inset;}
  .thumb{
    height:130px; position:relative; overflow:hidden;
    background:linear-gradient(135deg, var(--accent) 0%, #0b0e1a 130%);
    display:flex; align-items:center; justify-content:center;
  }
  .thumb::before{
    content:""; position:absolute; inset:0;
    background:repeating-linear-gradient(45deg, rgba(255,255,255,.06) 0 2px, transparent 2px 14px);
  }
  .thumb .emoji{font-size:52px; filter:drop-shadow(0 4px 10px rgba(0,0,0,.5)); z-index:1;}
  .badge{
    position:absolute; top:10px; right:10px; z-index:2;
    font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px;
    background:rgba(0,0,0,.45); color:#fff; border:1px solid rgba(255,255,255,.25);
  }
  .body{padding:16px 18px 18px; display:flex; flex-direction:column; gap:8px; flex:1;}
  .body h3{margin:0; font-size:16px;}
  .body .sub{margin:0; color:var(--accent); font-size:12px; font-weight:700;}
  .body p{margin:0; color:var(--muted); font-size:12.5px; line-height:1.6; flex:1;}
  .row{display:flex; align-items:center; justify-content:space-between; margin-top:6px; gap:10px;}
  .play{
    background:linear-gradient(135deg,var(--accent),#0b0e1a 180%);
    color:#fff; border:none; padding:9px 20px; border-radius:10px; font-weight:700; font-size:13px;
    cursor:pointer; flex-shrink:0;
  }
  .play:hover{filter:brightness(1.15);}
  .hint{font-size:11px; color:var(--muted);}
  .players{font-size:12px; color:var(--accent); font-weight:700; white-space:nowrap;}

  footer{text-align:center; color:var(--muted); font-size:12px; padding:20px; border-top:1px solid var(--line);}

  .toast{
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%);
    background:var(--panel2); border:1px solid var(--line); padding:12px 22px; border-radius:12px;
    font-size:13px; color:var(--text); box-shadow:0 10px 30px rgba(0,0,0,.5);
    opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">✦</div>
    <div>
      <h1>星辰遊樂園</h1>
      <span>STAR ARCADE · 個人遊戲平台</span>
    </div>
    <div class="live-pill" id="livePill"><span class="live-dot"></span><span id="liveCount">-- 人正在遊樂園</span></div>
  </div>
  <nav class="tabs" id="tabs">
    <button data-f="all" class="active">全部遊戲</button>
    <button data-f="multi">多人連線</button>
    <button data-f="single">單機</button>
  </nav>
</header>

<main>
  <div class="hero">
    <h2>歡迎回來，選一款遊戲開始吧</h2>
    <p>這裡收錄了目前為止做過的所有遊戲。多人連線遊戲需要先啟動對應的伺服器（滑鼠移到卡片上會顯示啟動指令），單機遊戲點一下就能直接玩。</p>
  </div>

  <section class="grid" id="grid"></section>
</main>

<footer>星辰遊樂園 · 由 Claude 協助開發 · <span id="count"></span> 款遊戲</footer>
<div class="toast" id="toast"></div>

<script>
let GAMES = [];
let activeFilter = 'all';

const grid = document.getElementById('grid');
const toast = document.getElementById('toast');

// platform.html 可能被部署在 GitHub Pages 這種純靜態環境，此時同源沒有
// platform-server.js 可用，改打 Render 上實際跑著這支伺服器的網域。
// 本機用 npm run platform 開發，或直接由 platform-server.js 自己 serve 這個
// 頁面時，同源就有 API，維持相對路徑即可。
const API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.hostname.endsWith('.onrender.com'))
  ? ''
  : 'https://star-arcade.onrender.com';

// 帶逾時的 fetch：避免 Render 免費方案冷啟動（可能要等 30~60 秒）或跨網域被擋時，
// 整頁卡在「載入遊戲清單中…」變成一片黑。
async function fetchJson(url, timeoutMs, opts = {}){
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), timeoutMs);
  try{
    const res = await fetch(url, { ...opts, signal: ctrl.signal });
    if(!res.ok) throw new Error(`${url} → HTTP ${res.status}`);
    return await res.json();
  } finally { clearTimeout(timer); }
}

function showGames(list){
  GAMES = list;
  document.getElementById('count').textContent = GAMES.length;
  render(activeFilter);
}

async function loadGames(){
  grid.innerHTML = '<p style="color:var(--muted);">載入遊戲清單中…</p>';
  let shown = false;

  // 1) 先用同源的靜態快照立刻上畫面。GitHub Pages 這類純靜態環境根本沒有 API，
  //    而 Render 冷啟動又要等很久，所以不能等 API 回來才 render。
  //    快照由 scripts/gen-static-games.js 產生。
  try{
    const snapshot = await fetchJson('games-list.json', 8000);
    if(Array.isArray(snapshot) && snapshot.length){ showGames(snapshot); shown = true; }
  }catch(e){ /* 沒有快照就交給下面的 API */ }

  // 2) 再向平台伺服器要即時清單；成功就換成最新的（新遊戲不必等快照重新產生）。
  try{
    const live = await fetchJson(`${API_BASE}/api/games`, shown ? 20000 : 8000);
    if(Array.isArray(live) && live.length){ showGames(live); shown = true; }
  }catch(e){ /* 純靜態環境或伺服器沒開，維持靜態快照 */ }

  if(!shown){
    grid.innerHTML = '<p style="color:var(--muted);">無法載入遊戲清單，請透過 <code>npm run platform</code> 啟動平台伺服器後再開啟本頁面。</p>';
  }
}

function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>toast.classList.remove('show'), 3200);
}

function render(filter){
  grid.innerHTML = '';
  GAMES.filter(g => filter==='all' ? true : g.tag===filter).forEach(g=>{
    const card = document.createElement('div');
    card.className = 'card';
    card.style.setProperty('--accent', g.accent);
    card.innerHTML = `
      <div class="thumb"><span class="emoji">${g.emoji}</span>
        <span class="badge">${g.tag==='multi' ? '🌐 多人連線' : '🎮 單機'}</span>
      </div>
      <div class="body">
        <h3>${g.title}</h3>
        <p class="sub">${g.sub}</p>
        <p>${g.desc}</p>
        <div class="row">
          <button class="play">開始遊玩</button>
          <span class="players" data-key="${g.key}">👥 -- 人遊玩中</span>
        </div>
        <span class="hint">${g.cmd ? `需啟動伺服器：${g.cmd}` : '免伺服器'}</span>
      </div>`;
    const launch = () => {
      currentGame = g.key;
      heartbeat();
      if (g.cmd){
        showToast(`若尚未啟動，請先在終端機執行： ${g.cmd}`);
      }
      window.open(g.url, '_blank');
    };
    card.querySelector('.play').addEventListener('click', (e)=>{ e.stopPropagation(); launch(); });
    card.addEventListener('click', launch);
    grid.appendChild(card);
  });
  applyStats(latestStats);
}

document.getElementById('tabs').addEventListener('click', (e)=>{
  const btn = e.target.closest('button');
  if (!btn) return;
  [...document.querySelectorAll('#tabs button')].forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  activeFilter = btn.dataset.f;
  render(activeFilter);
});

/* ---- 即時人數（心跳式在線人數統計） ---- */
const SESSION_KEY = 'star-arcade-session-id';
function getSessionId(){
  let id = sessionStorage.getItem(SESSION_KEY);
  if (!id){
    id = (crypto.randomUUID ? crypto.randomUUID() : (Date.now() + '-' + Math.random().toString(36).slice(2)));
    sessionStorage.setItem(SESSION_KEY, id);
  }
  return id;
}
const sessionId = getSessionId();
let currentGame = 'lobby';
let latestStats = { total: 0, byGame: {} };

function applyStats(stats){
  if (stats) latestStats = stats;
  const liveCount = document.getElementById('liveCount');
  if (liveCount) liveCount.textContent = `${latestStats.total} 人正在遊樂園`;
  document.querySelectorAll('.players').forEach(el=>{
    const n = (latestStats.byGame && latestStats.byGame[el.dataset.key]) || 0;
    el.textContent = `👥 ${n} 人遊玩中`;
  });
}

let heartbeatFails = 0;
async function heartbeat(){
  if (heartbeatFails >= 3) return; // 純靜態部署或伺服器沒開時就別再一直打了
  try{
    applyStats(await fetchJson(`${API_BASE}/api/heartbeat`, 6000, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId, game: currentGame }),
    }));
    heartbeatFails = 0;
  }catch(e){ heartbeatFails++; /* 平台伺服器未啟動（例如直接開啟本機檔案）時忽略 */ }
}

heartbeat();
setInterval(heartbeat, 8000);

window.addEventListener('pagehide', ()=>{
  try{
    navigator.sendBeacon(`${API_BASE}/api/leave`, new Blob([JSON.stringify({ sessionId })], { type:'application/json' }));
  }catch(e){}
});

loadGames();
</script>

</body>
</html>
