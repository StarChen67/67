<style>
:root{
  --bg:#0b0e14; --panel:#141a23; --panel2:#1b2330; --line:#2a3442; --txt:#e6ebf5; --dim:#8b96a8;

  --hp:#ff5d73; --hunger:#ff9d2e; --thirst:#5aa9ff; --xp:#c85dff;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--txt);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:14px;min-height:100vh}
body{background:radial-gradient(900px 500px at 50% -10%,#1d2a1f 0%,var(--bg) 60%)}
button{font-family:inherit;font-weight:700;cursor:pointer;border:none;border-radius:9px;padding:8px 12px;font-size:13px;color:#fff;background:var(--panel2);border:1px solid var(--line);transition:filter .1s,transform .1s}
button:hover:not(:disabled){filter:brightness(1.15)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.4;cursor:not-allowed}
.b-gold{background:linear-gradient(135deg,var(--gold),#ff9d2e);color:#3a2a05;border-color:transparent}
.b-green{background:linear-gradient(135deg,#3ddc97,#22a173);color:#062a1c;border-color:transparent}
.b-red{background:linear-gradient(135deg,#ff5d73,#c8324a);border-color:transparent}
.b-blue{background:linear-gradient(135deg,#5aa9ff,#3a7fd1);border-color:transparent}
.b-purple{background:linear-gradient(135deg,#c85dff,#8b5cff);border-color:transparent}
.b-sm{padding:4px 8px;font-size:11.5px;border-radius:7px}
.b-xs{padding:3px 6px;font-size:10.5px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto;padding:8px 8px 90px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.card h2{font-size:12px;letter-spacing:2px;color:var(--dim);margin-bottom:8px;font-weight:700}
.card h3{font-size:14px;margin-bottom:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:720px){.grid2,.grid3{grid-template-columns:1fr}}
.dim{color:var(--dim)} .gold{color:var(--gold)} .green{color:var(--green)} .red{color:var(--red)} .blue{color:var(--blue)} .purple{color:var(--purple)}
.small{font-size:11.5px} .tiny{font-size:10.5px}
.hidden{display:none!important}
.tag{display:inline-block;padding:2px 7px;border-radius:6px;font-size:10.5px;background:var(--panel2);border:1px solid var(--line);color:var(--dim)}
.tag.warn{background:#3a1a1f;border-color:var(--red);color:var(--red)}
.tag.ok{background:#12301f;border-color:var(--green);color:var(--green)}

#menu .sub{color:var(--dim);font-size:12.5px;margin-bottom:24px;max-width:460px;line-height:1.7}

#menu input{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:9px 12px;font-size:14px;width:240px;text-align:center;margin-bottom:10px;font-family:inherit}

/* ---------- 頂欄 / HUD ---------- */

#topbar b{color:var(--txt)}
#hud{display:grid;grid-template-columns:auto 1fr 1fr 1fr auto;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px}

.hud-lv{font-weight:800;font-size:14px}
.hud-lv .xp{font-size:10.5px;color:var(--dim);font-weight:600}
.bar{position:relative;height:16px;background:#05070b;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.bar .fill{height:100%;transition:width .2s}
.bar .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 6px;font-size:10.5px;font-weight:700;color:#fff;text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums}
.bar.hp .fill{background:linear-gradient(90deg,#ff5d73,#c8324a)}
.bar.hunger .fill{background:linear-gradient(90deg,#ff9d2e,#c76a10)}
.bar.thirst .fill{background:linear-gradient(90deg,#5aa9ff,#3a7fd1)}
.bar.xp .fill{background:linear-gradient(90deg,#c85dff,#8b5cff)}
.bar.shelter .fill{background:linear-gradient(90deg,#3ddc97,#22a173)}

.bar.warn{border-color:var(--red);box-shadow:0 0 0 1px var(--red) inset;animation:pulse 1s infinite}

#banner{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}

#nav button.active{color:var(--gold)}

.item .ic{font-size:22px;line-height:1}

.item.q-fine{border-color:#3ddc9760} .item.q-rare{border-color:#5aa9ff80} .item.q-epic{border-color:#c85dff90} .item.q-legendary{border-color:#ffc84a;box-shadow:0 0 8px #ffc84a30}

.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}

/* ---------- 記錄 ---------- */

/* ---------- 列表列 ---------- */

/* ---------- Toast / Modal / GameOver ---------- */
#toasts{position:fixed;top:54px;right:10px;z-index:9000;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none}
.toast{background:rgba(14,18,26,.95);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12.5px;box-shadow:0 4px 14px rgba(0,0,0,.4);animation:tin .25s ease-out;max-width:300px}
.toast.good{border-color:var(--green)} .toast.bad{border-color:var(--red)} .toast.warn{border-color:var(--gold)} .toast.loot{border-color:#ffd88a}
@keyframes tin{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
.modal-mask{position:fixed;inset:0;background:rgba(4,5,10,.8);display:flex;align-items:center;justify-content:center;z-index:8000;padding:14px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;max-width:520px;width:100%;max-height:86vh;overflow:auto}
.modal h3{font-size:16px;margin-bottom:8px}
.modal p{font-size:13px;line-height:1.6;color:#cfd6e2;margin-bottom:10px}
.modal textarea{width:100%;min-height:90px;background:#05070b;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:11px;font-family:monospace}
#gameover{position:fixed;inset:0;background:rgba(30,4,4,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:8500;text-align:center;padding:20px}
#gameover h1{font-size:34px;color:var(--red);margin-bottom:8px}
#gameover p{font-size:16px;margin-bottom:6px}
#gameover .stats{font-size:12px;color:var(--dim);margin:10px 0 18px;line-height:1.8}
#gameover .btns{display:flex;flex-direction:column;gap:8px;width:220px}
#gameover .btns button{padding:11px;font-size:14px}

/* ---------- 地圖 / 探索 / 戰鬥 ---------- */
canvas.scene{display:block;width:100%;border-radius:12px;border:1px solid var(--line);background:#070a10}
.poi{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:6px}
.poi .ic{font-size:22px;width:30px;text-align:center}
.poi.done{opacity:.45}
.enemy{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:6px}
.enemy.target{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.enemy .ic{font-size:26px;width:34px;text-align:center}
.enemy .bar{flex:1}
.cd{height:5px;background:#05070b;border-radius:3px;overflow:hidden;margin-top:3px}
.cd .fill{height:100%;background:var(--gold)}
.bigbtn{padding:14px;font-size:16px;border-radius:12px}
.areaCard{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:4px}
.areaCard.locked{opacity:.5}
.areaCard .nm{font-weight:800;font-size:14px}
.danger{color:var(--orange)}
</style>

<body>
<a class="sa-home-btn" href="platform.html" title="回遊樂園">🏠</a>
<div id="app"></div>
<script>
(function () {
"use strict";
// 極簡模組載入器：把原本的 ES 模組包成函式，避開 file:// 不能載入模組的限制。
var __registry = Object.create(null);
function __def(id, fn) { __registry[id] = { fn: fn, exports: null }; }
function __req(id) {
  var m = __registry[id];
  if (!m) throw new Error("missing module: " + id);
  if (!m.exports) { m.exports = {}; m.fn(m.exports, __req); }
  return m.exports;
}

__def("core/registry.js", function (exports, __req) {
/**
 * Data Registry：把 data/ 的陣列轉成 id → def 的索引，提供查詢與交叉引用驗證。
 * 系統只透過這裡讀資料，不直接 import data/*。
 */
const QUALITIES = ['common', 'fine', 'rare', 'epic', 'legendary'];
const BLUEPRINT_TYPES = ['weapon', 'armor', 'tool', 'medicine', 'building', 'defense', 'shelter', 'utility', 'special'];
const ITEM_TYPES = ['food', 'water', 'material', 'medicine', 'weapon', 'armor', 'ammo', 'blueprint', 'quest', 'special'];
const SLOTS = ['weapon', 'head', 'body', 'legs', 'accessory'];

class Registry {
  constructor(data) {
    this.raw = data;
    this.balance = data.balance;
    this.items = index(data.items);
    this.statusEffects = index(data.statusEffects);
    this.monsters = index(data.monsters);
    this.lootTables = index(data.lootTables);
    this.chests = index(data.chests, 'tier');
    this.areas = index(data.areas);
    this.shelterLevels = index(data.shelterLevels, 'level');
    this.buildings = index(data.buildings);
    this.recipes = index(data.recipes);
    this.blueprints = index(data.blueprints);
    this.disasters = index(data.disasters);
    this.events = index(data.events);
    this.raids = index(data.raids);
    // 反查：recipeId → 解鎖它的圖紙們
    this.blueprintsByRecipe = new Map();
    for (const bp of this.blueprints.values()) {
      for (const rid of bp.unlockedRecipeIds || []) {
        if (!this.blueprintsByRecipe.has(rid)) this.blueprintsByRecipe.set(rid, []);
        this.blueprintsByRecipe.get(rid).push(bp.id);
      }
    }
    // 圖紙 → 物品
    this.blueprintItem = new Map();
    for (const it of this.items.values()) if (it.type === 'blueprint' && it.blueprintId) this.blueprintItem.set(it.blueprintId, it.id);
  }

  item(id) { return this.items.get(id); }
  monster(id) { return this.monsters.get(id); }
  lootTable(id) { return this.lootTables.get(id); }
  chest(tier) { return this.chests.get(tier); }
  area(id) { return this.areas.get(id); }
  shelterLevel(l) { return this.shelterLevels.get(l); }
  building(id) { return this.buildings.get(id); }
  recipe(id) { return this.recipes.get(id); }
  blueprint(id) { return this.blueprints.get(id); }
  disaster(id) { return this.disasters.get(id); }
  event(id) { return this.events.get(id); }
  raid(id) { return this.raids.get(id); }
  status(id) { return this.statusEffects.get(id); }

  /** 取不到就丟錯（用於程式邏輯錯誤而非玩家輸入） */
  req(kind, id) {
    const v = this[kind]?.get(id);
    if (!v) throw new Error(`Registry: ${kind} "${id}" not found`);
    return v;
  }
  list(kind) { return [...this[kind].values()]; }

  /** 完整交叉引用驗證；回傳錯誤字串陣列（空 = 通過） */
  validate() {
    const errs = [];
    const hasItem = (id) => this.items.has(id);
    const need = (cond, msg) => { if (!cond) errs.push(msg); };

    for (const it of this.items.values()) {
      need(ITEM_TYPES.includes(it.type), `item ${it.id}: bad type ${it.type}`);
      need(QUALITIES.includes(it.quality || 'common'), `item ${it.id}: bad quality ${it.quality}`);
      need(typeof it.weight === 'number' && it.weight >= 0, `item ${it.id}: weight`);
      need(Number.isInteger(it.stackMax) && it.stackMax >= 1, `item ${it.id}: stackMax`);
      if (it.equip) {
        need(SLOTS.includes(it.equip.slot), `item ${it.id}: bad slot ${it.equip.slot}`);
        need(it.stackMax === 1, `item ${it.id}: equipment must stackMax 1`);
      }
      if (it.type === 'blueprint') need(this.blueprints.has(it.blueprintId), `item ${it.id}: blueprintId ${it.blueprintId} missing`);
      for (const eff of it.effects || []) need(eff.type !== 'status' || this.statusEffects.has(eff.id), `item ${it.id}: status ${eff.id} missing`);
    }
    for (const bp of this.blueprints.values()) {
      need(BLUEPRINT_TYPES.includes(bp.type), `blueprint ${bp.id}: bad type ${bp.type}`);
      need(bp.level >= 1 && bp.level <= 5, `blueprint ${bp.id}: level`);
      need(QUALITIES.includes(bp.rarity), `blueprint ${bp.id}: rarity`);
      need(bp.requiredWorkbenchLevel >= 0 && bp.requiredWorkbenchLevel <= 5, `blueprint ${bp.id}: requiredWorkbenchLevel`);
      need(Array.isArray(bp.unlockedRecipeIds), `blueprint ${bp.id}: unlockedRecipeIds`);
      const gates = [...this.shelterLevels.values()].some((s) => s.requiredBlueprintId === bp.id) || [...this.buildings.values()].some((b) => b.levels.some((l) => l.requiredBlueprintId === bp.id));
      need(bp.unlockedRecipeIds.length > 0 || gates, `blueprint ${bp.id}: unlocks nothing (no recipes, no building/shelter gate)`);
      const wbMax = Math.max(0, ...bp.unlockedRecipeIds.map((rid) => this.recipes.get(rid)).filter((x) => x && x.requiredStation?.station === 'workbench').map((x) => x.requiredStation.level));
      if (bp.unlockedRecipeIds.length) need(bp.requiredWorkbenchLevel >= wbMax, `blueprint ${bp.id}: requiredWorkbenchLevel ${bp.requiredWorkbenchLevel} < recipe workbench level ${wbMax}`);
      for (const rid of bp.unlockedRecipeIds || []) need(this.recipes.has(rid), `blueprint ${bp.id}: recipe ${rid} missing`);
      for (const a of bp.dropLocations || []) need(this.areas.has(a), `blueprint ${bp.id}: area ${a} missing`);
      need(this.blueprintItem.has(bp.id), `blueprint ${bp.id}: no item of type blueprint references it`);
    }
    for (const r of this.recipes.values()) {
      need(hasItem(r.resultItemId), `recipe ${r.id}: result ${r.resultItemId} missing`);
      for (const c of r.requiredItems || []) need(hasItem(c.itemId), `recipe ${r.id}: ingredient ${c.itemId} missing`);
      need(r.defaultUnlocked || this.blueprintsByRecipe.has(r.id), `recipe ${r.id}: locked but no blueprint unlocks it`);
      need(r.requiredStation === null || (r.requiredStation && typeof r.requiredStation.station === 'string' && r.requiredStation.level >= 1), `recipe ${r.id}: requiredStation`);
      need(Number.isInteger(r.resultQty) && r.resultQty >= 1, `recipe ${r.id}: resultQty`);
      need(typeof r.craftingTime === 'number' && r.craftingTime >= 0, `recipe ${r.id}: craftingTime`);

__def("core/events.js", function (exports, __req) {
/**
 * 極簡 EventBus。系統之間、系統與 UI 之間唯一的鬆耦合管道。
 * 監聽器丟出的例外會被隔離（不會中斷 tick），並轉交 onError。
 */
class EventBus {
  constructor() {
    this.listeners = new Map();
    this.onError = (err, name) => { if (typeof console !== 'undefined') console.error(`[EventBus] listener error on "${name}"`, err); };
    this.history = []; // 最近事件（除錯/測試用）
    this.historyLimit = 200;
  }
  on(name, fn) {
    if (!this.listeners.has(name)) this.listeners.set(name, new Set());
    this.listeners.get(name).add(fn);
    return () => this.off(name, fn);
  }
  once(name, fn) {
    const off = this.on(name, (payload) => { off(); fn(payload); });
    return off;
  }
  off(name, fn) {
    const set = this.listeners.get(name);
    if (set) set.delete(fn);
  }
  emit(name, payload) {
    if (name !== 'tick') {
      this.history.push({ name, payload });
      if (this.history.length > this.historyLimit) this.history.shift();
    }
    const set = this.listeners.get(name);
    if (set) {
      for (const fn of [...set]) {
        try { fn(payload, name); } catch (err) { this.onError(err, name); }
      }
    }
    const any = this.listeners.get('*');
    if (any) {
      for (const fn of [...any]) {
        try { fn(payload, name); } catch (err) { this.onError(err, name); }
      }
    }
  }
  clear() { this.listeners.clear(); this.history.length = 0; }
}

  Object.assign(exports, { EventBus });
});

/**
 * ModifierStack（provider 制）：數值修正的匿名管道。
 *
 * 各系統在 init() 註冊一次 provider：`provide(name, (key) => [{ mult?, add?, label }])`，
 * provider 讀取「當下 state」計算自己提供的修正（狀態效果、天災、建築、區域環境…）。
 * 使用方只問 `resolve(key, base)`。沒有 add/remove 生命週期 → 讀檔後不需重建。
 *
 * resolve(key, base) = clamp((base + Σadd) × Πmult, bounds[key])
 * 每個模擬步長內結果會快取（invalidate() 由 Game.step 每步呼叫）。
 */
class ModifierStack {
  constructor(bounds = {}) {
    this.providers = new Map(); // name -> fn(key) => entries[]
    this.bounds = bounds;
    this.cache = new Map();
  }
  provide(name, fn) {
    this.providers.set(name, fn);
    this.cache.clear();
  }
  unprovide(name) {
    this.providers.delete(name);
    this.cache.clear();
  }
  invalidate() { this.cache.clear(); }

  /** 收集所有 provider 對 key 的修正 */
  collect(key) {
    const out = [];
    for (const [name, fn] of this.providers) {
      let entries;
      try { entries = fn(key); } catch (err) { if (typeof console !== 'undefined') console.error(`[Modifiers] provider ${name} failed`, err); continue; }
      if (!entries) continue;
      for (const e of entries) {
        if (!e) continue;
        out.push({ provider: name, label: e.label || name, mult: e.mult ?? 1, add: e.add ?? 0 });
      }
    }
    return out;
  }
  get(key) {
    if (this.cache.has(key)) return this.cache.get(key);
    let mult = 1, add = 0;
    for (const e of this.collect(key)) { mult *= e.mult; add += e.add; }
    const r = { mult, add };
    this.cache.set(key, r);
    return r;
  }
  resolve(key, base) {
    const { mult, add } = this.get(key);
    let v = (base + add) * mult;
    const b = this.bounds[key];
    if (b) v = Math.max(b[0], Math.min(b[1], v));
    return v;
  }
  /** UI 顯示「口渴 ×1.5（熱浪）」用 */
  explain(key) { return this.collect(key); }
}

const MODIFIER_KEYS = Object.freeze([
  'hungerRate', 'thirstRate', 'exploreSpeed', 'gatherSpeed', 'carryCapacity', 'storageCapacity',
  'playerAttack', 'playerDefense', 'playerMaxHp', 'attackSpeed', 'critChance', 'accuracy', 'dodge', 'moveSpeed',
  'enemyAttack', 'enemyHp', 'lootChance', 'blueprintChance', 'xpGain',
  'shelterDefense', 'raidDamage', 'healRate', 'craftSpeed', 'ambushChance', 'outdoorDamage',
]);

  Object.assign(exports, { ModifierStack, MODIFIER_KEYS });
});

__def("game/selectors.js", function (exports, __req) {
/**
 * 純函式選擇器：從 state 推導「衍生事實」，永不寫入 state。
 * 位置只有一個真相來源：exploration / combat 子樹。
 */
function getLocation(state) {
  if (!state) return 'shelter';
  if (state.combat && state.combat.origin === 'raid') return 'raid';
  const ex = state.exploration;
  if (ex) return ex.phase === 'explore' ? 'area' : 'travel';
  return 'shelter';
}
const isOutdoor = (state) => !!(state && state.exploration);
const isHome = (state) => !isOutdoor(state);
const inCombat = (state) => !!(state && state.combat);
const isGameOver = (state) => !!(state && state.gameOver);

const LOCATION_LABEL = Object.freeze({ shelter: '避難所', travel: '旅途中', area: '探索中', raid: '防守中' });

/** 倉庫中某類型物品的總數量（食物庫存／飲水庫存） */
function stockOf(state, registry, type) {
  let n = 0;
  for (const it of state.shelter.storage.items) {
    const def = registry.item(it.itemId);
    if (def && def.type === type) n += it.qty;
  }
  return n;
}

/** 事件觸發條件用的 selector 取值 */
function selectValue(state, ctx, selector) {
  switch (selector) {
    case 'player.level': return state.player.level;
    case 'player.hp': return state.player.hp;
    case 'player.hunger': return state.player.hunger;
    case 'player.thirst': return state.player.thirst;
    case 'clock.day': return ctx.clock.day;
    case 'clock.hour': return ctx.clock.hour;
    case 'shelter.level': return state.shelter.level;
    case 'shelter.hp': return state.shelter.hp;
    case 'stock.food': return stockOf(state, ctx.registry, 'food');
    case 'stock.water': return stockOf(state, ctx.registry, 'water');
    case 'stats.kills': return state.stats.kills;
    case 'blueprints.learned': return state.blueprints.learned.length;
    case 'raid.count': return state.raid.count;
    default:
      if (selector.startsWith('flag.')) return state.flags[selector.slice(5)];
      return undefined;
  }
}

function evalPredicates(state, ctx, predicates) {
  for (const p of predicates || []) {
    const v = selectValue(state, ctx, p.selector);
    if (v === undefined) return false;
    switch (p.op) {
      case '>=': if (!(v >= p.value)) return false; break;
      case '<=': if (!(v <= p.value)) return false; break;
      case '>': if (!(v > p.value)) return false; break;
      case '<': if (!(v < p.value)) return false; break;
      case '==': if (v != p.value) return false; break; // eslint-disable-line eqeqeq
      case '!=': if (v == p.value) return false; break; // eslint-disable-line eqeqeq
      default: return false;
    }
  }
  return true;
}

  Object.assign(exports, { getLocation, stockOf, selectValue, evalPredicates, isOutdoor, isHome, inCombat, isGameOver, LOCATION_LABEL });
});

 *  - ContinuousEffect（perSec 型 / modifier）→ 擁有者每步呼叫 tickContinuous(effects, dt, opts)；
 *    modifier 型不在這裡執行，而是由各系統的 modifier provider 讀資料表提供（見 core/modifiers.js）。
 *
 * handler 簽名：(effect, amount, ctx, opts)

 *   opts：{ source, subject?, instant, dt }；subject = 受作用的實體（玩家用 null，敵人用 EnemyInstance）

    this.handlers = new Map();
    registerBuiltins(this);

      if (eff.chance != null && !this.ctx.rng.world.chance(eff.chance)) continue;
      const h = this.handlers.get(eff.type);

__def("core/clock.js", function (exports, __req) {
const { EV } = __req("core/events-catalog.js");
/**
 * 世界時間。狀態存在 state.clock = { time, lastHour, lastDay }（last* 只為邊緣觸發事件用）。
 * time 以秒累計，day 從 1 起算，hour 0~23，皆為 getter。
 */
class Clock {
  constructor(ctx) { this.ctx = ctx; }
  get dayLength() { return this.ctx.registry.balance.time.dayLength; }
  get time() { return this.ctx.state.clock.time; }
  get day() { return Math.floor(this.time / this.dayLength) + 1; }
  /** 一天內的進度 0~1 */
  get dayProgress() { return (this.time % this.dayLength) / this.dayLength; }
  get hour() { return Math.floor(this.dayProgress * 24); }
  get isNight() { const h = this.hour; return h >= 20 || h < 6; }
  /** 天數（可為小數），供排程用 */
  get days() { return this.time / this.dayLength; }
  dayToTime(day) { return (day - 1) * this.dayLength; }
  hoursToSec(h) { return (h / 24) * this.dayLength; }

  advance(dt) {
    const c = this.ctx.state.clock;
    c.time = Math.round((c.time + dt) * 10000) / 10000; // 避免 0.1 累加的浮點漂移
    const day = this.day, hour = this.hour;
    if (hour !== c.lastHour) {
      c.lastHour = hour;
      this.ctx.bus.emit(EV.CLOCK_HOUR, { day, hour });
    }
    if (day !== c.lastDay) {
      c.lastDay = day;
      this.ctx.bus.emit(EV.CLOCK_DAY, { day });
    }
  }
}

  Object.assign(exports, { Clock });
});

__def("core/rng.js", function (exports, __req) {
/**
 * mulberry32 seeded PRNG。所有遊戲內隨機都必須走這裡，讓測試可重現、存檔可續用同一序列。
 * 狀態只有一個 32-bit 整數，直接存進 state.rng.<stream>。
 */
class RNG {
  constructor(seed = 1) {
    this.s = (Number(seed) >>> 0) || 1;
  }
  /** [0, 1) */
  next() {
    let t = (this.s = (this.s + 0x6d2b79f5) >>> 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  /** 整數，含兩端 */
  int(min, max) {
    min = Math.ceil(min); max = Math.floor(max);
    if (max < min) [min, max] = [max, min];
    return min + Math.floor(this.next() * (max - min + 1));
  }
  /** 浮點 [min, max) */
  range(min, max) { return min + this.next() * (max - min); }
  chance(p) { return this.next() < p; }
  pick(arr) { return arr.length ? arr[Math.floor(this.next() * arr.length)] : undefined; }
  shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(this.next() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }
  getState() { return this.s; }
  setState(s) { this.s = (Number(s) >>> 0) || 1; }
}

const RNG_STREAMS = Object.freeze(['world', 'combat', 'loot', 'explore', 'craft']);

/**
 * 多條獨立分流：UI 操作時機（例如按攻擊的快慢）不會擾動掉落擲骰。
 * 狀態以 { world, combat, loot, explore, craft } 存在 state.rng；每次存檔前 sync()。
 */
class RNGSet {
  constructor(seed = 1) {
    for (const name of RNG_STREAMS) this[name] = new RNG(0);
    this.reseed(seed);
  }
  reseed(seed) {
    let s = (Number(seed) >>> 0) || 1;
    for (const name of RNG_STREAMS) {
      s = (Math.imul(s ^ 0x9e3779b9, 0x85ebca6b) + 0x1234567) >>> 0;
      this[name].setState(s || 1);
    }
  }
  getState() {
    const o = {};
    for (const name of RNG_STREAMS) o[name] = this[name].getState();
    return o;
  }
  setState(o) {
    if (!o) return;
    for (const name of RNG_STREAMS) if (o[name] != null) this[name].setState(o[name]);
  }
}

/** 由字串產生 seed（FNV-1a） */
function seedFromString(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < String(str).length; i++) {
    h ^= String(str).charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return h >>> 0;
}

  Object.assign(exports, { seedFromString, RNG, RNGSet, RNG_STREAMS });
});

/**
 * 所有系統的基底。規則：
 *  - 永遠透過 this.ctx.state 讀狀態（getter），不得快取 state 物件。
 *  - 只寫自己擁有的子樹；跨系統只呼叫公開 API。
 *  - init()：註冊 bus 監聽與 modifier provider（只呼叫一次）。
 *  - onNewGame() / onStateLoaded()：狀態被建立或替換後的鉤子。
 *  - update(dt)：每個固定步長呼叫（dt ≤ balance.time.step）。
 */
class System {
  constructor(ctx, name) {
    this.ctx = ctx;
    this.name = name;
  }
  get state() { return this.ctx.state; }
  get bus() { return this.ctx.bus; }
  get registry() { return this.ctx.registry; }
  get balance() { return this.ctx.registry.balance; }
  get rng() { return this.ctx.rng; }

  onNewGame() {}
  onStateLoaded() {}

  }

/**
 * 通用工具（純函式，無副作用、無 DOM）。
 */
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const lerp = (a, b, t) => a + (b - a) * t;
const round1 = (v) => Math.round(v * 10) / 10;
const round2 = (v) => Math.round(v * 100) / 100;

function deepClone(o) {
  return o == null ? o : JSON.parse(JSON.stringify(o));
}

/** 依權重挑選一個元素；entries 可為物件陣列（預設讀 .weight）或 {id:weight} 物件 */
function weightedPick(rng, entries, weightOf = (e) => e.weight) {
  if (!Array.isArray(entries)) {
    const arr = Object.entries(entries).map(([k, w]) => ({ key: k, weight: w }));
    const picked = weightedPick(rng, arr);
    return picked ? picked.key : null;
  }
  let total = 0;
  for (const e of entries) total += Math.max(0, weightOf(e) || 0);
  if (total <= 0) return null;
  let r = rng.next() * total;
  for (const e of entries) {
    r -= Math.max(0, weightOf(e) || 0);
    if (r < 0) return e;
  }
  return entries[entries.length - 1];
}

/** 由 rng 產生在此存檔內唯一的 id（前綴 + 36 進位亂數 + 遞增計數） */
let _uidCounter = 0;
function makeUid(rng, prefix = 'i') {
  _uidCounter = (_uidCounter + 1) % 1e9;
  const r = rng ? rng.int(0, 0x7fffffff) : Math.floor(Math.random() * 0x7fffffff);
  return `${prefix}_${r.toString(36)}${_uidCounter.toString(36)}`;
}

function fmtTime(sec) {
  sec = Math.max(0, Math.floor(sec));
  const m = Math.floor(sec / 60), s = sec % 60;
  return m > 0 ? `${m}分${String(s).padStart(2, '0')}秒` : `${s}秒`;
}

function fmtNum(n) {
  if (n == null || Number.isNaN(n)) return '—';
  if (Math.abs(n) >= 10000) return (n / 1000).toFixed(1) + 'k';
  return Number.isInteger(n) ? String(n) : n.toFixed(1);
}

function sum(arr, f = (x) => x) {
  let t = 0;
  for (const x of arr) t += f(x);
  return t;
}

function isFiniteNumber(v) {
  return typeof v === 'number' && Number.isFinite(v);
}

/** 遞迴檢查物件內有沒有 NaN / Infinity（測試用） */
function findNonFinite(obj, path = '') {
  const bad = [];
  if (typeof obj === 'number') {
    if (!Number.isFinite(obj)) bad.push(path || '(root)');
    return bad;
  }
  if (obj && typeof obj === 'object') {
    for (const k of Object.keys(obj)) bad.push(...findNonFinite(obj[k], path ? `${path}.${k}` : k));

/**
 * ProgressionSystem：經驗值與升級曲線。升級獎勵由 balance.progression.perLevel 決定，
 * 加成本身在 Player.getStats() 由等級推導（不存絕對值），未來技能樹寫 player.bonus。

    while (p.level < this.cfg.maxLevel && p.xp >= this.xpToNext(p.level)) {
      p.xp -= this.xpToNext(p.level);
      p.level += 1;
      const gains = { ...this.cfg.perLevel };
      // 升級時回復新增的最大生命（不重算全額）
      p.hp = Math.min(this.systems.player.maxHp, p.hp + (gains.maxHp || 0));

      this.bus.emit(EV.PLAYER_STATS_CHANGED, {});
    }

  }
}

});

   * force=true 忽略容量（卸裝備、退款用）。
   */
  add(container, itemId, qty = 1, { quality, force = false, instance } = {}) {
    const def = this.registry.item(itemId);
    if (!def || !(qty > 0)) return { ok: false, added: 0, leftover: qty, reason: 'unknownItem' };
    const list = this.items(container);
    qty = Math.floor(qty);
    let canAdd = qty;
    if (!force) {
      const free = this.free(container);
      const perUnit = def.weight || 0;
      canAdd = perUnit > 0 ? Math.min(qty, Math.floor((free + 1e-9) / perUnit)) : qty;
      if (canAdd <= 0) return { ok: false, added: 0, leftover: qty, reason: 'overweight' };
    }
    let remaining = canAdd;
    let last = null;
    if (def.stackMax > 1) {
      const q = quality || (instance && instance.quality);
      for (const it of list) {
        if (remaining <= 0) break;
        if (it.itemId !== itemId || (it.quality || null) !== (q || null)) continue;
        const room = def.stackMax - it.qty;
        if (room <= 0) continue;
        const n = Math.min(room, remaining);
        it.qty += n; remaining -= n; last = it;
      }
      while (remaining > 0) {
        const n = Math.min(def.stackMax, remaining);
        const inst = this.systems.item.createInstance(itemId, n, q);
        list.push(inst); remaining -= n; last = inst;
      }
    } else {
      // 裝備：每件一格
      if (instance && instance.itemId === itemId) { list.push(instance); remaining -= 1; last = instance; }
      while (remaining > 0) {
        const inst = this.systems.item.createInstance(itemId, 1, quality);
        list.push(inst); remaining -= 1; last = inst;
      }
    }
    this.bus.emit(EV.INVENTORY_CHANGED, { container });
    return { ok: canAdd === qty, added: canAdd, leftover: qty - canAdd, inst: last, reason: canAdd === qty ? undefined : 'overweight' };
  }

  /** 放入既有實例（保留 uid/品質）。 */
  addInstance(container, inst, { force = false } = {}) {
    const def = this.registry.item(inst.itemId);
    if (!def) return { ok: false, added: 0, leftover: inst.qty };
    if (def.stackMax > 1) return this.add(container, inst.itemId, inst.qty, { quality: inst.quality, force });
    if (!force && this.free(container) + 1e-9 < (def.weight || 0)) return { ok: false, added: 0, leftover: 1, reason: 'overweight' };
    this.items(container).push(inst);
    this.bus.emit(EV.INVENTORY_CHANGED, { container });
    return { ok: true, added: 1, leftover: 0, inst };
  }

  remove(container, itemId, qty = 1) {
    const list = this.items(container);
    let left = Math.floor(qty);
    for (let i = list.length - 1; i >= 0 && left > 0; i--) {
      const it = list[i];
      if (it.itemId !== itemId) continue;
      const n = Math.min(it.qty, left);
      it.qty -= n; left -= n;
      if (it.qty <= 0) list.splice(i, 1);
    }
    const removed = Math.floor(qty) - left;
    if (removed > 0) this.bus.emit(EV.INVENTORY_CHANGED, { container });
    return removed;
  }
  removeByUid(container, uid, qty = Infinity) {
    const list = this.items(container);
    const i = list.findIndex((it) => it.uid === uid);
    if (i < 0) return 0;
    const it = list[i];
    const n = Math.min(it.qty, qty);
    it.qty -= n;
    if (it.qty <= 0) list.splice(i, 1);
    this.bus.emit(EV.INVENTORY_CHANGED, { container });
    return n;
  }
  /** 取出（不銷毀）一個實例或其中 qty 個，回傳新的獨立實例 */
  takeByUid(container, uid, qty = Infinity) {
    const found = this.find(container, uid);
    if (!found) return null;
    const { inst } = found;
    const n = Math.min(inst.qty, qty);
    if (n >= inst.qty) {
      const list = this.items(container);
      list.splice(list.indexOf(inst), 1);
      this.bus.emit(EV.INVENTORY_CHANGED, { container });
      return inst;
    }
    inst.qty -= n;
    this.bus.emit(EV.INVENTORY_CHANGED, { container });
    const copy = { ...inst, uid: this.uid('it'), qty: n };
    return copy;
  }
  removeAnywhere(itemId, qty = 1) {
    let left = qty;
    left -= this.remove('inventory', itemId, left);
    if (left > 0) left -= this.remove('storage', itemId, left);
    return qty - left;
  }
  /** 依成本扣除：先倉庫後背包（製作/建造用）。呼叫前請先確認足夠。 */
  consume(costs, containers = ['storage', 'inventory']) {
    for (const c of costs || []) {
      let left = c.qty;
      for (const k of containers) { if (left <= 0) break; left -= this.remove(k, c.itemId, left); }
    }
  }

  /** 轉移 qty 個（預設整堆）到另一容器，受容量限制。 */
  transfer(from, uid, qty = Infinity, to) {
    to = to || this.otherContainer(from);
    const found = this.find(from, uid);
    if (!found) return { ok: false, reason: 'notFound' };
    const { inst } = found;
    const def = this.registry.item(inst.itemId);
    const n = Math.min(inst.qty, qty);
    const perUnit = def.weight || 0;
    const can = perUnit > 0 ? Math.min(n, Math.floor((this.free(to) + 1e-9) / perUnit)) : n;
    if (can <= 0) return { ok: false, reason: 'overweight', moved: 0 };
    const taken = this.takeByUid(from, uid, can);
    const r = this.addInstance(to, taken, { force: true });
    return { ok: can === n, moved: can, leftover: n - can, reason: can === n ? undefined : 'overweight', inst: r.inst };
  }
  /** 把背包全部存入倉庫（放不下的留在背包） */
  depositAll() {
    let moved = 0, blocked = 0;
    for (const it of [...this.items('inventory')]) {
      const r = this.transfer('inventory', it.uid, Infinity, 'storage');
      moved += r.moved || 0;
      if (!r.ok) blocked++;
    }
    return { moved, blocked };
  }

  /**
   * 給予物品（效果、產出、掉落）：在家 → 倉庫，滿則背包；在外 → 背包，滿則戰利品暫存區。
   */
  grant(itemId, qty = 1, { quality, source } = {}) {
    let leftover = qty;
    const order = isHome(this.state) ? ['storage', 'inventory'] : ['inventory'];
    for (const c of order) {
      if (leftover <= 0) break;
      const r = this.add(c, itemId, leftover, { quality });
      leftover = r.leftover;
    }
    if (leftover > 0) {
      const inst = this.systems.item.createInstance(itemId, leftover, quality);
      const pile = this.lootPile();
      if (pile) pile.push(inst); else this.add('inventory', itemId, leftover, { quality, force: true });
    }
    this.bus.emit(EV.LOOT_DROPPED, { items: [{ itemId, qty }], source, leftover });

  }
  /** 目前可用的戰利品暫存區（戰鬥中 → combat.loot；探索中 → exploration.lootPile；否則 null） */
  lootPile() {
    if (this.state.combat) return this.state.combat.loot;
    if (this.state.exploration) return this.state.exploration.lootPile;
    return null;
  }
  /** 從暫存區撿起 */
  takeLoot(uid, qty = Infinity) {
    const pile = this.lootPile();
    if (!pile) return { ok: false, reason: 'noPile' };
    const i = pile.findIndex((it) => it.uid === uid);
    if (i < 0) return { ok: false, reason: 'notFound' };
    const inst = pile[i];
    const def = this.registry.item(inst.itemId);
    const n = Math.min(inst.qty, qty);
    const perUnit = def?.weight || 0;
    const can = perUnit > 0 ? Math.min(n, Math.floor((this.free('inventory') + 1e-9) / perUnit)) : n;
    if (can <= 0) return { ok: false, reason: 'overweight' };
    if (can >= inst.qty) { pile.splice(i, 1); this.addInstance('inventory', inst, { force: true }); }
    else { inst.qty -= can; this.add('inventory', inst.itemId, can, { quality: inst.quality, force: true }); }
    return { ok: true, moved: can, leftover: n - can };
  }
  takeAllLoot() {
    const pile = this.lootPile();
    if (!pile) return { moved: 0, blocked: 0 };
    let moved = 0, blocked = 0;
    for (const it of [...pile]) { const r = this.takeLoot(it.uid); if (r.ok) moved += r.moved; else blocked++; }

  }

    const pile = this.lootPile();
    if (!pile) return false;
    const i = pile.findIndex((it) => it.uid === uid);
    if (i < 0) return false;
    pile.splice(i, 1);
    return true;
  }
}

  Object.assign(exports, { InventorySystem });
});

const { System } = __req("systems/base.js");
const { EV } = __req("core/events-catalog.js");
const { SLOTS } = __req("core/registry.js");
/**
 * EquipmentSystem：五個裝備槽。擁有 player.equipment。
 * 裝備數值透過 getBonus() 彙總給 Player.getStats()；負重加成透過 modifier provider 'equipment'。
 */
class EquipmentSystem extends System {
  constructor(ctx) { super(ctx, 'equipment'); }

  init() {
    this.modifiers.provide('equipment', (key) => {
      if (key !== 'carryCapacity') return null;
      const b = this.getBonus();
      return b.carry ? [{ add: b.carry, label: '裝備' }] : null;
    });
  }

  slots() { return SLOTS; }
  get(slot) { return this.state.player.equipment[slot] || null; }
  all() { return SLOTS.map((slot) => ({ slot, inst: this.get(slot) })); }

  /** 彙總所有裝備數值 */
  getBonus() {
    const out = { resist: {} };
    for (const slot of SLOTS) {
      const inst = this.get(slot);
      if (!inst) continue;
      const stats = this.systems.item.getStats(inst) || {};

        if (k === 'attackSpeed' && slot === 'weapon') { out.weaponAttackSpeed = v; continue; }
        out[k] = (out[k] || 0) + v;
      }
      const def = this.registry.item(inst.itemId);
      for (const [k, v] of Object.entries(def?.equip?.resist || {})) out.resist[k] = Math.min(0.9, (out.resist[k] || 0) + v);
    }
    return out;
  }

  weapon() {
    const inst = this.get('weapon');
    if (!inst) return null;
    const def = this.registry.item(inst.itemId);
    return { inst, def, ammo: def?.equip?.ammo || null, stats: this.systems.item.getStats(inst) };
  }

  /** 從背包或倉庫裝備 uid；舊裝備回到來源容器（強制放入，容量軟上限）。 */
  equip(uid) {
    const inv = this.systems.inventory;
    const found = inv.findAnywhere(uid);
    if (!found) return { ok: false, reason: 'notFound' };
    const def = this.registry.item(found.inst.itemId);
    if (!def?.equip) return { ok: false, reason: 'notEquipment' };
    const slot = def.equip.slot;
    const taken = inv.takeByUid(found.container, uid, 1);
    const old = this.get(slot);
    this.state.player.equipment[slot] = taken;
    if (old) inv.addInstance(found.container, old, { force: true });
    this.bus.emit(EV.EQUIPMENT_CHANGED, { slot, itemId: taken.itemId, previous: old?.itemId || null });
    this.bus.emit(EV.PLAYER_STATS_CHANGED, {});
    return { ok: true, result: { slot, itemId: taken.itemId, previous: old?.itemId || null } };
  }

  unequip(slot, to) {
    const inv = this.systems.inventory;
    const inst = this.get(slot);
    if (!inst) return { ok: false, reason: 'empty' };
    const container = to || (this.state.exploration ? 'inventory' : 'storage');
    this.state.player.equipment[slot] = null;
    inv.addInstance(container, inst, { force: true });
    this.bus.emit(EV.EQUIPMENT_CHANGED, { slot, itemId: null, previous: inst.itemId });
    this.bus.emit(EV.PLAYER_STATS_CHANGED, {});
    return { ok: true, result: { slot, itemId: inst.itemId, container } };
  }
}

  Object.assign(exports, { EquipmentSystem });
});

__def("core/storage.js", function (exports, __req) {
/**
 * Storage adapter：瀏覽器用 localStorage，Node/測試或不可用時用記憶體 Map。
 * 值一律 JSON 序列化。這是 core/ 中唯一允許提到 localStorage 的檔案。
 */
class MemoryStorage {
  constructor() { this.map = new Map(); }
  getItem(k) { return this.map.has(k) ? this.map.get(k) : null; }
  setItem(k, v) { this.map.set(k, String(v)); }
  removeItem(k) { this.map.delete(k); }
  key(i) { return [...this.map.keys()][i] ?? null; }
  get length() { return this.map.size; }
}

class Storage {
  constructor(backend = null, prefix = 'lasthaven.') {
    this.prefix = prefix;
    this.backend = backend || Storage.detect();
  }
  static detect() {
    try {
      // eslint-disable-next-line no-undef
      if (typeof localStorage !== 'undefined') { localStorage.setItem('__lh_t', '1'); localStorage.removeItem('__lh_t'); return localStorage; }
    } catch { /* fallthrough */ }
    return new MemoryStorage();
  }
  get(key) {
    try {
      const raw = this.backend.getItem(this.prefix + key);
      return raw == null ? null : JSON.parse(raw);
    } catch { return null; }
  }
  getRaw(key) {
    try { return this.backend.getItem(this.prefix + key); } catch { return null; }
  }
  set(key, value) {
    try { this.backend.setItem(this.prefix + key, JSON.stringify(value)); return true; } catch { return false; }
  }
  remove(key) {
    try { this.backend.removeItem(this.prefix + key); } catch { /* ignore */ }
  }
  keys() {
    const out = [];
    try {
      for (let i = 0; i < this.backend.length; i++) {
        const k = this.backend.key(i);
        if (k && k.startsWith(this.prefix)) out.push(k.slice(this.prefix.length));
      }
    } catch { /* ignore */ }
    return out;
  }
}

  Object.assign(exports, { MemoryStorage, Storage });
});

 * 也是 SaveSystem.normalize() 深度補預設值的來源。

    crafting: { queue: [] },
    blueprints: { learned: [], discovered: [], researchPoints: 0 },
    exploration: null,
    combat: null,
    raid: { nextAt: 0, count: 0, active: null },
    disasters: { active: [], cooldownUntil: {}, nextRollAt: 0 },
    events: { active: [], pending: null, cooldownUntil: {}, log: [] },
    flags: {},

    fixItems(st.inventory.items, 'inventory');
    fixItems(st.shelter.storage.items, 'storage');
    for (const slot of SLOTS) {
      const inst = st.player.equipment[slot];
      if (inst && (!R.item(inst.itemId) || R.item(inst.itemId).equip?.slot !== slot)) { warn.push(`equipment ${slot}: dropped ${inst.itemId}`); st.player.equipment[slot] = null; }
    }
    st.player.statusEffects = st.player.statusEffects.filter((s) => s && R.status(s.id));
    for (const id of Object.keys(st.shelter.buildings)) {
      const def = R.building(id);
      if (!def) { warn.push(`building: dropped ${id}`); delete st.shelter.buildings[id]; continue; }
      const b = st.shelter.buildings[id];
      b.level = clamp(Math.floor(b.level || 1), 1, def.maxLevel);
      b.hp = clamp(b.hp ?? def.levels[b.level - 1].hp, 0, def.levels[b.level - 1].hp);
    }
    st.blueprints.learned = st.blueprints.learned.filter((id) => R.blueprint(id));
    st.blueprints.discovered = st.blueprints.discovered.filter((id) => R.blueprint(id));
    st.crafting.queue = st.crafting.queue.filter((j) => j && R.recipe(j.recipeId));
    if (st.exploration && !R.area(st.exploration.areaId)) { warn.push('exploration: unknown area, cleared'); st.exploration = null; }
    if (st.exploration) { st.exploration.lootPile = (st.exploration.lootPile || []).filter((it) => R.item(it.itemId)); fixItems(st.exploration.lootPile, 'lootPile'); }
    if (st.combat) {
      st.combat.enemies = (st.combat.enemies || []).filter((e) => e && R.monster(e.defId) && e.hp > 0);
      st.combat.loot = (st.combat.loot || []).filter((it) => R.item(it.itemId));
      if (!st.combat.enemies.length) { warn.push('combat: no enemies, cleared'); st.combat = null; }
    }
    if (st.raid.active) st.raid.active.queue = (st.raid.active.queue || []).filter((e) => e && R.monster(e.defId));
    st.disasters.active = st.disasters.active.filter((d) => d && R.disaster(d.id));
    st.events.active = st.events.active.filter((e) => e && R.event(e.id));
    if (st.events.pending && !R.event(st.events.pending.id)) st.events.pending = null;
    const maxLv = Math.max(...[...R.shelterLevels.keys()]);
    st.shelter.level = clamp(Math.floor(st.shelter.level || 1), 1, maxLv);
    st.player.level = Math.max(1, Math.floor(st.player.level || 1));
    st.player.hunger = clamp(st.player.hunger, 0, 100);
    st.player.thirst = clamp(st.player.thirst, 0, 100);
    st.player.hp = Math.max(0, st.player.hp);
    // seq 必須大於所有既有 uid 的序號
    let maxSeq = st.seq || 1;
    const scan = (list) => { for (const it of list || []) { const n = parseInt(String(it?.uid || '').split('_').pop(), 36); if (Number.isFinite(n) && n >= maxSeq) maxSeq = n + 1; } };
    scan(st.inventory.items); scan(st.shelter.storage.items); scan(Object.values(st.player.equipment)); scan(st.exploration?.lootPile); scan(st.combat?.loot); scan(st.combat?.enemies); scan(st.raid.active?.queue); scan(st.crafting.queue);
    st.seq = maxSeq;
    return warn;
  }

  list() {
    return SLOT_IDS.map((slot) => {
      const raw = this.storage.get(this.slotKey(slot));
      if (!raw) return { slot, empty: true };
      return {
        slot, empty: false, name: raw.meta?.name, day: Math.floor((raw.clock?.time || 0) / this.balance.time.dayLength) + 1,
        level: raw.player?.level, updatedAt: raw.meta?.updatedAt, playTime: raw.meta?.playTime, version: raw.version, gameOver: !!raw.gameOver,
      };
    });
  }
  delete(slot) { this.storage.remove(this.slotKey(slot)); this.storage.remove(this.backupKey(slot)); return { ok: true }; }
  hasAny() { return this.list().some((s) => !s.empty); }
  /** 最近更新的槽位（「繼續遊戲」用） */
  latestSlot() {
    const list = this.list().filter((s) => !s.empty);
    if (!list.length) return null;
    return list.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0))[0].slot;
  }

  exportJson() { return this.state ? JSON.stringify(this.serialize()) : null; }
  importJson(json, slot = 'slot1') {
    const r = this.prepare(json);
    if (!r.ok) return r;
    this.storage.set(this.slotKey(slot), r.state);
    return { ok: true, result: { slot, warnings: r.warnings } };
  }

  update(dt) {
    if (!this.state || this.state.gameOver) return;
    const every = this.prefs.autosaveSec;
    if (!(every > 0)) return;
    this._autoAcc += dt;
    if (this._autoAcc >= every) {
      this._autoAcc = 0;
      this.save('autosave', { auto: true });
    }
  }
}

  Object.assign(exports, { migrate, SaveSystem, MIGRATIONS, SLOT_IDS });
});

__def("systems/audio.js", function (exports, __req) {
const { System } = __req("systems/base.js");
const { EV } = __req("core/events-catalog.js");
/** 事件 → 音效名稱。實際播放器（WebAudio）由 UI 注入 setPlayer()。 */
const SOUND_MAP = {
  [EV.COMBAT_HIT]: (p) => (p.attacker === 'player' ? (p.crit ? 'crit' : 'hit') : 'hurt'),
  [EV.COMBAT_ENEMY_KILLED]: () => 'kill',
  [EV.PLAYER_LEVELUP]: () => 'levelup',
  [EV.CHEST_OPENED]: () => 'chest',
  [EV.BLUEPRINT_FOUND]: () => 'blueprint',
  [EV.BLUEPRINT_LEARNED]: () => 'learn',
  [EV.CRAFT_DONE]: () => 'craft',
  [EV.SHELTER_UPGRADED]: () => 'upgrade',
  [EV.BUILDING_BUILT]: () => 'build',
  [EV.RAID_WARNING]: () => 'alarm',
  [EV.RAID_START]: () => 'alarm',
  [EV.DISASTER_START]: () => 'disaster',
  [EV.GAME_OVER]: () => 'gameover',
  [EV.ITEM_USED]: () => 'use',
  [EV.SURVIVAL_WARNING]: () => 'warn',
};

class AudioSystem extends System {
  constructor(ctx) { super(ctx, 'audio'); this.player = null; this.enabled = true; }
  setPlayer(player) { this.player = player; }
  init() {
    for (const [ev, fn] of Object.entries(SOUND_MAP)) {
      this.bus.on(ev, (payload) => {
        if (!this.enabled || !this.player) return;
        if (payload && payload.silent) return;
        const name = fn(payload || {});
        if (name) { try { this.player.play(name); } catch { /* ignore */ } }
      });
    }
  }
}

  Object.assign(exports, { AudioSystem, SOUND_MAP });
});

const { weightedPick, clamp } = __req("core/utils.js");
/**
 * EnemySystem：依等級與成長曲線產生怪物實例（生成時快照全部數值）。
 *   stat(L) = base × mult^(L−1) + add × (L−1)   （balance.monsterGrowth，可被 monster.growth 覆寫）
 * 不擁有狀態；實例存放於 combat.enemies / raid.queue / poi.data.enemies。

  statAt(base, level, g, minLevel = 1) {

  }

    const o = def.growth || {};

  }

    const L = Math.max(1, Math.round(Math.max(level, m)));
    const g = this.growthFor(def);
    const tier = tierOverride || def.tier;
    const T = this.balance.monsterTier[tier] || this.balance.monsterTier.normal;
    return {
      level: L, tier,
      hp: Math.max(1, Math.round(this.statAt(def.base.hp, L, g.hp, m) * T.hp * this.modifiers.resolve('enemyHp', 1))),
      attack: Math.max(1, Math.round(this.statAt(def.base.attack, L, g.attack, m) * T.attack * this.modifiers.resolve('enemyAttack', 1))),
      defense: Math.max(0, Math.round(this.statAt(def.base.defense, L, g.defense, m) * T.defense)),
      xp: Math.max(1, Math.round(this.statAt(def.base.xp, L, g.xp, m) * T.xp)),
      attackSpeed: def.base.attackSpeed, moveSpeed: def.base.moveSpeed,
      accuracy: def.base.accuracy ?? 0.9, dodge: def.base.dodge ?? 0.03,
    };
  }

  spawn(monsterId, level, { tierOverride, rng } = {}) {
    const def = this.registry.req('monsters', monsterId);
    const s = this.statsFor(monsterId, level, tierOverride);
    const r = rng || this.rng.combat;
    const elitePromoted = tierOverride === 'elite' && def.tier === 'normal';
    return {
      uid: this.uid('en'), defId: monsterId, name: elitePromoted ? `菁英${def.name}` : def.name, icon: def.icon,
      level: s.level, tier: s.tier, hp: s.hp, maxHp: s.hp, attack: s.attack, defense: s.defense,
      attackSpeed: s.attackSpeed, moveSpeed: s.moveSpeed, xp: s.xp, accuracy: s.accuracy, dodge: s.dodge,

  /** 為區域某深度產生一組怪物（1～2 隻，依 eliteChance 可能升格菁英） */
  spawnGroup(area, depth, { count, rng, forceElite = false } = {}) {

      const lo = area.levelRange[0] + (depth - 1) * this.balance.exploration.depthLevelStep;

    }
    return out;
  }

  spawnBoss(area, depth) {
    if (!area.bossId) return null;
    const level = area.levelRange[1] + (depth - 1) * this.balance.exploration.depthLevelStep;
    return this.spawn(area.bossId, level, { rng: this.rng.explore });
  }
}

});

__def("systems/combat.js", function (exports, __req) {
const { System } = __req("systems/base.js");
const { EV } = __req("core/events-catalog.js");
const { clamp } = __req("core/utils.js");
/**
 * CombatSystem：即時戰鬥狀態機。state.combat 的唯一寫入者。
 *  - 玩家攻擊：手動 intent 或 settings.autoAttack；冷卻 = 1 / attackSpeed
 *  - 怪物攻擊：各自冷卻
 *  - 命中管線 computeHit：hitCheck → baseDamage → armor(armorPen) → crit → clamp（元素/技能階段預留）
 *  - 逃跑：成功率取決於移動速度差與嘗試次數
 * 戰利品在戰鬥中累積於 combat.loot，結束時撿起（放不下的留在 exploration.lootPile）。
 */
class CombatSystem extends System {
  constructor(ctx) { super(ctx, 'combat'); }

  get combat() { return this.state.combat; }
  get cfg() { return this.balance.combat; }

  start(enemies, { origin = 'exploration', returnTo = null } = {}) {

      // 已在戰鬥中：加入隊伍（例如襲擊增援）
      this.state.combat.enemies.push(...enemies);
      return { ok: true, result: { joined: enemies.length } };
    }

      origin, enemies: [...enemies], targetUid: enemies[0].uid, playerCooldown: 0.3, fleeAttempts: 0,
      loot: [], coins: 0, xp: 0, log: [], returnTo, noAmmoWarned: false, startedAt: this.clock.time,
    };
    this.bus.emit(EV.COMBAT_START, { origin, enemies: enemies.map((e) => ({ uid: e.uid, name: e.name, level: e.level, tier: e.tier })) });

    // 元素傷害 / 狀態異常階段預留：att.element, def.resist

  }

  playerAttack({ mult = 1, source = 'attack' } = {}) {
    const c = this.combat;
    if (!c) return { ok: false, reason: 'notInCombat' };
    if (c.playerCooldown > 0) return { ok: false, reason: 'cooldown', left: c.playerCooldown };
    const t = this.target();
    if (!t) return { ok: false, reason: 'noTarget' };
    const stats = this.systems.player.getStats();

      if (this.systems.inventory.count('inventory', w.ammo) > 0) this.systems.inventory.remove('inventory', w.ammo, 1);
      else {
        dmgMult *= this.cfg.noAmmoMult;
        if (!c.noAmmoWarned) { c.noAmmoWarned = true; this.log(`沒有${this.registry.item(w.ammo)?.name || '彈藥'}！只能用槍托攻擊（傷害 ${Math.round(this.cfg.noAmmoMult * 100)}%）`, 'warn'); }
      }
    }
    c.playerCooldown = 1 / Math.max(0.05, stats.attackSpeed);
    const hit = this.computeHit(stats, t, this.rng.combat, { mult: dmgMult });
    this.bus.emit(EV.COMBAT_HIT, { attacker: 'player', targetUid: t.uid, damage: hit.damage, crit: hit.crit, miss: hit.miss, source });
    if (hit.miss) { c.log.push(`你的攻擊落空了`); return { ok: true, result: { miss: true } }; }
    this.damageEnemy(t, hit.damage, { source: 'player', ignoreDefense: true });
    c.log.push(`你${hit.crit ? '暴擊' : '攻擊'} ${t.name} 造成 ${hit.damage}`);

  }

  /** 技能預留：資料驅動 { id, cooldown, effects } → 走 EffectRegistry（damageEnemy / enemyStatus） */
  useSkill() { return { ok: false, reason: 'notImplemented' }; }

  damageTarget(amount, { source = 'skill' } = {}) {
    const t = this.target();
    if (!t) return 0;
    return this.damageEnemy(t, amount, { source, ignoreDefense: true });
  }
  applyStatusToTarget(id, duration) {

    if (!t) return null;
    return this.systems.statusEffects.apply(id, { duration, subject: t, source: 'skill' });

  damageEnemy(enemy, amount, { source = 'unknown', ignoreDefense = false } = {}) {

    let dmg = ignoreDefense ? amount : Math.max(this.cfg.minDamage, amount - enemy.defense);
    dmg = Math.min(enemy.hp, dmg);
    enemy.hp = Math.max(0, enemy.hp - dmg);
    if (enemy.hp <= 0) this.onEnemyKilled(enemy, source);
    return dmg;
  }

  enemyAttack(e) {
    const stats = this.systems.player.getStats();
    const hit = this.computeHit({ attack: e.attack, accuracy: e.accuracy, critChance: 0.03, critDamage: 1.5, armorPen: 0 }, { defense: stats.defense, dodge: stats.dodge }, this.rng.combat);

    const def = this.registry.monster(e.defId);
    if (def?.onHitStatus && this.rng.combat.chance(def.onHitStatus.chance)) {
      this.systems.statusEffects.apply(def.onHitStatus.id, { duration: def.onHitStatus.duration, source: `monster:${e.defId}` });
    }
    return hit.damage;
  }

  onEnemyKilled(enemy, source) {
    const c = this.combat;
    if (c) c.enemies = c.enemies.filter((x) => x.uid !== enemy.uid);
    this.incStat('kills');
    if (enemy.tier === 'elite') this.incStat('eliteKills');
    if (enemy.tier === 'boss') this.incStat('bossKills');
    if (c) c.xp += enemy.xp;
    if (this.state.exploration) { const a = this.state.world.areas[this.state.exploration.areaId]; if (a) a.kills = (a.kills || 0) + 1; }
    this.log(`擊敗 ${enemy.icon}${enemy.name} Lv.${enemy.level}（+${enemy.xp} XP）`, enemy.tier === 'boss' ? 'good' : 'combat');
    this.bus.emit(EV.COMBAT_ENEMY_KILLED, { enemy, origin: c?.origin || 'none', source });
  }

  flee() {
    const c = this.combat;
    if (!c) return { ok: false, reason: 'notInCombat' };
    if (c.origin === 'raid') return { ok: false, reason: 'cannotFleeRaid' };
    const stats = this.systems.player.getStats();
    const alive = c.enemies.filter((e) => e.hp > 0);
    const avgSpeed = alive.reduce((a, e) => a + e.moveSpeed, 0) / Math.max(1, alive.length);
    const chance = clamp(this.cfg.fleeBase + (stats.moveSpeed - avgSpeed) * this.cfg.fleeSpeedFactor - c.fleeAttempts * 0.1, this.cfg.fleeMin, this.cfg.fleeMax);
    c.fleeAttempts++;
    if (this.rng.combat.chance(chance)) {
      this.log('你成功逃離了戰鬥。', 'warn');
      this.bus.emit(EV.COMBAT_FLED, { success: true });
      this.end('fled');
      return { ok: true, result: { success: true, chance } };
    }
    this.log('逃跑失敗！敵人趁機攻擊。', 'bad');
    for (const e of alive.slice(0, this.cfg.fleeFailPenalty)) this.enemyAttack(e);
    this.bus.emit(EV.COMBAT_FLED, { success: false });
    return { ok: false, reason: 'fleeFailed', chance };
  }

  update(dt) {
    const c = this.combat;
    if (!c) return;
    const p = this.state.player;
    if (p.hp <= 0) { this.end('dead'); return; }
    // 敵人狀態效果（中毒等）
    for (const e of [...c.enemies]) {
      if (e.statusEffects?.length) this.systems.statusEffects.tick(e, dt);
      if (e.hp <= 0 && c.enemies.includes(e)) this.onEnemyKilled(e, 'status');
    }
    if (!c.enemies.length) { this.end('win'); return; }
    // 玩家
    c.playerCooldown -= dt;
    if (this.state.settings.autoAttack && c.playerCooldown <= 0) this.playerAttack();
    if (!this.combat) return; // 擊殺後可能已結束
    if (!this.combat.enemies.length) { this.end('win'); return; }
    // 敵人
    for (const e of [...this.combat.enemies]) {
      if (e.hp <= 0) continue;
      const stunned = e.statusEffects?.some((s) => s.id === 'stunned');
      e.cooldown -= dt;
      if (e.cooldown <= 0 && !stunned) {
        e.cooldown = 1 / Math.max(0.05, e.attackSpeed);
        this.enemyAttack(e);
        if (this.state.player.hp <= 0) { this.end('dead'); return; }
      }
    }
  }

  /** 結束戰鬥：撿起戰利品、發事件、清空 combat */
  end(result) {
    const c = this.combat;
    if (!c) return;

  }
  onStateLoaded() { this._overWarned = false; }
}

  Object.assign(exports, { ExplorationSystem });
});

}

    const def = this.registry.item(found.inst.itemId);
    if (!def || def.type !== 'blueprint') return { ok: false, reason: 'notBlueprint' };
    const bpDef = this.registry.blueprint(def.blueprintId);
    const value = this.researchValue(bpDef);

    this.addResearch(value);
    this.log(`🔬 拆解「${bpDef.name}」圖紙 → 研究點 +${value}（目前 ${this.bp.researchPoints}）`, 'loot');
    this.bus.emit(EV.BLUEPRINT_DISMANTLED, { blueprintId: def.blueprintId, research: value });

  }
  addResearch(n) { this.bp.researchPoints = Math.max(0, Math.round(this.bp.researchPoints + n)); return this.bp.researchPoints; }

  redeemCost(id) { const def = this.registry.blueprint(id); return def ? this.researchValue(def) * (this.balance.research.redeemMult || 3) : Infinity; }

  redeem(id) {
    const def = this.registry.blueprint(id);
    if (!def) return { ok: false, reason: 'notBlueprint' };

  }

  /** 此圖紙解鎖的建築/避難所升級 */
  gatesOf(id) {
    const out = [];
    for (const s of this.registry.list('shelterLevels')) if (s.requiredBlueprintId === id) out.push({ kind: 'shelter', level: s.level, label: `避難所 Lv.${s.level}` });
    for (const b of this.registry.list('buildings')) b.levels.forEach((lv, i) => { if (lv.requiredBlueprintId === id) out.push({ kind: 'building', id: b.id, level: i + 1, label: `${b.name} Lv.${i + 1}` }); });
    return out;
  }

  /** 圖紙完整資訊（UI 圖紙卡） */
  info(id) {
    const def = this.registry.blueprint(id);
    if (!def) return null;
    const wb = this.systems.building?.workbenchLevel() || 0;

      workbenchOk: wb >= def.requiredWorkbenchLevel, currentWorkbench: wb,
      recipes: def.unlockedRecipeIds.map((rid) => this.registry.recipe(rid)).filter(Boolean),
      gates: this.gatesOf(id),
    };
  }

  /** 收藏統計：依類型 */
  collection() {
    const out = [];
    for (const type of BLUEPRINT_TYPES) {
      const all = this.registry.list('blueprints').filter((b) => b.type === type).sort((a, b) => a.level - b.level || a.name.localeCompare(b.name));
      if (!all.length) continue;
      const entries = all.map((def) => ({ def, status: this.has(def.id) ? 'learned' : this.isDiscovered(def.id) ? 'discovered' : 'unknown' }));
      out.push({ type, total: all.length, learned: entries.filter((e) => e.status === 'learned').length, discovered: entries.filter((e) => e.status !== 'unknown').length, entries });
    }
    return out;
  }
}

  Object.assign(exports, { BlueprintSystem });
});

__def("systems/crafting.js", function (exports, __req) {
const { System } = __req("systems/base.js");
const { EV } = __req("core/events-catalog.js");
const { isHome } = __req("game/selectors.js");
const { weightedPick } = __req("core/utils.js");
const QUALITY_ORDER = ['common', 'fine', 'rare', 'epic', 'legendary'];
const STATION_LABEL = { workbench: '工作台', medical: '醫療站', purifier: '淨水器', kitchen: '廚房' };

 * CraftingSystem：五重檢查（圖紙 → 製作站等級 → 材料 → 其他條件 → 玩家等級）與製作佇列。
 * 擁有：state.crafting.queue。材料排入時扣除、取消退回、完成時擲品質；成品進倉庫（滿則背包）；只在家時進行。

  check(recipeId, qty = 1) {

    if (r.requiredStation) {

      if (have < r.requiredStation.level) reasons.push({ code: 'station', station: r.requiredStation.station, need: r.requiredStation.level, have });

      else if (cond.type === 'power' && this.systems.building.totalEffect('power') < cond.value) reasons.push({ code: 'condition', detail: `需要電力 ${cond.value}` });
      else if (cond.type === 'shelterLevel' && this.state.shelter.level < cond.value) reasons.push({ code: 'condition', detail: `需要避難所 Lv.${cond.value}` });
    }

    if (r.requiredLevel && this.state.player.level < r.requiredLevel) reasons.push({ code: 'level', need: r.requiredLevel, have: this.state.player.level });

    return { ok: true, result: { uid: job.uid, recipeId, qty, time: total } };
  }

  cancel(uid) {
    const i = this.queue.findIndex((j) => j.uid === uid);
    if (i < 0) return { ok: false, reason: 'notFound' };
    const job = this.queue[i];
    const r = this.registry.recipe(job.recipeId);
    this.queue.splice(i, 1);
    for (const c of r.requiredItems) this.systems.inventory.grant(c.itemId, c.qty * job.qty, { source: 'refund' });
    this.log(`取消製作 ${this.registry.item(r.resultItemId)?.name}，材料已退回。`, 'warn');
    return { ok: true };
  }

  rollQuality(recipe) {
    const item = this.registry.item(recipe.resultItemId);
    if (!item?.equip) return undefined;

    const base = this.balance.craftQuality.byWorkbenchLevel[Math.min(5, wb)] || { common: 100 };
    const bpIds = this.systems.blueprint.blueprintsForRecipe(recipe.id).filter((id) => this.systems.blueprint.has(id));
    const rarity = bpIds.map((id) => this.registry.blueprint(id).rarity).sort((a, b) => QUALITY_ORDER.indexOf(b) - QUALITY_ORDER.indexOf(a))[0] || 'common';

  }

  complete(job) {

      made.push({ itemId: r.resultItemId, qty: r.resultQty, quality });
    }
    this.incStat('crafted', job.qty);
    const item = this.registry.item(r.resultItemId);
    this.log(`✅ 製作完成：${item?.icon}${item?.name}${made[0].quality && made[0].quality !== 'common' ? `（${this.systems.item.qualityLabel(made[0].quality)}）` : ''} ×${r.resultQty * job.qty}`, 'good');
    this.bus.emit(EV.CRAFT_DONE, { recipeId: r.id, items: made });
  }

  update(dt) {
    if (!this.queue.length || !isHome(this.state) || this.state.combat) return;
    const job = this.queue[0];
    job.left -= dt * this.modifiers.resolve('craftSpeed', 1);
    if (job.left <= 0) this.complete(job);
  }

  /** UI 用：配方清單（依分類）含檢查結果 */
  list(category = 'all') {
    const TAB = { weapon: 'weapon', ammo: 'weapon', armor: 'armor', tool: 'tool', material: 'tool', food: 'tool', medicine: 'medicine', shelter: 'shelter', defense: 'defense', special: 'special' };
    return this.registry.list('recipes')
      .filter((r) => category === 'all' || TAB[r.category] === category)
      .map((r) => ({ recipe: r, item: this.registry.item(r.resultItemId), check: this.check(r.id), known: this.systems.blueprint.hasRecipe(r.id) }))
      .sort((a, b) => (b.known - a.known) || (a.recipe.requiredStation?.level || 0) - (b.recipe.requiredStation?.level || 0));
  }
}

  Object.assign(exports, { CraftingSystem, STATION_LABEL });
});

 * DisasterSystem：排程（每 N 小時擲骰）、預警 → 生效 → 結束、效果交給 EffectRegistry / modifier provider。

  Object.assign(exports, { DisasterSystem });
});

__def("systems/raid.js", function (exports, __req) {
const { System } = __req("systems/base.js");
const { EV } = __req("core/events-catalog.js");
const { isHome } = __req("game/selectors.js");
/**
 * RaidSystem：週期性怪物襲擊。警告 → 波次到達 → 前排與玩家戰鬥（CombatSystem）/ 其餘攻擊牆→設施→核心 → 炮塔輸出 → 勝利獎勵。
 * 擁有：state.raid = { nextAt, count, active }。核心 HP 歸零由 ShelterSystem 發 shelter:destroyed → Game 判定失敗。
 */
class RaidSystem extends System {
  constructor(ctx) { super(ctx, 'raid'); }

  init() {
    this.bus.on(EV.COMBAT_END, (e) => this.onCombatEnd(e));
    this.bus.on(EV.EXPLORE_HOME, () => { if (this.active) this.log('你回到避難所——怪物還在攻擊！', 'bad'); });
    this.bus.on(EV.SHELTER_DESTROYED, () => { if (this.active) this.finish('lost'); });
  }

  get cfg() { return this.balance.raid; }
  get active() { return this.state.raid.active; }

  difficulty(mult = 1) {
    const d = this.cfg.difficulty;
    return (d.base + d.perDay * this.clock.day + d.perPlayerLevel * this.state.player.level + d.perShelterLevel * this.state.shelter.level) * mult;
  }
  templateFor(diff) {
    const list = this.registry.list('raids').filter((r) => r.minDifficulty <= diff).sort((a, b) => b.minDifficulty - a.minDifficulty);
    return list[0] || this.registry.list('raids')[0];
  }
  warningSec() { return this.cfg.warningSec + (this.systems.building?.totalEffect('raidWarningSec') || 0); }
  scheduleNext() {
    const days = Math.max(this.cfg.intervalMinDays, this.cfg.intervalDays - this.state.raid.count * this.cfg.intervalDecayPerRaid);
    this.state.raid.nextAt = this.clock.time + days * this.balance.time.dayLength * this.rng.world.range(0.85, 1.15);
    this.bus.emit(EV.RAID_SCHEDULED, { at: this.state.raid.nextAt });
  }
  onNewGame() {
    this.state.raid.nextAt = this.clock.dayToTime(this.cfg.firstDay) + this.rng.world.range(0, this.balance.time.dayLength * 0.5);
  }

  /** 立即進入警告階段（排程到期或事件觸發） */
  trigger({ difficultyMult = 1 } = {}) {
    if (this.active) return { ok: false, reason: 'raidActive' };
    const diff = this.difficulty(difficultyMult);
    const tpl = this.templateFor(diff);
    // 怪物等級以玩家等級為基準（難度只決定樣板與波數），避免第一次襲擊就出現遠高於玩家的怪
    const level = Math.max(1, Math.round(this.state.player.level * this.cfg.levelPlayerFactor + this.clock.day * this.cfg.levelDayFactor + (difficultyMult - 1) * 3));
    const warn = this.warningSec();
    this.state.raid.active = { templateId: tpl.id, difficulty: Math.round(diff * 100) / 100, level, wave: 0, waves: tpl.waves.length, queue: [], phase: 'warning', warningLeft: warn, waveDelayLeft: 0, playerEngaged: false, damageDealt: { wall: 0, buildings: 0, core: 0 }, kills: 0, startedAt: this.clock.time };
    this.log(`🚨 警告：怪物群（${tpl.name}，約 Lv.${level}）將在 ${Math.round(warn)} 秒後抵達！修理、備彈、補血！`, 'bad');
    this.bus.emit(EV.RAID_WARNING, { inSec: warn, difficulty: diff, template: tpl.id, level });
    return { ok: true, result: { template: tpl.id, difficulty: diff, level, warningSec: warn } };
  }

  begin() {
    const a = this.active;
    a.phase = 'active';
    this.log('🚨 怪物群抵達避難所！', 'bad');

  spawnWave() {
    const a = this.active, tpl = this.registry.raid(a.templateId);
    const w = tpl.waves[a.wave];
    if (!w) return false;
    for (const m of w.monsters) for (let i = 0; i < m.count; i++) a.queue.push(this.systems.enemy.spawn(m.monsterId, a.level + a.wave + (m.levelOffset || 0), { rng: this.rng.world }));
    a.wave += 1;

    this.log(`第 ${a.wave} / ${a.waves} 波：${w.monsters.map((m) => `${this.registry.monster(m.monsterId)?.icon}${this.registry.monster(m.monsterId)?.name}×${m.count}`).join('、')}`, 'combat');
    this.bus.emit(EV.RAID_WAVE, { wave: a.wave, count: a.queue.length });

  }

  engage() {
    const a = this.active;
    if (!a || a.phase !== 'active' || this.state.combat || !isHome(this.state) || this.state.player.hp <= 0) return;
    if (!a.queue.length) return;

  onCombatEnd(e) {

  }

  update(dt) {
    const r = this.state.raid;
    if (!r.active) {

      a.warningLeft -= dt;
      if (a.warningLeft <= 0) this.begin();
      return;
    }
    // 波次推進
    const tpl = this.registry.raid(a.templateId);
    if (a.wave < a.waves) {
      a.waveDelayLeft -= dt;
      if (a.waveDelayLeft <= 0) this.spawnWave();
    }
    void tpl;

    this.engage();

    this.structurePhase(dt);
    this.turretPhase(dt);

    const combatEnemies = this.state.combat?.origin === 'raid' ? this.state.combat.enemies.length : 0;

  }

  structurePhase(dt) {
    const a = this.active;
    if (!a.queue.length) return;

    this._acc = 0;

    for (const sys of Object.values(this.systems)) sys.onStateLoaded();
    this.bus.emit(EV.SAVE_LOADED, { slot });
    return state;
  }
  loadSlot(slot) {
    const r = this.systems.save.load(slot);
    if (!r.ok) return r;
    this.loadState(r.state, { slot });
    return { ok: true, result: { slot, warnings: r.warnings, migrations: r.migrations, usedBackup: r.usedBackup } };
  }
  save(slot) { return this.systems.save.save(slot); }

  // ---------- 迴圈 ----------
  /** 真實時間 tick：累積後以固定步長模擬 */
  tick(dtReal) {
    if (!this.running) return 0;
    this._acc += Math.min(dtReal, 0.25) * this.speed;
    let steps = 0;
    while (this._acc >= this.stepSize - 1e-9 && steps < 50) {
      this.step(this.stepSize);
      this._acc -= this.stepSize;
      steps++;
      if (!this.running) break;
    }
    return steps;
  }
  /** 無頭模擬入口：推進一個固定步長 */
  step(dt = this.stepSize) {
    const st = this.state;
    if (!st || st.gameOver) return;
    this.modifiers.invalidate();
    this.clock.advance(dt);
    for (const name of UPDATE_ORDER) {
      const sys = this.systems[name];
      if (sys) sys.update(dt);
      if (st.gameOver) break;
    }
    this.checkGameOver();
    st.meta.playTime += dt;
    this.bus.emit(EV.TICK, { dt });
  }
  /** 模擬 N 秒（測試用） */
  advance(seconds) {
    const n = Math.round(seconds / this.stepSize);
    for (let i = 0; i < n && this.running; i++) this.step(this.stepSize);
  }

  checkGameOver() {
    const st = this.state;
    if (!st || st.gameOver || !this._deaths.length) { this._deaths.length = 0; return null; }
    let best = null;
    for (const d of this._deaths) {
      if (!best || DEATH_PRIORITY.indexOf(d.reason) < DEATH_PRIORITY.indexOf(best.reason)) best = d;
    }
    this._deaths.length = 0;
    st.gameOver = { reason: best.reason, detail: best.detail || {}, at: Math.round(st.clock.time * 10) / 10, text: DEATH_TEXT[best.reason] || '遊戲結束。' };
    st.stats.deaths = (st.stats.deaths || 0) + 1;
    this.bus.emit(EV.GAME_OVER, { ...st.gameOver });
    return st.gameOver;
  }

  // ---------- Intent ----------
  intent(name, params = {}) {
    const def = INTENTS[name];
    if (!def) return { ok: false, reason: 'unknownIntent', intent: name };
    if (!this.state) return { ok: false, reason: 'noGame', intent: name };
    if (this.state.gameOver && !def.allowAfterGameOver) return { ok: false, reason: 'gameOver', intent: name };
    if (def.allowedWhen) {
      const a = def.allowedWhen(this.state, this.ctx, params);
      if (a !== true) return { ok: false, reason: a || 'notAllowed', intent: name };
    }
    try {
      const r = def.run(this.ctx, params || {});
      const out = normalizeResult(r);
      out.intent = name;
      this.modifiers.invalidate();
      return out;
    } catch (err) {
      if (typeof console !== 'undefined') console.error(`[intent ${name}]`, err);
      return { ok: false, reason: 'error', error: String(err && err.message || err), intent: name };
    }
  }
  intents() { return Object.keys(INTENTS); }
}

function normalizeResult(r) {
  if (r && typeof r === 'object' && 'ok' in r) return r;
  if (r === false || r == null) return { ok: false, reason: 'failed' };
  return { ok: true, result: r };
}

  Object.assign(exports, { Game, DEATH_TEXT });
});

        <div class="meta">效果：${eff}${nextEff ? ` <span class="dim">${nextEff}</span>` : ''}</div>
        ${check.nextLevel ? `<div class="need">${inst ? `升級 Lv.${check.nextLevel}：` : '建造：'}${costLine(app, check.cost)}${check.levelDef?.requiredBlueprintId ? `　<span class="${g.systems.blueprint.has(check.levelDef.requiredBlueprintId) ? 'have' : 'lack'}">📜 ${esc(g.registry.blueprint(check.levelDef.requiredBlueprintId)?.name)}圖紙 ${g.systems.blueprint.has(check.levelDef.requiredBlueprintId) ? '✓' : '✗'}</span>` : ''}</div>` : ''}

        ${inst && check.nextLevel ? intentBtn(`⬆️ 升級`, 'upgradeBuilding', { buildingId: def.id }, 'b-sm b-gold', !check.ok || !home) : ''}

function effectText(app, e = {}) {

  if (e.foodPerDay) parts.push(`每天 ${R.item(e.foodItem)?.icon || '🍖'}${R.item(e.foodItem)?.name || '食物'} ×${e.foodPerDay}`);
  if (e.healPerSec) parts.push(`在家每秒回復 ${e.healPerSec} HP`);
  if (e.wallHp) parts.push(`牆 HP ${e.wallHp}`);
  if (e.defense) parts.push(`避難所防禦 +${e.defense}`);
  if (e.turretDps) parts.push(`炮塔 ${e.turretDps} DPS`);
  if (e.power) parts.push(`電力 ${e.power}`);
  if (e.craftStation) parts.push(`${({ workbench: '工作台', medical: '醫療站', purifier: '淨水器' })[e.craftStation.station]} Lv.${e.craftStation.level}`);

  return parts.join('、') || '—';
}

function quickUse(app) {
  const g = app.game, R = g.registry;
  const items = g.state.shelter.storage.items.filter((it) => { const d = R.item(it.itemId); return d && (d.type === 'food' || d.type === 'water' || d.type === 'medicine'); });

}

function onAction() { return false; }

  Object.assign(exports, { render, reasonLines, effectText, onAction });
});

  // ---------- 畫面 ----------
  showMenu() { this.screen = 'menu'; this.dirty = true; this.render(); }

        <div id="statusRow">${renderStatusRow(this)}</div>

        <div id="panel">${body}</div>

  renderHudOnly() {
    const hud = this.root.querySelector('#hud'); if (hud) hud.innerHTML = renderHud(this);
    const top = this.root.querySelector('#topbar'); if (top) top.innerHTML = renderTopbar(this);
    const sr = this.root.querySelector('#statusRow'); if (sr) sr.innerHTML = renderStatusRow(this);
    const bn = this.root.querySelector('#banner'); if (bn) bn.innerHTML = this.renderBanners();
    if (this.modal && this.game.state && !this.game.state.events.pending && this.modal.title && this.root.querySelector('[data-action="event:choose"]')) { this.modal = null; this.dirty = true; }

  }
  addBannerProvider(fn) { (this.bannerProviders = this.bannerProviders || []).push(fn); }

  // ---------- 記錄 / toast / modal ----------
  pushLog(e) {
    const t = this.game.state ? this.game.clock : null;
    this.logs.push({ text: e.text, kind: e.kind || 'info', day: t ? t.day : 0, hour: t ? t.hour : 0 });

  }

  openModal(m) { this.modal = m; this.dirty = true; this.render(); }
  closeModal() { this.modal = null; this.dirty = true; this.render(); }
  renderModal() {
    const m = this.modal;
    return `<div class="modal-mask" data-action="modal:close"><div class="modal" data-action="noop">
      <h3>${m.title || ''}</h3>${m.body || ''}
      <div class="row" style="justify-content:flex-end;margin-top:10px">${(m.buttons || [{ label: '關閉', action: 'modal:close' }]).map((b) => `<button class="${b.cls || ''}" data-action="${esc(b.action)}" ${dataAttrs(b.params)}>${esc(b.label)}</button>`).join('')}</div>
    </div></div>`;
  }

  // ---------- 操作 ----------
  paramsFrom(ds) {
    const p = {};
    for (const [k, v] of Object.entries(ds)) {
      if (k === 'action' || k === 'intent') continue;
      p[k] = v === 'true' ? true : v === 'false' ? false : v !== '' && !Number.isNaN(Number(v)) && /^-?\d+(\.\d+)?$/.test(v) ? Number(v) : v;
    }
    return p;
  }
  doIntent(name, params = {}) {
    const r = this.game.intent(name, params);
    if (!r.ok) this.toast(`✖ ${reasonText(r.reason)}${r.error ? '：' + r.error : ''}`, 'bad');
    this.dirty = true;
    return r;
  }
  handleAction(ds, el) {
    const a = ds.action;
    if (a === 'nav') { this.setPanel(ds.panel); return; }
    if (a === 'intent') { this.doIntent(ds.intent, this.paramsFrom(ds)); if (this.dirty) this.render(); return; }
    if (a === 'noop') return;
    if (a === 'modal:close') { this.closeModal(); return; }
    if (a === 'event:open') { const m = eventModal(this); if (m) this.openModal(m); return; }
    if (a === 'event:choose') { this.modal = null; this.doIntent('resolveEvent', { choiceId: ds.choiceId }); this.render(); return; }
    if (a === 'tab') { this.ui[ds.panel] = { ...(this.ui[ds.panel] || {}), tab: ds.tab }; this.dirty = true; this.render(); return; }
    if (a.startsWith('menu:')) { MainMenu.onAction(this, ds, el); return; }
    if (a.startsWith('gameover:')) { GameOver.onAction(this, ds); return; }
    for (const mod of Object.values(this.panels)) {
      if (mod.onAction && mod.onAction(this, ds, el)) { if (this.dirty) this.render(); return; }
    }
    console.warn('unhandled action', ds);
  }
  handleChange(ds, el) {
    if (ds.change === 'pref') {
      const v = el.type === 'checkbox' ? el.checked : el.type === 'number' || el.type === 'range' ? Number(el.value) : el.value;
      this.game.systems.save.setPrefs({ [ds.key]: v });
      this.toast('設定已更新', 'good');
    } else if (ds.change === 'setting') {
      const v = el.type === 'checkbox' ? el.checked : el.value;
      this.doIntent('setSetting', { key: ds.key, value: v });
    }
    for (const mod of Object.values(this.panels)) if (mod.onChange && mod.onChange(this, ds, el)) break;
  }

  // ---------- 遊戲流程 ----------
  newGame(name) {
    this.game.newGame({ name: name || '倖存者' });
    this.logs = [];
    this.pushLog({ text: '這是你的避難所。外面的世界很危險——帶好食物和水再出發。', kind: 'system' });
    this.showGame('shelter');
  }
  loadSlot(slot) {
    const r = this.game.loadSlot(slot);
    if (!r.ok) { this.toast(`✖ 讀取失敗：${reasonText(r.reason)}`, 'bad'); return false; }
    this.logs = [];
    this.pushLog({ text: `讀取存檔 ${slot}${r.result.usedBackup ? '（使用備份）' : ''}${r.result.warnings.length ? '，已修正 ' + r.result.warnings.length + ' 項' : ''}`, kind: 'system' });
    const st = this.game.state;
    this.showGame(st.exploration || st.combat ? 'map' : 'shelter');
    return true;
  }
}

  Object.assign(exports, { App });
});

class AudioPlayer {
  constructor(isEnabled = () => true) {
    this.isEnabled = isEnabled;
    this.ctx = null;
  }
  ensure() {
    if (this.ctx) return this.ctx;
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch { this.ctx = null; }
    return this.ctx;
  }
  play(name) {
    if (!this.isEnabled()) return;
    const s = SOUNDS[name];
    const ac = this.ensure();
    if (!s || !ac) return;
    if (ac.state === 'suspended') ac.resume().catch(() => {});
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = s.t; o.frequency.setValueAtTime(s.f, ac.currentTime);
    if (s.slide) o.frequency.exponentialRampToValueAtTime(s.slide, ac.currentTime + s.d);
    g.gain.setValueAtTime(s.g, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + s.d);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + s.d + 0.02);
