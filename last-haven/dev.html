<!DOCTYPE html>
<!-- BUILD-STRIP
     開發用入口：直接載入 ES 模組，改完存檔重整就看得到，不必重新建置。
     必須用 http 開（npm run platform → http://localhost:8900/last-haven/dev.html），
     因為瀏覽器在 file:// 底下不允許載入 ES 模組。

     這個檔案同時是 scripts/build-last-haven.js 的樣板：建置時會把 <link> 換成內嵌
     <style>、把 module <script> 換成打包好的程式碼，輸出成根目錄的 last-haven.html。
     （下面的「回遊樂園」連結是寫給輸出檔用的，開 dev.html 時那顆按鈕會連錯，正常。） -->
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>末日庇護所 Last Haven</title>
<style id="star-arcade-shell-style">
  html{ -webkit-text-size-adjust:100%; }
  body{ max-width:100vw; overflow-x:hidden; }
  .sa-home-btn{
    position:fixed; top:10px; right:10px; z-index:999999;
    width:38px; height:38px; border-radius:50%;
    background:rgba(11,14,26,.72); border:1px solid rgba(255,255,255,.28);
    display:flex; align-items:center; justify-content:center;
    font-size:18px; text-decoration:none; color:#fff;
    box-shadow:0 4px 14px rgba(0,0,0,.35); cursor:pointer;
  }
  .sa-home-btn:hover{ background:rgba(11,14,26,.92); }
</style>
<link rel="stylesheet" href="ui/styles.css">
</head>
<body>
<a class="sa-home-btn" href="platform.html" title="回遊樂園">🏠</a>
<div id="app"></div>
<script type="module" src="main.js"></script>
</body>
</html>
