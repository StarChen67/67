<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no, viewport-fit=cover">
<title>接水果 — Catch the Fruit</title>
<style>
:root{
  --bg:#0c0e18; --panel:#161a2c; --panel2:#1f2440; --line:#2c3358;
  --txt:#e9ecff; --dim:#8891b8; --dim2:#5f6890;
  --gold:#ffc84a; --green:#3ddc97; --red:#ff5d73; --blue:#5aa9ff;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{overscroll-behavior:none}
body{
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  background:radial-gradient(900px 600px at 50% -10%,#123326 0%,var(--bg) 55%);
  color:var(--txt);min-height:100vh;padding:14px 12px 40px;
}
.wrap{max-width:520px;margin:0 auto}

header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:22px;letter-spacing:2px;
   background:linear-gradient(90deg,var(--green),var(--gold),var(--red));
   -webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:11px;color:var(--dim);margin-top:2px}
a.back{font-size:11.5px;color:var(--dim);text-decoration:none;border:1px solid var(--line);
        padding:6px 10px;border-radius:8px;background:var(--panel)}
a.back:hover{color:var(--txt);border-color:var(--dim2)}

.stats-top{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:10px;
      padding:7px 12px;text-align:center;min-width:70px;flex:1}
.pill .k{font-size:10px;color:var(--dim);letter-spacing:1px}
.pill .v{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.pill .v.flash-green{color:var(--green)}
.pill .v.flash-gold{color:var(--gold)}
.pill .v.flash-red{color:var(--red)}

.board-wrap{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;
            position:relative;margin:0 auto;width:fit-content}
canvas#board{display:block;border-radius:8px;background:#0a0c16;touch-action:none}

.overlay{position:absolute;inset:10px;background:rgba(10,12,22,.9);border-radius:8px;
        display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;
        text-align:center;padding:20px}
.overlay.show{display:flex}
.overlay h2{font-size:20px;letter-spacing:2px}
.overlay p{font-size:12.5px;color:var(--dim);line-height:1.8;max-width:340px}

button{font-family:inherit;font-weight:700;cursor:pointer;border:none;border-radius:10px;
       padding:11px 16px;font-size:13.5px;color:#fff;transition:transform .1s,filter .1s}
button:hover:not(:disabled){filter:brightness(1.12);transform:translateY(-1px)}
button:active:not(:disabled){transform:translateY(0)}
.b-gold{background:linear-gradient(135deg,var(--gold),#ff9d2e);color:#3a2a05}
.b-green{background:linear-gradient(135deg,var(--green),#22a173);color:#062a1c}
.b-ghost{background:var(--panel2);border:1px solid var(--line);color:var(--txt)}
.b-sm{padding:8px 12px;font-size:12px;border-radius:8px}

.diffrow{display:flex;gap:6px;justify-content:center;margin:12px 0}
.diffrow button{flex:1;max-width:110px;padding:8px 4px;font-size:11.5px}
.diffrow button.active{outline:2px solid var(--green)}

.controls-row{display:flex;gap:8px;justify-content:center;margin-top:4px;flex-wrap:wrap}
.hint{font-size:11.5px;color:var(--dim);line-height:1.9;text-align:center;margin-top:10px}
.hint b{color:var(--gold)}
</style>
<!-- star-arcade-shell -->
<style id="star-arcade-shell-style">
  html{ -webkit-text-size-adjust:100%; font-size:106%; }
  body{ max-width:100vw; overflow-x:hidden; }
  canvas{ max-width:100%; height:auto; }
  .sa-home-btn{
    position:fixed; top:12px; right:12px; z-index:999999;
    width:42px; height:42px; border-radius:50%;
    background:rgba(11,14,26,.72); border:1px solid rgba(255,255,255,.28);
    display:flex; align-items:center; justify-content:center;
    font-size:20px; text-decoration:none; color:#fff;
    box-shadow:0 4px 14px rgba(0,0,0,.35);
    -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px);
    -webkit-tap-highlight-color:transparent;
    cursor:pointer;
  }
  .sa-home-btn:hover{ background:rgba(11,14,26,.92); }
  @media (max-width:480px){
    .sa-home-btn{ width:38px; height:38px; font-size:16px; top:8px; right:8px; }
  }
</style>
</head>
<body>
<a class="sa-home-btn" href="platform.html" title="回到首頁" aria-label="回到首頁">🏠</a>

<div class="wrap">

<header>
  <div>
    <h1>接水果</h1>
    <div class="sub">CATCH THE FRUIT · 反應遊戲</div>
  </div>
  <a class="back" href="platform.html">← 回遊樂園</a>
</header>

<div class="stats-top">
  <div class="pill"><div class="k">分數</div><div class="v" id="score">0</div></div>
  <div class="pill"><div class="k">連擊</div><div class="v" id="combo">x1</div></div>
  <div class="pill"><div class="k">生命</div><div class="v" id="lives">3</div></div>
  <div class="pill"><div class="k">最高分</div><div class="v" id="best">0</div></div>
</div>

<div class="diffrow">
  <button class="b-ghost" id="diffEasy">簡單</button>
  <button class="b-ghost active" id="diffNormal">普通</button>
  <button class="b-ghost" id="diffHard">困難</button>
</div>

<div class="board-wrap">
  <canvas id="board"></canvas>
  <div class="overlay show" id="overlay">
    <h2 id="ovTitle">接水果</h2>
    <p id="ovText">移動籃子接住掉落的水果得分！<br>
      🌟 <b style="color:var(--gold)">金色水果</b> 分數更高，別錯過！<br>
      💣 <b style="color:var(--red)">炸彈</b> 接到會扣一條命！<br>
      🤢 <b style="color:var(--dim)">腐爛水果</b> 接到會扣分！<br>
      連續接住水果可累積連擊加成，生命歸零遊戲結束！</p>
    <button class="b-gold" id="ovBtn">開始遊戲</button>
  </div>
</div>

<div class="controls-row">
  <button class="b-ghost b-sm" id="pauseBtn">暫停</button>
  <button class="b-green b-sm" id="restartBtn">重新開始</button>
</div>

<div class="hint">
  滑鼠移動 / 觸控拖曳籃子　<b>←→</b>方向鍵移動　<b>P</b>暫停
</div>

</div>

<script>
const CW = 440, CH = 560;
const boardCv = document.getElementById('board');
boardCv.width = CW; boardCv.height = CH;
const ctx = boardCv.getContext('2d');

const BASKET_Y = CH - 46;
const BASKET_H = 34;
const GOOD_FRUITS = ['🍎','🍊','🍌','🍇','🍓','🍒','🍑','🥝','🍍'];
const GOLD_FRUIT = '🌟';
const BOMB = '💣';
const ROTTEN = '🤢';

const DIFF = {
  easy:   { basketW:110, spawnMin:700, spawnMax:1100, speedStart:2.2, speedMax:4.2, bombChance:0.06, rottenChance:0.06, goldChance:0.10 },
  normal: { basketW:90,  spawnMin:550, spawnMax:850,  speedStart:2.8, speedMax:5.4, bombChance:0.10, rottenChance:0.08, goldChance:0.12 },
  hard:   { basketW:72,  spawnMin:380, spawnMax:620,  speedStart:3.4, speedMax:6.8, bombChance:0.14, rottenChance:0.10, goldChance:0.14 },
};

let difficulty = 'normal';
let basketX, basketW;
let items = [];
let score = 0, best = 0, lives = 3, combo = 1, caught = 0, missed = 0;
let running = false, paused = false, gameOver = false;
let spawnTimer = null;
let startTime = 0, elapsedPaused = 0, pauseStart = 0;
let rafId = null;

try { best = Number(localStorage.getItem('catchFruitBest') || 0); } catch(e) { best = 0; }
document.getElementById('best').textContent = best;

function rand(min, max){ return Math.random() * (max - min) + min; }

function updateStats(){
  document.getElementById('score').textContent = score;
  document.getElementById('combo').textContent = 'x' + combo;
  document.getElementById('lives').textContent = lives;
  document.getElementById('best').textContent = best;
}

function flashStat(id, color){
  const el = document.getElementById(id);
  el.classList.remove('flash-green','flash-gold','flash-red');
  void el.offsetWidth;
  el.classList.add('flash-' + color);
  setTimeout(() => el.classList.remove('flash-' + color), 260);
}

function progress(){
  const elapsed = (performance.now() - startTime - elapsedPaused) / 1000;
  return Math.min(1, elapsed / 45);
}

function currentSpeed(){
  const cfg = DIFF[difficulty];
  return cfg.speedStart + (cfg.speedMax - cfg.speedStart) * progress();
}

function spawnItem(){
  if (!running || paused || gameOver) return;
  const cfg = DIFF[difficulty];
  const r = Math.random();
  let type, emoji;
  if (r < cfg.bombChance){ type = 'bomb'; emoji = BOMB; }
  else if (r < cfg.bombChance + cfg.rottenChance){ type = 'rotten'; emoji = ROTTEN; }
  else if (r < cfg.bombChance + cfg.rottenChance + cfg.goldChance){ type = 'gold'; emoji = GOLD_FRUIT; }
  else { type = 'normal'; emoji = GOOD_FRUITS[Math.floor(Math.random()*GOOD_FRUITS.length)]; }

  items.push({
    x: rand(24, CW-24), y: -24, r: 18,
    vy: currentSpeed() * rand(0.85, 1.15),
    type, emoji, rot: rand(-0.3,0.3), rotSpeed: rand(-0.03,0.03)
  });

  scheduleSpawn();
}

function scheduleSpawn(){
  if (!running) return;
  const cfg = DIFF[difficulty];
  const delay = rand(cfg.spawnMin, cfg.spawnMax) * (1 - progress()*0.35);
  spawnTimer = setTimeout(spawnItem, Math.max(180, delay));
}

function loseLife(){
  lives--;
  flashStat('lives', 'red');
  combo = 1;
  updateStats();
  if (lives <= 0) triggerGameOver();
}

function onCatch(item){
  if (item.type === 'bomb'){
    loseLife();
  } else if (item.type === 'rotten'){
    score = Math.max(0, score - 5);
    combo = 1;
    flashStat('score', 'red');
  } else if (item.type === 'gold'){
    score += 30 * combo;
    caught++;
    combo = Math.min(5, combo + 1);
    flashStat('score', 'gold');
  } else {
    score += 10 * combo;
    caught++;
    combo = Math.min(5, combo + 1);
    flashStat('score', 'green');
  }
  if (score > best){
    best = score;
    try { localStorage.setItem('catchFruitBest', String(best)); } catch(e){}
  }
  updateStats();
}

function onMiss(item){
  if (item.type === 'normal' || item.type === 'gold'){
    missed++;
    combo = 1;
    updateStats();
  }
}

function step(){
  if (!running || paused || gameOver) return;

  for (let i = items.length - 1; i >= 0; i--){
    const it = items[i];
    it.y += it.vy;
    it.rot += it.rotSpeed;

    const inBasketX = it.x > basketX - basketW/2 - 6 && it.x < basketX + basketW/2 + 6;
    if (inBasketX && it.y >= BASKET_Y - BASKET_H/2 && it.y <= BASKET_Y + 6){
      onCatch(it);
      items.splice(i, 1);
      continue;
    }

    if (it.y - it.r > CH){
      onMiss(it);
      items.splice(i, 1);
    }
  }

  draw();
  rafId = requestAnimationFrame(step);
}

function drawBasket(){
  const w = basketW, h = BASKET_H, x = basketX - w/2, y = BASKET_Y - h/2;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(x + w*0.08, y);
  ctx.lineTo(x + w*0.92, y);
  ctx.lineTo(x + w, y + h);
  ctx.lineTo(x, y + h);
  ctx.closePath();
  const grad = ctx.createLinearGradient(x, y, x, y+h);
  grad.addColorStop(0, '#c9822f');
  grad.addColorStop(1, '#8a5620');
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.25)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.strokeStyle = 'rgba(0,0,0,.35)';
  ctx.lineWidth = 1;
  for (let i=1;i<4;i++){
    const lx = x + (w/4)*i;
    ctx.beginPath();
    ctx.moveTo(lx, y+2);
    ctx.lineTo(x + (w*0.5) + (lx-(x+w/2))*0.85, y+h-2);
    ctx.stroke();
  }

  ctx.beginPath();
  ctx.ellipse(basketX, y+1, w*0.42, 5, 0, 0, Math.PI*2);
  ctx.fillStyle = '#e0a24a';
  ctx.fill();
  ctx.restore();
}

function draw(){
  ctx.fillStyle = '#0a0c16';
  ctx.fillRect(0,0,CW,CH);

  for (const it of items){
    ctx.save();
    ctx.translate(it.x, it.y);
    ctx.rotate(it.rot);
    ctx.font = '32px system-ui, "Noto Color Emoji", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(it.emoji, 0, 0);
    ctx.restore();
  }

  drawBasket();
}

function stopAllTimers(){
  clearTimeout(spawnTimer); spawnTimer = null;
  if (rafId) cancelAnimationFrame(rafId); rafId = null;
}

function initState(){
  const cfg = DIFF[difficulty];
  basketW = cfg.basketW;
  basketX = CW/2;
  items = [];
  score = 0; lives = 3; combo = 1; caught = 0; missed = 0;
  gameOver = false;
  updateStats();
}

function startGame(){
  stopAllTimers();
  initState();
  running = true; paused = false;
  startTime = performance.now();
  elapsedPaused = 0;
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('pauseBtn').textContent = '暫停';
  scheduleSpawn();
  draw();
  rafId = requestAnimationFrame(step);
}

function triggerGameOver(){
  gameOver = true;
  running = false;
  stopAllTimers();
  const isNewBest = score >= best && score > 0;
  document.getElementById('ovTitle').textContent = '遊戲結束';
  document.getElementById('ovText').innerHTML =
    `本局分數 <b style="color:var(--gold)">${score}</b>` +
    (isNewBest ? ' <b style="color:var(--green)">🎉 新紀錄！</b>' : '') +
    `<br>接住 ${caught} 顆水果・錯過 ${missed} 顆<br>再試一次，挑戰更高分！`;
  document.getElementById('ovBtn').textContent = '再玩一次';
  document.getElementById('overlay').classList.add('show');
}

function showOverlay(title, text, btnText){
  document.getElementById('ovTitle').textContent = title;
  document.getElementById('ovText').innerHTML = text;
  document.getElementById('ovBtn').textContent = btnText;
  document.getElementById('overlay').classList.add('show');
}

document.getElementById('ovBtn').addEventListener('click', () => {
  if (!running && !paused){ startGame(); return; }
  if (paused){
    paused = false;
    elapsedPaused += performance.now() - pauseStart;
    document.getElementById('overlay').classList.remove('show');
    document.getElementById('pauseBtn').textContent = '暫停';
    scheduleSpawn();
    rafId = requestAnimationFrame(step);
  }
});
document.getElementById('restartBtn').addEventListener('click', startGame);

document.getElementById('pauseBtn').addEventListener('click', () => {
  if (!running || gameOver) return;
  if (!paused){
    paused = true;
    pauseStart = performance.now();
    clearTimeout(spawnTimer); spawnTimer = null;
    document.getElementById('pauseBtn').textContent = '繼續';
    showOverlay('已暫停', '按下繼續按鈕恢復遊戲', '繼續');
  } else {
    paused = false;
    elapsedPaused += performance.now() - pauseStart;
    document.getElementById('overlay').classList.remove('show');
    document.getElementById('pauseBtn').textContent = '暫停';
    scheduleSpawn();
    rafId = requestAnimationFrame(step);
  }
});

function setDifficulty(d, btnId){
  difficulty = d;
  document.querySelectorAll('.diffrow button').forEach(b => b.classList.remove('active'));
  document.getElementById(btnId).classList.add('active');
  if (!running){
    basketW = DIFF[d].basketW;
  }
}
document.getElementById('diffEasy').addEventListener('click', () => setDifficulty('easy','diffEasy'));
document.getElementById('diffNormal').addEventListener('click', () => setDifficulty('normal','diffNormal'));
document.getElementById('diffHard').addEventListener('click', () => setDifficulty('hard','diffHard'));

function getRelX(clientX){
  const rect = boardCv.getBoundingClientRect();
  return (clientX - rect.left) * (CW / rect.width);
}
function moveBasketTo(px){
  basketX = Math.max(basketW/2, Math.min(CW - basketW/2, px));
}

boardCv.addEventListener('mousemove', (e) => {
  if (!running || paused || gameOver) return;
  moveBasketTo(getRelX(e.clientX));
});
boardCv.addEventListener('touchstart', (e) => {
  if (!running || paused || gameOver) return;
  e.preventDefault();
  moveBasketTo(getRelX(e.touches[0].clientX));
}, {passive:false});
boardCv.addEventListener('touchmove', (e) => {
  if (!running || paused || gameOver) return;
  e.preventDefault();
  moveBasketTo(getRelX(e.touches[0].clientX));
}, {passive:false});

window.addEventListener('keydown', (e) => {
  if (['ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.code === 'KeyP'){ document.getElementById('pauseBtn').click(); return; }
  if (!running || paused || gameOver) return;
  if (e.code === 'ArrowLeft') moveBasketTo(basketX - 28);
  if (e.code === 'ArrowRight') moveBasketTo(basketX + 28);
});

initState();
draw();
</script>
</body>
</html>
