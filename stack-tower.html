<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no, viewport-fit=cover">
<title>疊疊樂 — Stack Tower</title>
<style>
:root{
  --bg:#0c0e18; --panel:#161a2c; --panel2:#1f2440; --line:#2c3358;
  --txt:#e9ecff; --dim:#8891b8; --dim2:#5f6890;
  --gold:#ffc84a; --green:#3ddc97; --red:#ff5d73; --blue:#5aa9ff;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
body{
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  background:radial-gradient(900px 600px at 50% -10%,#1c2340 0%,var(--bg) 55%);
  color:var(--txt);min-height:100vh;padding:14px 12px 40px;
}
.wrap{max-width:640px;margin:0 auto}

header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:22px;letter-spacing:2px;
   background:linear-gradient(90deg,var(--gold),var(--green),var(--blue));
   -webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:11px;color:var(--dim);margin-top:2px}
a.back{font-size:11.5px;color:var(--dim);text-decoration:none;border:1px solid var(--line);
        padding:6px 10px;border-radius:8px;background:var(--panel)}
a.back:hover{color:var(--txt);border-color:var(--dim2)}

.stats-top{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:10px;
      padding:7px 12px;text-align:center;min-width:70px;flex:1}
.pill .k{font-size:10px;color:var(--dim);letter-spacing:1px}
.pill .v{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}

.main{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;justify-content:center}
.board-wrap{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;
            position:relative;flex:none}
canvas#board{display:block;border-radius:8px;background:#0a0c16;touch-action:none}

.side{display:flex;flex-direction:column;gap:10px;min-width:150px}
.card-panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.card-panel h2{font-size:11px;letter-spacing:2px;color:var(--dim);font-weight:600;margin-bottom:8px;text-align:center}

.overlay{position:absolute;inset:0;background:rgba(10,12,22,.88);border-radius:8px;
        display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;
        text-align:center;padding:20px}
.overlay.show{display:flex}
.overlay h2{font-size:20px;letter-spacing:2px}
.overlay p{font-size:12.5px;color:var(--dim);line-height:1.7}

button{font-family:inherit;font-weight:700;cursor:pointer;border:none;border-radius:10px;
       padding:11px 16px;font-size:13.5px;color:#fff;transition:transform .1s,filter .1s}
button:hover:not(:disabled){filter:brightness(1.12);transform:translateY(-1px)}
button:active:not(:disabled){transform:translateY(0)}
.b-gold{background:linear-gradient(135deg,var(--gold),#ff9d2e);color:#3a2a05}
.b-green{background:linear-gradient(135deg,var(--green),#22a173);color:#062a1c}
.b-ghost{background:var(--panel2);border:1px solid var(--line);color:var(--txt)}
.b-sm{padding:8px 12px;font-size:12px;border-radius:8px}

.hint{font-size:11.5px;color:var(--dim);line-height:1.9}
.hint b{color:var(--gold)}
.hint .k{display:inline-block;background:var(--panel2);border:1px solid var(--line);
        border-radius:5px;padding:1px 6px;font-size:10.5px;color:var(--txt);margin:0 2px}

@media(max-width:640px){
  .side{width:100%}
}
</style>
<!-- star-arcade-shell -->
<style id="star-arcade-shell-style">
  html{ -webkit-text-size-adjust:100%; font-size:106%; }
  body{ max-width:100vw; overflow-x:hidden; }
  canvas{ max-width:100%; height:auto; }
  .sa-home-btn{
    position:fixed; top:12px; right:12px; z-index:999999;
    width:42px; height:42px; border-radius:50%;
    background:rgba(11,14,26,.72); border:1px solid rgba(255,255,255,.28);
    display:flex; align-items:center; justify-content:center;
    font-size:20px; text-decoration:none; color:#fff;
    box-shadow:0 4px 14px rgba(0,0,0,.35);
    -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px);
    -webkit-tap-highlight-color:transparent;
    cursor:pointer;
  }
  .sa-home-btn:hover{ background:rgba(11,14,26,.92); }
  @media (max-width:480px){
    .sa-home-btn{ width:38px; height:38px; font-size:16px; top:8px; right:8px; }
  }
</style>
</head>
<body>
<a class="sa-home-btn" href="platform.html" title="回到首頁" aria-label="回到首頁">🏠</a>

<div class="wrap">

<header>
  <div>
    <h1>疊疊樂</h1>
    <div class="sub">STACK TOWER · 疊塔挑戰</div>
  </div>
  <a class="back" href="platform.html">← 回遊樂園</a>
</header>

<div class="stats-top">
  <div class="pill"><div class="k">分數</div><div class="v" id="score">0</div></div>
  <div class="pill"><div class="k">最高分</div><div class="v" id="best">0</div></div>
</div>

<div class="main">
  <div class="board-wrap">
    <canvas id="board"></canvas>
    <div class="overlay show" id="overlay">
      <h2 id="ovTitle">疊疊樂</h2>
      <p id="ovText">點擊畫面或按空白鍵放下方塊，疊得越準塔越高、越窄的風險越低。<br>完全沒對齊就會直接遊戲結束！</p>
      <button class="b-gold" id="ovBtn">開始遊戲</button>
    </div>
  </div>

  <div class="side">
    <div class="card-panel">
      <h2>操作說明</h2>
      <div class="hint">
        <span class="k">點擊 / 觸控</span>放下方塊<br>
        <span class="k">空白鍵</span>亦可<br>
        對齊完美會有加分與閃光效果<br>
        塔越疊越窄，小心失手！
      </div>
    </div>
    <button class="b-ghost b-sm" id="pauseBtn">暫停</button>
    <button class="b-green b-sm" id="restartBtn">重新開始</button>
  </div>
</div>

</div>

<script>
const CW = 380, CH = 560;
const boardCv = document.getElementById('board');
boardCv.width = CW; boardCv.height = CH;
const ctx = boardCv.getContext('2d');

const BLOCK_H = 28;
const BASE_WIDTH = 170;
const PLAY_LEFT = 12, PLAY_RIGHT = CW - 12;
const ACTIVE_TOP = 150;          // screen y where the moving block settles once camera scrolls
const MIN_WIDTH = 14;            // below this, tower is unplayable -> game over
const PERFECT_PIXELS = 4;        // trim amount at/under this counts as a perfect placement
const BASE_SPEED = 2.0, SPEED_STEP = 0.055, MAX_SPEED = 7.2;
const GRAVITY = 0.45;

const COLOR_PAIRS = [
  ['#ffc84a','#ff9d2e'],
  ['#3ddc97','#22a173'],
  ['#5aa9ff','#2f7ad1'],
  ['#d14bff','#8b5cff'],
  ['#ff5d73','#c93a52'],
  ['#ff9d2e','#e2740f'],
];
const BASE_COLOR = ['#5f6890','#3f4568'];

let stack;            // placed blocks: {x, w, topY, colors:[c1,c2]}
let moving;           // {x, w, topY, dir, speed, colors}
let fallingPieces;    // debris
let floatTexts;       // floating score/perfect texts
let cameraOffset;
let score, best;
let running, paused, gameOverFlag;
let perfectFlashTimer, perfectFlashBlock;

function loadBest(){
  try { return Number(localStorage.getItem('stackTowerBest') || 0); }
  catch (e) { return 0; }
}
function saveBest(val){
  try { localStorage.setItem('stackTowerBest', String(val)); }
  catch (e) { /* storage unavailable, ignore */ }
}

best = loadBest();
document.getElementById('best').textContent = best;

function nextColors(rowIndex){
  if (rowIndex <= 0) return BASE_COLOR;
  return COLOR_PAIRS[(rowIndex - 1) % COLOR_PAIRS.length];
}

function makeMovingBlock(){
  const below = stack[stack.length - 1];
  const w = below.w;
  const topY = below.topY - BLOCK_H;
  const speed = Math.min(MAX_SPEED, BASE_SPEED + (stack.length - 1) * SPEED_STEP);
  return { x: PLAY_LEFT, w, topY, dir: 1, speed, colors: nextColors(stack.length) };
}

function initState(){
  const baseY = CH - 50; // bottom edge (world) of the base block
  stack = [{
    x: (CW - BASE_WIDTH) / 2, w: BASE_WIDTH, topY: baseY - BLOCK_H, colors: BASE_COLOR
  }];
  moving = makeMovingBlock();
  fallingPieces = [];
  floatTexts = [];
  cameraOffset = 0;
  score = 0;
  running = false; paused = false; gameOverFlag = false;
  perfectFlashTimer = 0; perfectFlashBlock = null;
  updateStats();
  document.getElementById('pauseBtn').textContent = '暫停';
}

function updateStats(){
  document.getElementById('score').textContent = score;
  document.getElementById('best').textContent = best;
}

function computeCameraOffset(){
  if (!moving) return cameraOffset;
  return Math.max(0, ACTIVE_TOP - moving.topY);
}

function spawnFallingPiece(x, topY, w, colors){
  if (w <= 0.5) return;
  fallingPieces.push({ x, y: topY, w, h: BLOCK_H, vy: 0.5, alpha: 1, colors });
}

function spawnFloatText(text, x, y, color){
  floatTexts.push({ text, x, y, alpha: 1, vy: -0.8, color });
}

function triggerGameOver(){
  running = false;
  gameOverFlag = true;
  if (score > best){
    best = score;
    saveBest(best);
  }
  const heightCount = stack.length - 1; // blocks stacked on top of base
  document.getElementById('ovTitle').textContent = '遊戲結束';
  document.getElementById('ovText').innerHTML =
    `本局分數 <b style="color:var(--gold)">${score}</b>，疊了 ${heightCount} 層。<br>最高分：${best}。再試一次！`;
  document.getElementById('ovBtn').textContent = '重新開始';
  document.getElementById('overlay').classList.add('show');
  updateStats();
}

function drop(){
  if (!running || paused || gameOverFlag) return;

  const below = stack[stack.length - 1];
  const movX = moving.x, movW = moving.w;
  const belowX = below.x, belowW = below.w;

  const overlapLeft = Math.max(movX, belowX);
  const overlapRight = Math.min(movX + movW, belowX + belowW);
  const overlapWidth = overlapRight - overlapLeft;

  if (overlapWidth <= 0){
    // completely missed: the whole block falls away
    spawnFallingPiece(movX, moving.topY, movW, moving.colors);
    triggerGameOver();
    return;
  }

  const trimAmount = movW - overlapWidth;
  const isPerfect = trimAmount <= PERFECT_PIXELS;

  let newX, newW;
  if (isPerfect){
    newX = belowX;
    newW = belowW;
  } else {
    newX = overlapLeft;
    newW = overlapWidth;
    // spawn the two leftover slivers as falling debris
    const leftCut = overlapLeft - movX;
    if (leftCut > 0) spawnFallingPiece(movX, moving.topY, leftCut, moving.colors);
    const rightCut = (movX + movW) - overlapRight;
    if (rightCut > 0) spawnFallingPiece(overlapRight, moving.topY, rightCut, moving.colors);
  }

  newW = Math.max(0, newW);

  const placedBlock = { x: newX, w: newW, topY: moving.topY, colors: moving.colors };
  stack.push(placedBlock);

  score += 1;
  if (isPerfect){
    score += 2;
    perfectFlashTimer = 28;
    perfectFlashBlock = placedBlock;
    spawnFloatText('完美！+2', newX + newW / 2, moving.topY, '#ffc84a');
  } else {
    spawnFloatText('+1', newX + newW / 2, moving.topY, '#e9ecff');
  }
  updateStats();

  if (newW < MIN_WIDTH){
    triggerGameOver();
    return;
  }

  moving = makeMovingBlock();
}

function stepMoving(){
  if (!moving) return;
  moving.x += moving.dir * moving.speed;
  if (moving.x <= PLAY_LEFT){
    moving.x = PLAY_LEFT; moving.dir = 1;
  } else if (moving.x + moving.w >= PLAY_RIGHT){
    moving.x = PLAY_RIGHT - moving.w; moving.dir = -1;
  }
}

function stepFalling(){
  for (let i = fallingPieces.length - 1; i >= 0; i--){
    const p = fallingPieces[i];
    p.vy += GRAVITY;
    p.y += p.vy;
    p.alpha -= 0.02;
    if (p.alpha <= 0 || (p.y + cameraOffset) > CH + 60){
      fallingPieces.splice(i, 1);
    }
  }
}

function stepFloatTexts(){
  for (let i = floatTexts.length - 1; i >= 0; i--){
    const t = floatTexts[i];
    t.y += t.vy;
    t.alpha -= 0.018;
    if (t.alpha <= 0) floatTexts.splice(i, 1);
  }
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawBlock(x, screenY, w, h, colors, glow){
  if (w <= 0) return;
  const grad = ctx.createLinearGradient(x, screenY, x + w, screenY);
  grad.addColorStop(0, colors[0]);
  grad.addColorStop(1, colors[1]);
  ctx.fillStyle = grad;
  roundRect(x, screenY, w, h, 4);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.28)';
  roundRect(x, screenY, w, Math.min(5, h), 3);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.15)';
  ctx.lineWidth = 1;
  roundRect(x, screenY, w, h, 4);
  ctx.stroke();
  if (glow){
    ctx.save();
    ctx.shadowColor = '#ffc84a';
    ctx.shadowBlur = 18;
    ctx.strokeStyle = 'rgba(255,200,74,.9)';
    ctx.lineWidth = 2;
    roundRect(x-1, screenY-1, w+2, h+2, 5);
    ctx.stroke();
    ctx.restore();
  }
}

function draw(){
  ctx.clearRect(0, 0, CW, CH);
  ctx.fillStyle = '#0a0c16';
  ctx.fillRect(0, 0, CW, CH);

  // faint scrolling guide lines for depth
  ctx.strokeStyle = 'rgba(255,255,255,.03)';
  ctx.lineWidth = 1;
  const lineSpacing = BLOCK_H;
  const startOffset = ((cameraOffset % lineSpacing) + lineSpacing) % lineSpacing;
  for (let y = startOffset; y < CH; y += lineSpacing){
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(CW, y); ctx.stroke();
  }

  // stacked blocks
  for (let i = 0; i < stack.length; i++){
    const b = stack[i];
    const screenY = b.topY + cameraOffset;
    if (screenY > CH || screenY + BLOCK_H < -BLOCK_H) continue;
    const glow = perfectFlashTimer > 0 && b === perfectFlashBlock;
    drawBlock(b.x, screenY, b.w, BLOCK_H, b.colors, glow);
  }

  // moving block
  if (moving && !gameOverFlag){
    const screenY = moving.topY + cameraOffset;
    drawBlock(moving.x, screenY, moving.w, BLOCK_H, moving.colors, false);
  }

  // falling debris
  for (const p of fallingPieces){
    const screenY = p.y + cameraOffset;
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.alpha);
    drawBlock(p.x, screenY, p.w, p.h, p.colors, false);
    ctx.restore();
  }

  // floating texts
  ctx.textAlign = 'center';
  ctx.font = '700 14px "Noto Sans TC",sans-serif';
  for (const t of floatTexts){
    const screenY = t.y + cameraOffset;
    ctx.save();
    ctx.globalAlpha = Math.max(0, t.alpha);
    ctx.fillStyle = t.color;
    ctx.fillText(t.text, t.x, screenY);
    ctx.restore();
  }

  if (perfectFlashTimer > 0) perfectFlashTimer--;
}

function loop(){
  if (running && !paused && !gameOverFlag){
    stepMoving();
    stepFalling();
    stepFloatTexts();
    cameraOffset = computeCameraOffset();
  } else if (!gameOverFlag) {
    stepFalling();
    stepFloatTexts();
  }
  draw();
  requestAnimationFrame(loop);
}

function startGame(){
  document.getElementById('overlay').classList.remove('show');
  initState();
  running = true;
  cameraOffset = computeCameraOffset();
}

function togglePause(){
  if (!running || gameOverFlag) return;
  paused = !paused;
  document.getElementById('pauseBtn').textContent = paused ? '繼續' : '暫停';
}

document.getElementById('ovBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', startGame);
document.getElementById('pauseBtn').addEventListener('click', togglePause);

boardCv.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if (!running && !gameOverFlag) return; // overlay showing, use button
  drop();
});

document.addEventListener('keydown', (e) => {
  if (e.key === ' '){
    e.preventDefault();
    if (!running && !gameOverFlag){
      startGame();
    } else {
      drop();
    }
  } else if (e.key === 'p' || e.key === 'P'){
    togglePause();
  }
});

initState();
draw();
requestAnimationFrame(loop);
</script>
</body>
</html>
