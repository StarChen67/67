<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no, viewport-fit=cover">
<title>泡泡龍 — Bubble Pop</title>
<style>
:root{
  --bg:#0b0d18; --panel:#161a2e; --panel2:#1f2440; --line:#2c3358;
  --txt:#e9ecff; --dim:#8891b8; --dim2:#5f6890;
  --gold:#ffc84a; --green:#3ddc97; --red:#ff5d73; --blue:#5aa9ff; --purple:#d14bff; --pink:#ff4d8d; --cyan:#37e6e6;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
body{
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  background:radial-gradient(900px 600px at 50% -10%,#241a42 0%,var(--bg) 55%);
  color:var(--txt);min-height:100vh;padding:14px 12px 40px;
}
.wrap{max-width:900px;margin:0 auto}

header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:22px;letter-spacing:2px;
   background:linear-gradient(90deg,var(--pink),var(--purple),var(--blue));
   -webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:11px;color:var(--dim);margin-top:2px}
a.back{font-size:11.5px;color:var(--dim);text-decoration:none;border:1px solid var(--line);
        padding:6px 10px;border-radius:8px;background:var(--panel)}
a.back:hover{color:var(--txt);border-color:var(--dim2)}

.stats-top{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:10px;
      padding:7px 12px;text-align:center;min-width:70px;flex:1}
.pill .k{font-size:10px;color:var(--dim);letter-spacing:1px}
.pill .v{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}

.stage{display:flex;justify-content:center}
.board-wrap{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;
            position:relative;max-width:460px;width:100%}
canvas#game{display:block;width:100%;height:auto;border-radius:8px;background:#0a0c16;touch-action:none}

.overlay{position:absolute;inset:10px;background:rgba(10,12,22,.9);border-radius:8px;
        display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;
        text-align:center;padding:20px}
.overlay.show{display:flex}
.overlay h2{font-size:24px;letter-spacing:3px;
   background:linear-gradient(90deg,var(--pink),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
.overlay p{font-size:12.5px;color:var(--dim);line-height:1.8;max-width:380px}
.overlay .big{font-size:15px;color:var(--txt);font-weight:700}

button{font-family:inherit;font-weight:700;cursor:pointer;border:none;border-radius:10px;
       padding:11px 20px;font-size:13.5px;color:#fff;transition:transform .1s,filter .1s}
button:hover:not(:disabled){filter:brightness(1.12);transform:translateY(-1px)}
button:active:not(:disabled){transform:translateY(0)}
.b-gold{background:linear-gradient(135deg,var(--gold),#ff9d2e);color:#3a2a05}
.b-purple{background:linear-gradient(135deg,var(--purple),#8b5cff)}
.b-ghost{background:var(--panel2);border:1px solid var(--line);color:var(--txt)}

.hint{font-size:11.5px;color:var(--dim);line-height:1.9;margin-top:12px;text-align:center}
.hint b{color:var(--gold)}
.hint .k{display:inline-block;background:var(--panel2);border:1px solid var(--line);
        border-radius:5px;padding:1px 6px;font-size:10.5px;color:var(--txt);margin:0 2px}
</style>
<!-- star-arcade-shell -->
<style id="star-arcade-shell-style">
  html{ -webkit-text-size-adjust:100%; font-size:106%; }
  body{ max-width:100vw; overflow-x:hidden; }
  canvas{ max-width:100%; height:auto; }
  .sa-home-btn{
    position:fixed; top:12px; right:12px; z-index:999999;
    width:42px; height:42px; border-radius:50%;
    background:rgba(11,14,26,.72); border:1px solid rgba(255,255,255,.28);
    display:flex; align-items:center; justify-content:center;
    font-size:20px; text-decoration:none; color:#fff;
    box-shadow:0 4px 14px rgba(0,0,0,.35);
    -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px);
    -webkit-tap-highlight-color:transparent;
    cursor:pointer;
  }
  .sa-home-btn:hover{ background:rgba(11,14,26,.92); }
  @media (max-width:480px){
    .sa-home-btn{ width:38px; height:38px; font-size:16px; top:8px; right:8px; }
  }
</style>
</head>
<body>
<a class="sa-home-btn" href="platform.html" title="回到首頁" aria-label="回到首頁">🏠</a>

<div class="wrap">

<header>
  <div>
    <h1>泡泡龍</h1>
    <div class="sub">BUBBLE POP · 消除益智</div>
  </div>
  <a class="back" href="platform.html">← 回遊樂園</a>
</header>

<div class="stats-top">
  <div class="pill"><div class="k">分數</div><div class="v" id="score">0</div></div>
  <div class="pill"><div class="k">最高分</div><div class="v" id="best">0</div></div>
  <div class="pill"><div class="k">已發射</div><div class="v" id="shots">0</div></div>
</div>

<div class="stage">
<div class="board-wrap">
  <canvas id="game" width="430" height="680"></canvas>

  <div class="overlay show" id="ovStart">
    <h2>泡泡龍</h2>
    <p>拖曳畫面瞄準方向，放開手指／滑鼠即可發射泡泡。將 3 顆以上同色泡泡連在一起就會消除，懸空的泡泡也會一併掉落得分。泡泡堆疊到底線前清空畫面，撐得越久分數越高！</p>
    <button class="b-gold" id="btnStart">開始遊戲</button>
    <div class="hint">
      <b>操作：</b><span class="k">拖曳瞄準</span>方向　<span class="k">放開</span>發射
      <span class="k">← →</span>微調　<span class="k">空白</span>發射　<span class="k">P</span>暫停
    </div>
  </div>

  <div class="overlay" id="ovPause">
    <h2>暫停中</h2>
    <button class="b-gold" id="btnResume">繼續遊戲</button>
  </div>

  <div class="overlay" id="ovOver">
    <h2>遊戲結束</h2>
    <div class="big" id="ovScore">分數：0</div>
    <p id="ovNote"></p>
    <button class="b-purple" id="btnRetry">再挑戰一次</button>
  </div>
</div>
</div>

</div>

<script>
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;

const elScore = document.getElementById('score');
const elBest = document.getElementById('best');
const elShots = document.getElementById('shots');
const ovStart = document.getElementById('ovStart');
const ovPause = document.getElementById('ovPause');
const ovOver = document.getElementById('ovOver');
const ovScore = document.getElementById('ovScore');
const ovNote = document.getElementById('ovNote');

const BEST_KEY = 'bubblePopBest';
let best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10);
elBest.textContent = best;

const STATE = { START:0, PLAY:1, PAUSE:2, OVER:3 };
let state = STATE.START;

const R = 22;
const MARGIN = 16;
const COLS = 9;
const ROWH = R * Math.sqrt(3);
const SHOOT_SPEED = 620;
const shooterX = W/2, shooterY = H - 70;
const dangerY = shooterY - 70;

const COLORS = ['#ff5d73','#ffc84a','#3ddc97','#5aa9ff','#d14bff'];

function colsInRow(row){ return (row%2===0) ? COLS : COLS-1; }
function slotX(row,col){ return MARGIN + R + col*2*R + (row%2===1 ? R : 0); }
function slotY(row){ return MARGIN + R + row*ROWH; }

let placed, occupied, moving, aimAngle, aiming, particles;
let score, shots, shotsSinceRow, rowInterval, curColor, nextColor;

function key(row,col){ return row+','+col; }

function availableColors(){
  const set = new Set();
  for(const b of placed) set.add(b.color);
  return set.size ? Array.from(set) : COLORS.slice();
}
function pickColor(){
  const pool = availableColors();
  return pool[Math.floor(Math.random()*pool.length)];
}

function addRow(){
  for(const b of placed){ b.row++; }
  occupied = new Set(Array.from(placed, b=>key(b.row,b.col)));
  const n = colsInRow(0);
  for(let c=0;c<n;c++){
    placed.push({ row:0, col:c, color: COLORS[Math.floor(Math.random()*COLORS.length)] });
    occupied.add(key(0,c));
  }
}

function reset(){
  placed = [];
  occupied = new Set();
  for(let r=0;r<6;r++){
    const n = colsInRow(r);
    for(let c=0;c<n;c++){
      placed.push({ row:r, col:c, color: COLORS[Math.floor(Math.random()*COLORS.length)] });
      occupied.add(key(r,c));
    }
  }
  moving = null;
  aimAngle = 0;
  aiming = false;
  particles = [];
  score = 0;
  shots = 0;
  shotsSinceRow = 0;
  rowInterval = 8;
  curColor = pickColor();
  nextColor = pickColor();
  updateHud();
}
reset();

function updateHud(){
  elScore.textContent = score;
  elShots.textContent = shots;
}

function neighborsDist(){ return 2*R + 3; }

function connectedSameColor(startRow,startCol,color){
  const visited = new Set();
  const stack = [[startRow,startCol]];
  const found = [];
  visited.add(key(startRow,startCol));
  const byKey = new Map(placed.map(b=>[key(b.row,b.col), b]));
  while(stack.length){
    const [r,c] = stack.pop();
    const b = byKey.get(key(r,c));
    if(!b || b.color !== color) continue;
    found.push(b);
    const px = slotX(r,c), py = slotY(r);
    for(const other of placed){
      const k2 = key(other.row,other.col);
      if(visited.has(k2)) continue;
      const ox = slotX(other.row,other.col), oy = slotY(other.row);
      const dx = ox-px, dy = oy-py;
      if(Math.sqrt(dx*dx+dy*dy) < neighborsDist() && other.color === color){
        visited.add(k2);
        stack.push([other.row, other.col]);
      }
    }
  }
  return found;
}

function findFloating(){
  const anchored = new Set();
  const stack = [];
  for(const b of placed){
    if(b.row === 0){ anchored.add(key(b.row,b.col)); stack.push(b); }
  }
  while(stack.length){
    const b = stack.pop();
    const px = slotX(b.row,b.col), py = slotY(b.row);
    for(const other of placed){
      const k2 = key(other.row,other.col);
      if(anchored.has(k2)) continue;
      const ox = slotX(other.row,other.col), oy = slotY(other.row);
      const dx = ox-px, dy = oy-py;
      if(Math.sqrt(dx*dx+dy*dy) < neighborsDist()){
        anchored.add(k2);
        stack.push(other);
      }
    }
  }
  return placed.filter(b => !anchored.has(key(b.row,b.col)));
}

function popBubbles(list, color){
  for(const b of list){
    occupied.delete(key(b.row,b.col));
    for(let i=0;i<8;i++){
      particles.push({ x:slotX(b.row,b.col), y:slotY(b.row), vx:(Math.random()-0.5)*260, vy:(Math.random()-0.7)*260, life:0.5, color:b.color });
    }
  }
  placed = placed.filter(b => !list.includes(b));
}

function findEmptySlot(px,py){
  const estRow = Math.max(0, Math.round((py - MARGIN - R) / ROWH));
  let best = null, bestD = Infinity;
  for(let r = Math.max(0,estRow-2); r <= estRow+2; r++){
    const n = colsInRow(r);
    for(let c=0;c<n;c++){
      if(occupied.has(key(r,c))) continue;
      const sx = slotX(r,c), sy = slotY(r);
      const d = (sx-px)*(sx-px) + (sy-py)*(sy-py);
      if(d < bestD){ bestD = d; best = {row:r, col:c}; }
    }
  }
  return best;
}

function checkGameOver(){
  for(const b of placed){
    if(slotY(b.row) + R >= dangerY){ gameOver(); return; }
  }
}

function gameOver(){
  state = STATE.OVER;
  let isBest = false;
  if(score > best){ best = score; localStorage.setItem(BEST_KEY, String(best)); isBest = true; }
  elBest.textContent = best;
  ovScore.textContent = '分數：' + score;
  ovNote.textContent = isBest ? '🎉 新紀錄！太強了！' : ('最高紀錄：' + best);
  ovOver.classList.add('show');
}

function clampAimFromPointer(px,py){
  let dx = px - shooterX, dy = py - shooterY;
  if(dy > -20) dy = -20;
  let ang = Math.atan2(dx, -dy);
  const limit = 75 * Math.PI/180;
  if(ang > limit) ang = limit;
  if(ang < -limit) ang = -limit;
  aimAngle = ang;
}

function shoot(){
  if(state !== STATE.PLAY || moving) return;
  const vx = Math.sin(aimAngle) * SHOOT_SPEED;
  const vy = -Math.cos(aimAngle) * SHOOT_SPEED;
  moving = { x:shooterX, y:shooterY, vx, vy, color:curColor };
  curColor = nextColor;
  nextColor = pickColor();
  shots++;
  shotsSinceRow++;
  if(shotsSinceRow >= rowInterval){
    shotsSinceRow = 0;
    addRow();
    rowInterval = Math.max(4, 8 - Math.floor(score/300));
    checkGameOver();
  }
  updateHud();
}

function rectClamp(){}

function updateMoving(dt){
  if(!moving) return;
  moving.x += moving.vx*dt;
  moving.y += moving.vy*dt;
  if(moving.x - R < 0){ moving.x = R; moving.vx = -moving.vx; }
  if(moving.x + R > W){ moving.x = W-R; moving.vx = -moving.vx; }

  let hit = false;
  if(moving.y - R <= MARGIN){ hit = true; }
  if(!hit){
    for(const b of placed){
      const dx = slotX(b.row,b.col) - moving.x, dy = slotY(b.row) - moving.y;
      if(Math.sqrt(dx*dx+dy*dy) < 2*R - 2){ hit = true; break; }
    }
  }
  if(hit){
    const slot = findEmptySlot(moving.x, moving.y);
    if(slot){
      placed.push({ row:slot.row, col:slot.col, color:moving.color });
      occupied.add(key(slot.row,slot.col));
      const cluster = connectedSameColor(slot.row, slot.col, moving.color);
      if(cluster.length >= 3){
        popBubbles(cluster, moving.color);
        score += cluster.length*10 + Math.max(0,cluster.length-3)*5;
        const floating = findFloating();
        if(floating.length){
          popBubbles(floating, null);
          score += floating.length*15;
        }
      }
      updateHud();
      checkGameOver();
    }
    moving = null;
  }
}

function updateParticles(dt){
  for(const p of particles){
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 500*dt; p.life -= dt;
  }
  particles = particles.filter(p=>p.life>0);
}

function update(dt){
  updateMoving(dt);
  updateParticles(dt);
}

function drawBubble(x,y,color,glow){
  ctx.beginPath();
  ctx.arc(x,y,R-1,0,Math.PI*2);
  const grd = ctx.createRadialGradient(x-R*0.35,y-R*0.35,R*0.2,x,y,R);
  grd.addColorStop(0,'#ffffff55');
  grd.addColorStop(0.25,color);
  grd.addColorStop(1,color);
  ctx.fillStyle = grd;
  if(glow){ ctx.shadowColor = color; ctx.shadowBlur = 14; }
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = '#00000033';
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

function drawGrid(){
  for(const b of placed){
    drawBubble(slotX(b.row,b.col), slotY(b.row), b.color, false);
  }
}

function drawDanger(){
  ctx.strokeStyle = 'rgba(255,93,115,0.4)';
  ctx.setLineDash([6,6]);
  ctx.beginPath();
  ctx.moveTo(0, dangerY);
  ctx.lineTo(W, dangerY);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawAim(){
  if(state !== STATE.PLAY) return;
  let x = shooterX, y = shooterY;
  let vx = Math.sin(aimAngle), vy = -Math.cos(aimAngle);
  ctx.strokeStyle = 'rgba(233,236,255,0.35)';
  ctx.lineWidth = 2;
  ctx.setLineDash([4,7]);
  ctx.beginPath();
  ctx.moveTo(x,y);
  let steps = 0;
  let len = 900;
  while(len > 0 && steps < 3){
    let tx = x + vx*len, ty = y + vy*len;
    let hitWall = false;
    if(tx < R){ const t=(R-x)/vx; ty = y+vy*t; tx = R; hitWall = true; }
    else if(tx > W-R){ const t=(W-R-x)/vx; ty = y+vy*t; tx = W-R; hitWall = true; }
    if(ty < MARGIN){ const t=(MARGIN-y)/vy; tx = x+vx*t; ty = MARGIN; hitWall = false; ctx.lineTo(tx,ty); break; }
    ctx.lineTo(tx,ty);
    if(!hitWall) break;
    len -= Math.sqrt((tx-x)*(tx-x)+(ty-y)*(ty-y));
    x = tx; y = ty; vx = -vx;
    steps++;
  }
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawShooter(){
  drawBubble(shooterX, shooterY, curColor, true);
  drawBubble(shooterX + 60, shooterY, nextColor, false);
  ctx.fillStyle = 'var(--dim)';
  ctx.fillStyle = '#8891b8';
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('下一顆', shooterX + 60, shooterY + R + 14);
}

function drawParticles(){
  for(const p of particles){
    ctx.globalAlpha = Math.max(0,p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x,p.y,4,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawMoving(){
  if(moving) drawBubble(moving.x, moving.y, moving.color, true);
}

function draw(){
  ctx.fillStyle = '#0a0c16';
  ctx.fillRect(0,0,W,H);
  drawDanger();
  drawGrid();
  drawAim();
  drawMoving();
  drawShooter();
  drawParticles();
}

let lastT = null;
function frame(t){
  if(lastT===null) lastT = t;
  let dt = (t-lastT)/1000;
  lastT = t;
  if(dt > 0.05) dt = 0.05;
  if(state === STATE.PLAY) update(dt);
  draw();
  requestAnimationFrame(frame);
}

function togglePause(){
  if(state===STATE.PLAY){ state=STATE.PAUSE; ovPause.classList.add('show'); }
  else if(state===STATE.PAUSE){ state=STATE.PLAY; ovPause.classList.remove('show'); }
}

document.getElementById('btnStart').onclick = ()=>{ reset(); ovStart.classList.remove('show'); state=STATE.PLAY; };
document.getElementById('btnRetry').onclick = ()=>{ reset(); ovOver.classList.remove('show'); state=STATE.PLAY; };
document.getElementById('btnResume').onclick = togglePause;

function pointerPos(e){
  const rect = cv.getBoundingClientRect();
  const scaleX = W/rect.width, scaleY = H/rect.height;
  return { x:(e.clientX-rect.left)*scaleX, y:(e.clientY-rect.top)*scaleY };
}

cv.addEventListener('pointerdown', e=>{
  if(state !== STATE.PLAY) return;
  aiming = true;
  const p = pointerPos(e);
  clampAimFromPointer(p.x,p.y);
});
cv.addEventListener('pointermove', e=>{
  if(!aiming) return;
  const p = pointerPos(e);
  clampAimFromPointer(p.x,p.y);
});
window.addEventListener('pointerup', ()=>{
  if(aiming){ aiming=false; shoot(); }
});

window.addEventListener('keydown', e=>{
  if(state !== STATE.PLAY){
    if(e.code==='KeyP' || e.code==='Escape') togglePause();
    return;
  }
  if(e.code==='ArrowLeft'){ e.preventDefault(); aimAngle = Math.max(-75*Math.PI/180, aimAngle - 0.06); }
  else if(e.code==='ArrowRight'){ e.preventDefault(); aimAngle = Math.min(75*Math.PI/180, aimAngle + 0.06); }
  else if(e.code==='Space'){ e.preventDefault(); shoot(); }
  else if(e.code==='KeyP' || e.code==='Escape'){ togglePause(); }
});

requestAnimationFrame(frame);
</script>
</body>
</html>
