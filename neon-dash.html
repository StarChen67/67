<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no, viewport-fit=cover">
<title>光速衝刺 — Neon Dash</title>
<style>
:root{
  --bg:#0b0d18; --panel:#161a2e; --panel2:#1f2440; --line:#2c3358;
  --txt:#e9ecff; --dim:#8891b8; --dim2:#5f6890;
  --gold:#ffc84a; --green:#3ddc97; --red:#ff5d73; --blue:#5aa9ff; --purple:#d14bff; --pink:#ff4d8d; --cyan:#37e6e6;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
body{
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  background:radial-gradient(900px 600px at 50% -10%,#241a42 0%,var(--bg) 55%);
  color:var(--txt);min-height:100vh;padding:14px 12px 40px;
}
.wrap{max-width:900px;margin:0 auto}

header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:22px;letter-spacing:2px;
   background:linear-gradient(90deg,var(--cyan),var(--pink),var(--purple));
   -webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:11px;color:var(--dim);margin-top:2px}
a.back{font-size:11.5px;color:var(--dim);text-decoration:none;border:1px solid var(--line);
        padding:6px 10px;border-radius:8px;background:var(--panel)}
a.back:hover{color:var(--txt);border-color:var(--dim2)}

.stats-top{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:10px;
      padding:7px 12px;text-align:center;min-width:70px;flex:1}
.pill .k{font-size:10px;color:var(--dim);letter-spacing:1px}
.pill .v{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.pill .v.hearts{color:var(--red);letter-spacing:2px}
.pill .v.combo{color:var(--gold)}

.board-wrap{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;
            position:relative}
canvas#game{display:block;width:100%;height:auto;border-radius:8px;background:#0a0c16;touch-action:none}

.overlay{position:absolute;inset:10px;background:rgba(10,12,22,.88);border-radius:8px;
        display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;
        text-align:center;padding:20px}
.overlay.show{display:flex}
.overlay h2{font-size:24px;letter-spacing:3px;
   background:linear-gradient(90deg,var(--cyan),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.overlay p{font-size:12.5px;color:var(--dim);line-height:1.8;max-width:480px}
.overlay .big{font-size:15px;color:var(--txt);font-weight:700}

button{font-family:inherit;font-weight:700;cursor:pointer;border:none;border-radius:10px;
       padding:11px 20px;font-size:13.5px;color:#fff;transition:transform .1s,filter .1s}
button:hover:not(:disabled){filter:brightness(1.12);transform:translateY(-1px)}
button:active:not(:disabled){transform:translateY(0)}
.b-gold{background:linear-gradient(135deg,var(--gold),#ff9d2e);color:#3a2a05}
.b-purple{background:linear-gradient(135deg,var(--purple),#8b5cff)}
.b-ghost{background:var(--panel2);border:1px solid var(--line);color:var(--txt)}

.hint{font-size:11.5px;color:var(--dim);line-height:1.9;margin-top:12px;text-align:center}
.hint b{color:var(--gold)}
.hint .k{display:inline-block;background:var(--panel2);border:1px solid var(--line);
        border-radius:5px;padding:1px 6px;font-size:10.5px;color:var(--txt);margin:0 2px}

.touch{display:none;gap:10px;margin-top:12px;justify-content:center}
.touch button{flex:1;max-width:220px;height:64px;font-size:15px;border-radius:14px;
              background:var(--panel2);border:1px solid var(--line);color:var(--txt);
              display:flex;align-items:center;justify-content:center;gap:6px;font-weight:800;letter-spacing:2px}
.touch button:active{background:var(--panel)}
@media(max-width:720px){ .touch{display:flex} }
</style>
<!-- star-arcade-shell -->
<style id="star-arcade-shell-style">
  html{ -webkit-text-size-adjust:100%; font-size:106%; }
  body{ max-width:100vw; overflow-x:hidden; }
  canvas{ max-width:100%; height:auto; }
  .sa-home-btn{
    position:fixed; top:12px; right:12px; z-index:999999;
    width:42px; height:42px; border-radius:50%;
    background:rgba(11,14,26,.72); border:1px solid rgba(255,255,255,.28);
    display:flex; align-items:center; justify-content:center;
    font-size:20px; text-decoration:none; color:#fff;
    box-shadow:0 4px 14px rgba(0,0,0,.35);
    -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px);
    -webkit-tap-highlight-color:transparent;
    cursor:pointer;
  }
  .sa-home-btn:hover{ background:rgba(11,14,26,.92); }
  @media (max-width:480px){
    .sa-home-btn{ width:38px; height:38px; font-size:16px; top:8px; right:8px; }
  }
</style>
</head>
<body>
<a class="sa-home-btn" href="platform.html" title="回到首頁" aria-label="回到首頁">🏠</a>

<div class="wrap">

<header>
  <div>
    <h1>光速衝刺</h1>
    <div class="sub">NEON DASH · 無盡跑酷</div>
  </div>
  <a class="back" href="platform.html">← 回遊樂園</a>
</header>

<div class="stats-top">
  <div class="pill"><div class="k">分數</div><div class="v" id="score">0</div></div>
  <div class="pill"><div class="k">連擊倍率</div><div class="v combo" id="combo">x1</div></div>
  <div class="pill"><div class="k">生命</div><div class="v hearts" id="hearts">♥♥♥</div></div>
  <div class="pill"><div class="k">最高分</div><div class="v" id="best">0</div></div>
</div>

<div class="board-wrap">
  <canvas id="game" width="900" height="400"></canvas>

  <div class="overlay show" id="ovStart">
    <h2>NEON DASH</h2>
    <p>穿越無盡的霓虹賽道，跳過尖刺與坑洞、滑過偵測無人機，蒐集能量球拉高連擊倍率。速度會隨時間持續加快，撐得越久分數越高！</p>
    <button class="b-gold" id="btnStart">開始遊戲</button>
    <div class="hint">
      <b>操作：</b><span class="k">空白 / ↑ / 點擊上半</span>跳躍（可二段跳）
      <span class="k">↓ / 點擊下半</span>滑行　<span class="k">P</span>暫停
    </div>
  </div>

  <div class="overlay" id="ovPause">
    <h2>暫停中</h2>
    <button class="b-gold" id="btnResume">繼續遊戲</button>
  </div>

  <div class="overlay" id="ovOver">
    <h2>遊戲結束</h2>
    <div class="big" id="ovScore">分數：0</div>
    <p id="ovNote"></p>
    <button class="b-purple" id="btnRetry">再挑戰一次</button>
  </div>
</div>

<div class="touch">
  <button id="tapJump">⬆ 跳躍</button>
  <button id="tapSlide">⬇ 滑行</button>
</div>

</div>

<script>
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const GROUND_Y = H - 64;

const elScore = document.getElementById('score');
const elCombo = document.getElementById('combo');
const elHearts = document.getElementById('hearts');
const elBest = document.getElementById('best');
const ovStart = document.getElementById('ovStart');
const ovPause = document.getElementById('ovPause');
const ovOver = document.getElementById('ovOver');
const ovScore = document.getElementById('ovScore');
const ovNote = document.getElementById('ovNote');

const BEST_KEY = 'neonDashBest';
let best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10);
elBest.textContent = best;

const STATE = { START:0, PLAY:1, PAUSE:2, OVER:3 };
let state = STATE.START;

const GRAVITY = 2600;
const JUMP_V = -880;
const BASE_SPEED = 340;

let player, obstacles, orbs, particles, speed, distance, score, combo, hearts, invuln, spawnTimer, nextSpawnGap, elapsed;

function reset(){
  player = { x:110, y:GROUND_Y-48, w:34, h:48, vy:0, grounded:true, jumps:1, sliding:false, slideT:0 };
  obstacles = [];
  orbs = [];
  particles = [];
  speed = BASE_SPEED;
  distance = 0;
  score = 0;
  combo = 1;
  hearts = 3;
  invuln = 0;
  spawnTimer = 0;
  nextSpawnGap = 900;
  elapsed = 0;
  updateHud();
}
reset();

function updateHud(){
  elScore.textContent = Math.floor(score);
  elCombo.textContent = 'x' + combo;
  elHearts.textContent = '♥'.repeat(hearts) + '<span style="opacity:.25">' + '♥'.repeat(3-hearts) + '</span>';
  elHearts.innerHTML = '♥'.repeat(hearts) + '<span style="opacity:.2">'+'♥'.repeat(Math.max(0,3-hearts))+'</span>';
}

function playerRect(){
  const h = player.sliding ? 26 : 48;
  const y = GROUND_Y - h;
  return { x:player.x, y, w:player.w, h };
}

function spawnObstacle(){
  const kinds = ['spike','drone','pit'];
  const kind = kinds[Math.floor(Math.random()*kinds.length)];
  if(kind==='spike'){
    obstacles.push({ type:'spike', x:W+20, w:32, h:40 });
  } else if(kind==='drone'){
    obstacles.push({ type:'drone', x:W+20, w:38, h:34, y:GROUND_Y-70 });
  } else {
    const gw = 80 + Math.random()*50;
    obstacles.push({ type:'pit', x:W+20, w:gw });
  }
  // occasional orb cluster near/above the obstacle
  if(Math.random() < 0.7){
    const baseX = W + 20 + 120 + Math.random()*60;
    const high = Math.random() < 0.5;
    const oy = high ? GROUND_Y - 140 : GROUND_Y - 60;
    const n = 3 + Math.floor(Math.random()*3);
    for(let i=0;i<n;i++){
      orbs.push({ x: baseX + i*34, y: oy + Math.sin(i*0.8)*14, r:9, got:false });
    }
  }
}

function hit(){
  if(invuln > 0) return;
  hearts--;
  combo = 1;
  invuln = 1.4;
  for(let i=0;i<14;i++){
    particles.push({ x:player.x+player.w/2, y:GROUND_Y-24, vx:(Math.random()-0.5)*300, vy:-Math.random()*300, life:0.6, color:'#ff5d73' });
  }
  if(hearts <= 0){
    gameOver();
  }
}

function gameOver(){
  state = STATE.OVER;
  const finalScore = Math.floor(score);
  let isBest = false;
  if(finalScore > best){ best = finalScore; localStorage.setItem(BEST_KEY, String(best)); isBest = true; }
  elBest.textContent = best;
  ovScore.textContent = '分數：' + finalScore;
  ovNote.textContent = isBest ? '🎉 新紀錄！太強了！' : ('最高紀錄：' + best);
  ovOver.classList.add('show');
}

function doJump(){
  if(state !== STATE.PLAY) return;
  if(player.jumps > 0){
    player.vy = JUMP_V * (player.grounded ? 1 : 0.85);
    player.grounded = false;
    player.jumps--;
  }
}
function startSlide(on){
  if(state !== STATE.PLAY) return;
  player.sliding = on && player.grounded;
}

window.addEventListener('keydown', e=>{
  if(e.code==='Space' || e.code==='ArrowUp' || e.code==='KeyW'){ e.preventDefault(); doJump(); }
  else if(e.code==='ArrowDown' || e.code==='KeyS'){ e.preventDefault(); startSlide(true); }
  else if(e.code==='KeyP' || e.code==='Escape'){ togglePause(); }
});
window.addEventListener('keyup', e=>{
  if(e.code==='ArrowDown' || e.code==='KeyS') startSlide(false);
});

function togglePause(){
  if(state===STATE.PLAY){ state=STATE.PAUSE; ovPause.classList.add('show'); }
  else if(state===STATE.PAUSE){ state=STATE.PLAY; ovPause.classList.remove('show'); }
}

document.getElementById('btnStart').onclick = ()=>{ reset(); ovStart.classList.remove('show'); state=STATE.PLAY; };
document.getElementById('btnRetry').onclick = ()=>{ reset(); ovOver.classList.remove('show'); state=STATE.PLAY; };
document.getElementById('btnResume').onclick = togglePause;

cv.addEventListener('pointerdown', e=>{
  const rect = cv.getBoundingClientRect();
  const relY = (e.clientY - rect.top) / rect.height;
  if(relY > 0.55) startSlide(true); else doJump();
});
cv.addEventListener('pointerup', ()=> startSlide(false));
cv.addEventListener('pointerleave', ()=> startSlide(false));

const tapJump = document.getElementById('tapJump');
const tapSlide = document.getElementById('tapSlide');
tapJump.addEventListener('pointerdown', e=>{ e.preventDefault(); doJump(); });
tapSlide.addEventListener('pointerdown', e=>{ e.preventDefault(); startSlide(true); });
tapSlide.addEventListener('pointerup', e=>{ startSlide(false); });
tapSlide.addEventListener('pointerleave', ()=> startSlide(false));

function rectsOverlap(a,b){
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}

let lastT = null;
function frame(t){
  if(lastT===null) lastT = t;
  let dt = (t - lastT) / 1000;
  lastT = t;
  if(dt > 0.05) dt = 0.05;

  if(state === STATE.PLAY) update(dt);
  draw();
  requestAnimationFrame(frame);
}

function groundExistsAt(x){
  for(const ob of obstacles){
    if(ob.type==='pit' && x > ob.x && x < ob.x+ob.w) return false;
  }
  return true;
}

function update(dt){
  elapsed += dt;
  speed = BASE_SPEED + Math.min(420, elapsed * 9);
  distance += speed * dt;
  score += speed * dt * 0.08 * combo;
  if(invuln > 0) invuln -= dt;

  // player physics
  player.vy += GRAVITY * dt;
  const groundH = player.sliding ? 26 : 48;
  player.y = (player.y || GROUND_Y-48) + player.vy*dt;

  const footX = player.x + player.w*0.5;
  const hasGround = groundExistsAt(footX);
  const floorY = GROUND_Y - groundH;
  if(hasGround && player.y >= floorY){
    player.y = floorY;
    player.vy = 0;
    player.grounded = true;
    player.jumps = 1;
  } else {
    player.grounded = false;
    if(player.y > H + 20){
      // fell into a pit
      hit();
      player.y = GROUND_Y - 48;
      player.vy = 0;
      player.grounded = true;
      player.jumps = 1;
    }
  }

  const pRect = { x:player.x, y:player.y, w:player.w, h:groundH };

  // spawn obstacles
  spawnTimer += dt*1000;
  if(spawnTimer >= nextSpawnGap){
    spawnTimer = 0;
    nextSpawnGap = Math.max(650, 1500 - elapsed*8) + Math.random()*400;
    spawnObstacle();
  }

  // move obstacles & collide
  for(const ob of obstacles){
    ob.x -= speed*dt;
    if(ob.type==='spike'){
      const obRect = { x:ob.x, y:GROUND_Y-ob.h, w:ob.w, h:ob.h };
      if(rectsOverlap(pRect, obRect) && !ob.hitDone){
        hit(); ob.hitDone = true;
      } else if(ob.x + ob.w < player.x && !ob.passed){
        ob.passed = true; combo = Math.min(9, combo+1);
      }
    } else if(ob.type==='drone'){
      const obRect = { x:ob.x, y:ob.y, w:ob.w, h:ob.h };
      if(rectsOverlap(pRect, obRect) && !ob.hitDone){
        hit(); ob.hitDone = true;
      } else if(ob.x + ob.w < player.x && !ob.passed){
        ob.passed = true; combo = Math.min(9, combo+1);
      }
    }
  }
  obstacles = obstacles.filter(o => o.x + (o.w||0) > -40);

  // orbs
  for(const orb of orbs){
    orb.x -= speed*dt;
    if(!orb.got){
      const dx = (player.x+player.w/2) - orb.x;
      const dy = (player.y+groundH/2) - orb.y;
      if(Math.sqrt(dx*dx+dy*dy) < orb.r + 22){
        orb.got = true;
        score += 20 * combo;
        combo = Math.min(9, combo+1);
        for(let i=0;i<6;i++) particles.push({ x:orb.x, y:orb.y, vx:(Math.random()-0.5)*160, vy:-Math.random()*160, life:0.4, color:'#ffc84a' });
      }
    }
  }
  orbs = orbs.filter(o => !o.got && o.x > -40);

  // particles
  for(const p of particles){
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 500*dt; p.life -= dt;
  }
  particles = particles.filter(p=>p.life>0);

  updateHud();
}

function drawBackground(){
  ctx.fillStyle = '#0a0c16';
  ctx.fillRect(0,0,W,H);
  // sun
  const grd = ctx.createLinearGradient(0,60,0,GROUND_Y);
  grd.addColorStop(0,'#ff4d8d');
  grd.addColorStop(1,'#7a2bff');
  ctx.save();
  ctx.beginPath();
  ctx.arc(W*0.78, 150, 70, 0, Math.PI*2);
  ctx.clip();
  ctx.fillStyle = grd;
  ctx.fillRect(W*0.78-70,80,140,140);
  ctx.restore();

  // stars
  ctx.fillStyle = '#ffffff';
  const starOffset = (distance*0.15) % 60;
  for(let i=0;i<40;i++){
    const sx = (i*47 - starOffset*0.3) % W;
    const sy = (i*29) % (GROUND_Y-40);
    ctx.globalAlpha = 0.15 + (i%5)*0.08;
    ctx.fillRect(((sx%W)+W)%W, sy, 2, 2);
  }
  ctx.globalAlpha = 1;

  // horizon grid
  ctx.strokeStyle = 'rgba(55,230,230,0.35)';
  ctx.lineWidth = 1;
  const gridOffset = (distance*1.2) % 40;
  for(let x=-40; x<W+40; x+=40){
    ctx.beginPath();
    ctx.moveTo(x - gridOffset, GROUND_Y);
    ctx.lineTo(W/2 + (x-W/2-gridOffset)*2.2, H);
    ctx.stroke();
  }
  for(let i=0;i<8;i++){
    const yy = GROUND_Y + i*i*1.6 + (distance*2)%12;
    ctx.beginPath();
    ctx.moveTo(0,yy); ctx.lineTo(W,yy); ctx.stroke();
  }

  // ground
  ctx.fillStyle = '#141830';
  ctx.fillRect(0,GROUND_Y,W,H-GROUND_Y);
  ctx.strokeStyle = 'var(--cyan)';
  ctx.strokeStyle = '#37e6e6';
  ctx.beginPath(); ctx.moveTo(0,GROUND_Y); ctx.lineTo(W,GROUND_Y); ctx.stroke();

  // pit gaps drawn as background holes
  for(const ob of obstacles){
    if(ob.type==='pit'){
      ctx.fillStyle = '#0a0c16';
      ctx.fillRect(ob.x, GROUND_Y, ob.w, H-GROUND_Y);
    }
  }
}

function drawPlayer(){
  const groundH = player.sliding ? 26 : 48;
  const y = player.y;
  const flash = invuln > 0 && Math.floor(invuln*12)%2===0;
  ctx.fillStyle = flash ? '#ffffff88' : '#37e6e6';
  ctx.shadowColor = '#37e6e6';
  ctx.shadowBlur = 12;
  ctx.beginPath();
  const r = 8;
  const x = player.x, w = player.w, h = groundH;
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;
  // eye
  ctx.fillStyle = '#0a0c16';
  ctx.fillRect(x+w-12, y+8, 5, 5);
}

function drawObstacles(){
  for(const ob of obstacles){
    if(ob.type==='spike'){
      ctx.fillStyle = '#ff5d73';
      ctx.shadowColor = '#ff5d73'; ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.moveTo(ob.x, GROUND_Y);
      ctx.lineTo(ob.x+ob.w/2, GROUND_Y-ob.h);
      ctx.lineTo(ob.x+ob.w, GROUND_Y);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;
    } else if(ob.type==='drone'){
      ctx.fillStyle = '#d14bff';
      ctx.shadowColor = '#d14bff'; ctx.shadowBlur = 10;
      ctx.fillRect(ob.x, ob.y, ob.w, ob.h);
      ctx.fillStyle = '#ffffffaa';
      ctx.fillRect(ob.x+6, ob.y+ob.h/2-2, ob.w-12, 4);
      ctx.shadowBlur = 0;
    }
  }
}

function drawOrbs(){
  for(const orb of orbs){
    if(orb.got) continue;
    ctx.fillStyle = '#ffc84a';
    ctx.shadowColor = '#ffc84a'; ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.arc(orb.x, orb.y, orb.r, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

function drawParticles(){
  for(const p of particles){
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, 4, 4);
  }
  ctx.globalAlpha = 1;
}

function draw(){
  drawBackground();
  drawObstacles();
  drawOrbs();
  drawPlayer();
  drawParticles();
}

requestAnimationFrame(frame);
</script>
</body>
</html>
